<!doctype html>
<!--
  파워 온! 빅테크 투어 — HTML 틀
  tools/build.mjs가 아래 표시 자리에 스타일, 그림·맵 데이터, 자바스크립트를 끼워 넣어
  dist/index.html 파일 하나를 만든다. 이 파일을 직접 열지 말고 빌드 결과를 연다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파워 온! 빅테크 투어</title>
<style>
/* 파워 온! 빅테크 투어 — 화면 스타일 */

/* 창 전체를 검은 바탕으로 채우고 스크롤을 없앤다 */
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05060e;
}

body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}

/* 캔버스는 창 전체를 덮는다 (CSS 크기 = 창 크기, 항상 정수).
   캔버스의 픽셀 수는 main.js가 장치 픽셀 수와 똑같이 맞추고,
   게임 화면은 그 안의 가운데에 정수 픽셀 위치로 그린다 (layout.js). */
#screen {
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated; /* 확대할 때 픽셀이 흐려지지 않게 */
  image-rendering: crisp-edges;
}

/* 닉네임 입력창: 위치·크기는 main.js가 캔버스에 맞춰 정한다 */
#nick-wrap {
  position: fixed;
  display: none;
}

#nick {
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  padding: 0 0.3em;
  border: 2px solid #ffd27a;
  border-radius: 0;
  outline: none;
  background: #1a1030;
  color: #ffffff;
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  font-weight: bold;
  text-align: center;
  caret-color: #ffd23f;
}

#nick:focus {
  border-color: #ff8ad8;
}

/* 파일 선택 입력은 숨긴다 (관리자 Ctrl+Shift+L로 연다) */
#import-file {
  display: none;
}

/* ── 모바일 판 전용 (dist/mobile.html). body.mobile일 때만 보인다 ─────────────── */
#nick-go,
#touch-ui,
#mute-btn,
#rotate-hint {
  display: none;
}

body.mobile,
body.mobile #screen {
  touch-action: none; /* 두 번 눌러 확대·스크롤 막기 */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}

/* 닉네임 "시작" 버튼: 위치는 main.js가 입력창 바로 아래에 정한다 */
body.mobile.typing #nick-go {
  display: block;
  position: fixed;
  border: 2px solid #ffd27a;
  background: #1428a0;
  color: #ffffff;
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-weight: bold;
  touch-action: manipulation;
}

/* 터치 버튼: 게임 중에만. 왼쪽 아래 ◀ ▶, 오른쪽 아래 점프 (휴대폰 가로 화면의 양옆 여백 자리) */
body.mobile.playing #touch-ui {
  display: block;
}
.tpad {
  position: fixed;
  bottom: calc(14px + env(safe-area-inset-bottom));
  display: flex;
  gap: 10px;
}
.tpad-left {
  left: calc(10px + env(safe-area-inset-left));
}
.tpad-right {
  right: calc(12px + env(safe-area-inset-right));
}
.tbtn {
  width: 64px;
  height: 64px;
  padding: 0;
  border: 2px solid rgba(255, 255, 255, 0.55);
  border-radius: 50%;
  background: rgba(20, 16, 48, 0.55);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
.tbtn svg {
  width: 34px;
  height: 34px;
}
.tbtn-jump {
  width: 78px;
  height: 78px;
  border-color: rgba(255, 210, 63, 0.8);
  background: rgba(20, 40, 160, 0.55);
}
.tbtn.on {
  background: rgba(255, 210, 63, 0.55);
}

/* 소리 버튼: 오른쪽 위 */
body.mobile #mute-btn {
  display: flex;
  position: fixed;
  top: calc(8px + env(safe-area-inset-top));
  right: calc(8px + env(safe-area-inset-right));
  width: 40px;
  height: 40px;
  padding: 0;
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-radius: 50%;
  background: rgba(20, 16, 48, 0.6);
  color: #ffffff;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
}
body.mobile.playing #mute-btn {
  top: auto;
  bottom: calc(100px + env(safe-area-inset-bottom));
}
#mute-btn svg {
  width: 22px;
  height: 22px;
}
#mute-btn .ic-off,
#mute-btn.muted .ic-on {
  display: none;
}
#mute-btn.muted .ic-off {
  display: inline;
}

/* 세로로 들면 "가로로 돌려 주세요" */
@media (orientation: portrait) {
  body.mobile #rotate-hint {
    display: flex;
    position: fixed;
    inset: 0;
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #05060e;
    color: #ffd23f;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-weight: bold;
    font-size: 18px;
  }
  #rotate-hint svg {
    width: 56px;
    height: 56px;
  }
}

</style>
</head>
<body>
<!-- 게임 화면 -->
<canvas id="screen" width="320" height="180"></canvas>

<!-- 닉네임 입력창: 한글 입력(IME)을 받으려고 진짜 입력창을 캔버스 위에 겹쳐 놓는다 -->
<div id="nick-wrap">
  <input id="nick" type="text" maxlength="8" autocomplete="off" spellcheck="false" aria-label="닉네임">
</div>

<!-- 모바일 판 전용 (dist/mobile.html, window.PF_MOBILE = true일 때 touch.js가 body에 mobile 꼬리표를 붙여 보인다).
     PC 판에서는 CSS로 숨겨져 있다. 아이콘은 lucide (chevron-left / chevron-right / arrow-up / volume-2 / volume-x / rotate-ccw) -->
<button id="nick-go" type="button">시작</button>
<div id="touch-ui">
  <div class="tpad tpad-left">
    <button class="tbtn" type="button" data-key="VLeft" aria-label="왼쪽으로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="m15 18-6-6 6-6"></path></svg></button>
    <button class="tbtn" type="button" data-key="VRight" aria-label="오른쪽으로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="m9 18 6-6-6-6"></path></svg></button>
  </div>
  <div class="tpad tpad-right">
    <button class="tbtn tbtn-jump" type="button" data-key="VJump" aria-label="점프"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="m5 12 7-7 7 7"></path> <path d="M12 19V5"></path></svg></button>
  </div>
</div>
<button id="mute-btn" type="button" aria-label="소리 끄기·켜기"><span class="ic-on"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path> <path d="M16 9a5 5 0 0 1 0 6"></path> <path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg></span><span class="ic-off"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M11 4.702a.7.7 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.7.7 0 0 0 11 19.298z"></path> <path d="m16.5 14.5 5-5"></path> <path d="m16.5 9.5 5 5"></path></svg></span></button>
<div id="rotate-hint"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path> <path d="M3 3v5h5"></path></svg><p>휴대폰을 가로로 돌려 주세요</p></div>

<!-- 관리자: 랭킹 불러오기용 파일 선택 (화면에는 안 보임) -->
<input id="import-file" type="file" accept=".json,application/json">

<noscript>이 게임은 자바스크립트가 켜져 있어야 실행됩니다.</noscript>

      gateHalfW: 0.75, // 문 반쪽 폭 (x)
      gateLow: 450, gateHigh: 2700, // 문이 열린 높이
      // 게이트 통과가 또렷이 보이게 (2026-11-10 사용자: "게이트 통과가 좀 더 명확했으면"):
      //   카메라가 게이트 앞에서 먼저 멈춰 문 전체와 차가 문을 지나는 모습이 한 화면에 보이고, 지난 직후 잠깐 느리게 흐른다
      gateCamStop: 1300, // 차가 게이트 이만큼 앞에 오면 카메라가 멈춘다 (카메라 ↔ 게이트 = camBack + 이 값)
      gateCamLift: 1100, // 멈춘 카메라는 이 높이로 부드럽게 맞춰진다: 어떤 높이로 지나가도 게이트가 화면 같은 자리에 잡히고, 결과 글자는 그 위 하늘에 놓인다

      finishSkipAfter: 0.6, // 이만큼 지난 뒤 Enter·Space로 건너뛰기

      rollUpright: 35, // 착지 때 이 각도(도) 안이면 똑바로 착지. 넘으면 "삐딱 착지!" (쿵 + 감점)

      launchPerfect: 0.13, // 경사로 꼭대기 순간과 Space 사이가 이 초 안이면 퍼펙트 발사

 * spritedefs.js — 큰 그림(스프라이트) 이름·크기·프레임 약속표 (순수 데이터, 2판 콘텐츠)

    sanitizeNickname: sanitizeNickname,

      if (i % 45 === 20) segs[i].sprites.push({ kind: 'tower', x: (hash01(i * 3) < 0.5 ? -1 : 1) * (2.3 + hash01(i) * 0.8) }); // 엔진 시험대
      if (i % 70 === 40) segs[i].sprites.push({ kind: 'tank3d', x: (hash01(i * 5) < 0.5 ? -1 : 1) * 2.6 }); // 물탱크
    }
    return segs;
  }

  function segAt(segs, z, seg) { return segs[clamp(Math.floor(z / seg), 0, segs.length - 1)]; }

  function roadY(segs, z, segLen) {
    var s = segAt(segs, z, segLen);
    var k = clamp((z - s.z1) / segLen, 0, 1);
    return s.y1 + (s.y2 - s.y1) * k;
  }

  // 비행 시작 z (경사로 연출 동안 flySpeed로 flipTime초 간 뒤)
  function flyStartZ(R) { return R.rampSeg * R.seg + R.flySpeed * R.flipTime; }

  /**
   * 2단계 한 판 만들기
   * @param opts.config 설정 (기본 config.js)
   * @param opts.onEvent 알림 받을 함수 (name, data)
   */
  function Ride(opts) {
    opts = opts || {};
    this.cfg = opts.config || config;
    this.R = this.cfg.ROADSTER;
    var R = this.R;
    this.emit = opts.onEvent || function () {};
    this.phase = 'ready';
    this.phaseTime = 0;
    this.clock = 0; // 'ready'·'done' 밖에서 흐르는 시간 (봇 망설임 계산용)
    this.t = 0; // 전체 흐른 시간 (애니메이션용)
    this.score = 0; // 2단계에서 번 점수 (game.js가 1단계 점수에 더해 보여 준다)
    this.hopBuf = 0; // 점프 입력을 기억하는 남은 시간 (착지 직전에 누른 Space를 살린다)
    this.noAirAt = -9; // "공기 부족" 글자를 마지막으로 띄운 시각 (너무 자주 뜨지 않게)
    this.baseScore = opts.baseScore || 0; // 1단계에서 번 점수. 떠오르는 +금액을 "지금 연봉에서 실제로 오르는 만큼"으로 보여 주는 데 쓴다
    this.air = R.air; // 남은 공기 (0-100)
    this.combo = 0; // 차량 무사고 연속
    this.invuln = 0; // 부딪힌 뒤 깜빡이며 통과하는 남은 시간
    this.thrusting = false; // 이번 단계에 추진기를 뿜었는지 (그림: 흰 김)
    this.floaters = []; // 떠오르는 글자 (화면 좌표)
    this.roll = 0; // 킥플립으로 구른 각도 (라디안, 한 번 뜬 동안 쌓인다. 뒤에서 보면 차가 통째로 돈다)
    this.rollTurns = 0; // 이번에 뜬 동안 다 돈 바퀴 수
    this.pitch = 0; // 경사로 루프 각도 (뒤에서 보면 차가 위아래로 눌렸다 뒤집힌다)
    this.launch = null; // 경사로 발사 판정: 'perfect' / 'good' / 'late' / 'none'
    this.chain = 0; // 위성을 이어 모은 수 (체인 배율)
    this.gateOk = null; // 결승 게이트 통과 여부
    this.gateMiss = null; // 놓쳤다면 까닭: 'low'(문턱 아래) | 'high'(문 위) | 'left' | 'right'(옆으로 벗어남)
    this.gateBonus = 0;

    this.track = buildTrack(R);
    this.trackLength = this.track.length * R.seg;
    this.z = 0; // 차가 앞으로 간 거리
    this.x = 0; // 가로 위치 (도로 가운데 0, 양 끝 ±1)
    this.h = 0; // 도로 위 높이
    this.vh = 0; // 높이 속도 (+ 위로)
    this.speed = 0; // 앞으로 가는 빠르기
    this.boost = 0; // 부스트 남은 시간
    this.steerDir = 0; // 이번 단계 조향 (-1 / 0 / 1, 그림 기울기용)
    this.skyX = 0; // 커브를 돌수록 하늘·산이 옆으로 흐른다 (그림용)
    this.camLift = 0; // 카메라가 차 높이를 따라 올라간 정도 (경사로·비행)
    this.camFreeze = null; // 결승 뒤 멈춘 카메라 { z, x, lift }
    this.traffic = R.traffic.map(function (e, i) {
      var v = R.vehicles[e[2]];
      return { id: i, type: e[2], z: e[0] * R.seg, x: R.lanes[e[1]], speed: e[3] * R.maxSpeed, w: v.w, h: v.h, len: v.len, big: !!v.big, passed: false, hit: false, minGap: 9, over: false };
    });
    this.lineup = R.lineup.map(function (e, i) {
      var v = R.vehicles[e[1]];
      return { id: 100 + i, type: e[1], z: R.lineupSeg * R.seg, x: e[0], speed: 0, w: v.w, h: v.h, len: v.len, big: !!v.big, passed: false, hit: false, minGap: 9, over: false, lineup: true };
    });
    this.lineupDone = false;
    this.boosts = R.boosts.map(function (e) { return { z: e[0] * R.seg, x: R.lanes[e[1]], used: false }; });
    this.tanks = R.tanks.map(function (e) { return { z: e[0] * R.seg, x: R.lanes[e[1]], taken: false }; });

    // 비행 코스 (z는 비행 시작 뒤 조각 수로 적은 것을 실제 z로)
    var fz = flyStartZ(R);
    this.flyZ0 = fz;
    this.gateZ = fz + R.flySegs * R.seg;
    var fly = R.fly.map(function (e, i) {
      var o = { id: i, kind: e[1], z: fz + e[0] * R.seg, x: e[2], h: e[3], baseH: e[3] };
      if (o.kind === 'drone') { o.amp = e[4] || 0; o.hit = false; o.near = false; o.phase = hash01(i + 3) * TAU; }
      else if (o.kind === 'tank') { o.taken = false; }
      else throw new Error('모르는 비행 물체: ' + o.kind);
      return o;
    });
    // 스타링크 위성 줄: 시작 → 끝을 잇고 물결(높이·좌우)을 더한다
    this.trails = R.trails.map(function (t, ti) {
      var n = t[1];
      var sats = [];
      for (var k = 0; k < n; k++) {
        var u = n > 1 ? k / (n - 1) : 0;
        var o = {
          kind: 'sat', trail: ti, index: k,
          z: fz + (t[0] + k * R.satGap) * R.seg,
          x: t[2] + (t[4] - t[2]) * u + Math.cos(u * TAU) * (t[7] || 0) - (t[7] || 0),
          h: t[3] + (t[5] - t[3]) * u + Math.sin(u * TAU) * (t[6] || 0),
          done: false, ok: false,
        };
        sats.push(o);
        fly.push(o);
      }
      return { index: ti, sats: sats, got: 0, finished: false };
    });
    this.fly = fly.sort(function (a, b) { return a.z - b.z; });

    this.stats = {
      vehicles: 0, vehiclesTotal: this.traffic.length + this.lineup.length,
      sats: 0, satsTotal: this.fly.filter(function (o) { return o.kind === 'sat'; }).length,
      trails: 0, trailsTotal: R.trails.length, nearDrone: 0,
      tanks: 0, crashes: 0, bestCombo: 0, tricks: 0, nearMiss: 0, jumpsOver: 0, boosts: 0,
      launch: null, bestMult: 1, bestChain: 0, penalties: 0, gate: null, gateBonus: 0, topKmh: 0,
    };
  }

  // 0-1 진행도 (HUD 막대): 레이싱 0-0.5, 비행 0.5-1
  Ride.prototype.progress = function () {
    var R = this.R;
    if (this.phase === 'ready') return 0;
    if (this.phase === 'drive') return 0.5 * clamp(this.z / (R.rampSeg * R.seg), 0, 1);
    if (this.phase === 'flip') return 0.5;
    if (this.phase === 'fly') return 0.5 + 0.5 * clamp((this.z - this.flyZ0) / (this.gateZ - this.flyZ0), 0, 1);
    return 1;
  };

  // 지금 속도를 km/h로 (화면 표시)
  Ride.prototype.kmh = function () { return Math.round(this.speed / this.R.maxSpeed * this.R.kmh); };

  Ride.prototype.setPhase = function (p, eventName, data) {
    this.phase = p;
    this.phaseTime = 0;
    if (eventName) this.emit(eventName, data);
  };

  Ride.prototype.addFloater = function (text, x, y, color) {
    // 위쪽 안내 띠(약 y 36까지)와 겹치지 않게 그 아래에서 떠오른다
    this.floaters.push({ text: text, x: x, y: Math.max(48, y), life: 0.9, max: 0.9, color: color });
  };

  // 점수 더하기 + 떠오르는 글자 (1단계처럼 연봉으로: "+300만")
  Ride.prototype.gain = function (points, label, color, y) {
    this.score += points;
    this.addFloater((label ? label + ' ' : '') + fun.formatSalary(points, true, true, this.baseScore + this.score - points), FX.x, y || FX.y, color || '#ffe066');
  };

  // 감점 (2단계 점수는 0 아래로 내려가지 않는다). 떠오르는 글자는 빨간 "-150만"
  Ride.prototype.lose = function (points, label) {
    var take = Math.min(points, this.score);
    this.score -= take;
    this.stats.penalties += take;
    this.addFloater((label ? label + ' ' : '') + '-' + fun.formatSalary(take, false, true, this.baseScore + this.score), FX.x, FX.y, '#ff8a8a');
  };

  // 차량 무사고 연속 보너스: 앞 성공에 이어지면 comboStep × 연속 (최대 comboMax). 첫 성공은 0
  Ride.prototype.comboBonus = function () {
    var S = this.R.score;
    var b = Math.min(S.comboMax, S.comboStep * this.combo);
    this.combo++;
    if (this.combo - 1 > this.stats.bestCombo) this.stats.bestCombo = this.combo - 1;
    return b;
  };

  // 부딪힘: 감점 + 연속 끊김 + (레이싱이면) 느려짐 + 잠깐 깜빡이며 통과 (즉사 없음)
  Ride.prototype.crash = function (penalty) {
    var R = this.R;
    this.invuln = R.crashInvuln;
    this.combo = 0;
    this.stats.crashes++;
    if (this.phase === 'drive') this.speed *= R.crashSpeed;
    this.lose(penalty || 0, '쿵!');
    this.emit('rcrash');
  };

  Ride.prototype.updateFloaters = function (dt) {
    for (var i = this.floaters.length - 1; i >= 0; i--) {
      var f = this.floaters[i];
      f.life -= dt;
      f.y -= 20 * dt;
      if (f.life <= 0) this.floaters.splice(i, 1);
    }
  };

  /**
   * 한 단계 진행
   * @param input { left, right, jumpHeld, jumpPressed, down, skip }
   */
  Ride.prototype.update = function (dt, input) {
    input = input || NONE;
    this.t += dt;
    this.phaseTime += dt;
    if (this.invuln > 0) this.invuln = Math.max(0, this.invuln - dt);
    this.thrusting = false;
    this.steerDir = 0;
    if (this.phase !== 'ready' && this.phase !== 'done') this.clock += dt;
    switch (this.phase) {
      case 'ready':
        if (this.phaseTime >= this.R.readyTime) this.setPhase('drive', 'rdrive');
        break;
      case 'drive': this.updateDrive(dt, input); break;
      case 'flip': this.updateFlip(dt, input); break;
      case 'fly': this.updateFly(dt, input); break;
      case 'finish': this.updateFinish(dt, input); break;
      default: break;
    }
    // 카메라가 차 높이를 따라 올라간다 (레이싱 점프 때는 따라가지 않아 차가 화면에서 뜬다)
    // 경사로·비행 때 카메라는 차 높이의 일부만 따라간다 (camFollow): 높이 날수록 차가 화면 위로 떠올라 땅·그림자로 높이를 가늠한다
    var lift = this.phase === 'flip' || this.phase === 'fly' ? this.h * (this.R.camFollow || 1) : 0;
    if (this.phase !== 'finish' && this.phase !== 'done') this.camLift += (lift - this.camLift) * Math.min(1, dt * 3);
    // 게이트 앞에서 멈춘 카메라는 정해진 높이(gateCamLift)로 부드럽게 맞춘다 (게이트가 늘 화면 같은 자리에 보이게)
    if (this.camFreeze && this.R.gateCamLift != null) this.camFreeze.lift += (this.R.gateCamLift - this.camFreeze.lift) * Math.min(1, dt * 5);
    this.updateFloaters(dt);
  };

  // ── 킥플립 (공중에서 ↓) ──────────────────────────────────
  // 구른 각도가 똑바로(0, 한 바퀴, 두 바퀴 …)에서 얼마나 벗어났는지 (도)
  function rollTilt(roll) {
    var r = ((roll % TAU) + TAU) % TAU;
    return Math.min(r, TAU - r) * 180 / Math.PI;
  }

  /**
   * 공중에서 구르기: ↓를 누르는 동안 구르고(공기 rollCost/초), 떼면 그 바퀴를 마저 돌아 똑바로 선다.
   * @returns 이번 단계에 새로 다 돈 바퀴 수
   */
  Ride.prototype.updateRoll = function (dt, input) {
    var R = this.R;
    var before = Math.floor(this.roll / TAU + 1e-6);
    if (input.down && this.air > 0) {
      this.roll += R.rollSpeed * dt;
      this.air = Math.max(0, this.air - R.rollCost * dt);
    } else {
      var next = Math.ceil(this.roll / TAU - 1e-6) * TAU; // 다음 똑바로
      if (this.roll < next) this.roll = Math.min(next, this.roll + R.rollSpeed * dt);
    }
    var after = Math.floor(this.roll / TAU + 1e-6);
    this.rollTurns += after - before;
    return after - before;
  };

  Ride.prototype.rolling = function () { return rollTilt(this.roll) > 0.5; };

  // 레이싱에서 땅에 닿을 때: 똑바로면 킥플립 점수, 삐딱하면 쿵
  Ride.prototype.landTrick = function () {
    var R = this.R;
    var S = R.score;
    var turns = this.rollTurns;
    if (rollTilt(this.roll) > R.rollUpright) {
      this.stats.crashes++;
      this.combo = 0;
      this.invuln = R.crashInvuln * 0.6;
      this.speed *= 0.6;
      this.lose(S.badLanding, '삐딱 착지!');
      this.emit('rbadland');
    } else if (turns > 0) {
      var pts = S.trick * turns + S.trickExtra * (turns - 1);
      this.stats.tricks += turns;
      this.gain(pts, turns >= 3 ? '트리플 킥플립!' : turns === 2 ? '더블 킥플립!' : '킥플립!', '#ff9af0', 96);
      this.emit('rtrick', { turns: turns, points: pts });
    }
    this.roll = 0;
    this.rollTurns = 0;
  };

  // ── 레이싱 ──────────────────────────────────────────────
  Ride.prototype.segAt = function (z) { return segAt(this.track, z, this.R.seg); };
  Ride.prototype.roadY = function (z) { return roadY(this.track, z, this.R.seg); };

  Ride.prototype.updateDrive = function (dt, input) {
    var R = this.R;
    var top = R.maxSpeed * (this.boost > 0 ? R.boostMul : 1);
    var offroad = Math.abs(this.x) > 1;
    if (this.boost > 0) this.boost = Math.max(0, this.boost - dt);
    if (offroad && this.h <= 0 && this.speed > R.maxSpeed * R.offroadMax) {
      this.speed = Math.max(R.maxSpeed * R.offroadMax, this.speed - R.offroadDecel * dt); // 도로 밖이면 느려진다
    } else {
      this.speed = Math.min(top, this.speed + R.accel * dt); // 저절로 가속
    }
    if (this.speed > top) this.speed = Math.max(top, this.speed - R.accel * dt);
    var pct = this.speed / R.maxSpeed;
    var seg = this.segAt(this.z);
    // 조향 + 커브 원심력 (빠를수록 세다)
    var dx = dt * R.steer * Math.min(1, pct + 0.25);
    if (input.left && !input.right) { this.x -= dx; this.steerDir = -1; }
    else if (input.right && !input.left) { this.x += dx; this.steerDir = 1; }
    this.x -= dt * pct * pct * seg.curve * R.centrifugal;
    this.x = clamp(this.x, -2.2, 2.2);
    this.skyX += seg.curve * pct * dt * 0.02;

    var zBefore = this.z;
    this.z += this.speed * dt;
    var kmh = this.kmh();
    if (kmh > this.stats.topKmh) this.stats.topKmh = kmh;

    // 점프: 땅에서 누르면 위로 (공기 hopCost). 공중에서 꾹 누르면 천천히 내려온다
    var onGround = this.h <= 0;
    // 점프 입력 기억: 방금 눌렀으면 hopBuffer초 동안 기억했다가 땅에 닿는 순간 점프한다
    if (input.jumpPressed) this.hopBuf = R.hopBuffer || 0.0001;
    else if (this.hopBuf > 0) this.hopBuf = Math.max(0, this.hopBuf - dt);
    // 공기가 모자라 점프를 못 하면 까닭을 알려 준다 (키가 안 먹은 것으로 보이지 않게, 1초에 한 번만)
    if (input.jumpPressed && onGround && this.air < R.hopCost && this.t - this.noAirAt > 1) {
      this.noAirAt = this.t;
      this.addFloater('공기 부족!', FX.x, FX.y, '#ff8a8a');
    }
    if (this.hopBuf > 0 && onGround && this.air >= R.hopCost) {
      this.hopBuf = 0;
      this.vh = R.jumpSpeed;
      this.h = 1;
      this.air -= R.hopCost;
      this.emit('rhop');
      onGround = false;
    }
    if (!onGround) {
      var g = R.jumpGravity;
      if (input.jumpHeld && this.air > 0) {
        g -= R.hoverAccel;
        this.air = Math.max(0, this.air - R.holdCost * dt);
        this.thrusting = true;
      }
      this.vh -= g * dt;
      if (this.thrusting && this.vh < -R.glideFall) this.vh = -R.glideFall;
      this.h += this.vh * dt;
      if (this.h > R.maxJumpH) { this.h = R.maxJumpH; if (this.vh > 0) this.vh = 0; }
      this.updateRoll(dt, input); // 공중에서 ↓ = 킥플립
      if (this.h <= 0) {
        if (this.vh < -2500) this.emit('rtouch');
        this.h = 0;
        this.vh = 0;
        this.landTrick();
      }
    } else {
      this.air = Math.min(R.air, this.air + R.groundRefill * dt);
    }

    this.moveTraffic(dt);
    this.checkDrive(zBefore);
    if (this.z >= R.rampSeg * R.seg) {
      // J자 경사로 시작
      this.roll = 0;
      this.rollTurns = 0;
      this.flipH0 = this.h;
      this.speed = R.flySpeed;
      this.setPhase('flip', 'rflip');
    }
  };

  // Tesla 차량은 각자 차선을 달린다 (가로막은 다섯 대 앞에서는 멈춘다)
  Ride.prototype.moveTraffic = function (dt) {
    var end = (this.R.lineupSeg - 6) * this.R.seg;
    this.traffic.forEach(function (v) { if (v.z < end) v.z = Math.min(end, v.z + v.speed * dt); });
  };

  /**
   * 레이싱 판정: 차량 충돌·추월·점프로 넘기·아슬아슬, 가로막은 다섯 대, 부스트, 공기 탱크
   *   z가 겹치는 동안: |x 차이| < 두 반쪽 폭 합이고 높이가 차량보다 낮으면 부딪힘.
   *   차량 뒤 끝이 차 앞 끝을 완전히 지나면 추월 (가장 가까웠던 옆 간격으로 아슬아슬, 위를 지났으면 점프 넘기)
   */
  Ride.prototype.checkDrive = function (zBefore) {
    var R = this.R;
    var S = R.score;
    var self = this;
    var pz = this.z;
    function check(v) {
      if (v.passed || v.hit) return;
      var dz = Math.abs(v.z - pz);
      var reach = (v.len + R.carLen) / 2;
      var gapX = Math.abs(v.x - self.x) - (v.w + R.carW);
      if (dz < reach) {
        if (gapX < 0) {
          if (self.h >= v.h) v.over = true; // 위로 지나는 중
          else if (self.invuln <= 0) {
            v.hit = true;
            self.crash(S.crashPenalty);
            return;
          }
        } else if (gapX < v.minGap) v.minGap = gapX;
      }
      if (pz - v.z > reach) {
        v.passed = true;
        if (v.lineup) return; // 가로막은 줄은 한꺼번에 센다
        var near = !v.over && v.minGap <= R.nearMiss;
        var base = v.big ? S.semi : S.vehicle;
        var pts = base * (v.over ? S.jumpOver : near ? S.nearMul : 1) + self.comboBonus();
        self.stats.vehicles++;
        if (near) { self.stats.nearMiss++; self.emit('rnear'); }
        if (v.over) self.stats.jumpsOver++;
        self.gain(pts, v.over ? '점프!' : near ? '아슬아슬!' : '추월', near ? '#7cf2ff' : v.over ? '#ff9af0' : '#ffe066', 96);
        self.emit('rpass', { points: pts, type: v.type, near: near, over: v.over });
      }
    }
    this.traffic.forEach(check);
    this.lineup.forEach(check);
    if (!this.lineupDone && this.lineup.every(function (v) { return v.passed || v.hit; })) {
      this.lineupDone = true;
      var ok = this.lineup.filter(function (v) { return !v.hit; }).length;
      this.stats.vehicles += ok;
      if (ok === this.lineup.length) {
        var lp = S.lineup * ok + this.comboBonus();
        this.gain(lp, '다섯 대 넘기!', '#ffd23f', 90);
        this.emit('rlineup', { points: lp });
      }
    }
    this.boosts.forEach(function (b) { // 부스트 패드: 땅에서 밟으면
      if (b.used || self.h > 0) return;
      if (b.z > zBefore - 1 && b.z <= pz && Math.abs(b.x - self.x) < 0.3) {
        b.used = true;
        self.boost = R.boostTime;
        self.stats.boosts++;
        self.gain(S.boost, '부스트!', '#7cf2ff', 100);
        self.emit('rboost');
      }
    });
    this.tanks.forEach(function (tk) { // 공기 탱크: 지나가며 닿으면 (조금 떠 있어도 먹는다)
      if (tk.taken || self.h > 700) return;
      if (tk.z > zBefore - 1 && tk.z <= pz && Math.abs(tk.x - self.x) < 0.3) {
        tk.taken = true;
        self.air = Math.min(R.air, self.air + R.tankAir);
        self.stats.tanks++;
        self.gain(S.tank, '공기', '#9be7ff', 100);
        self.emit('rtank');
      }
    });
  };

  // ── J자 경사로 ──────────────────────────────────────────
  // 꼭대기(뒤집히는 순간)에 닿는 시각(초): 퍼펙트 발사 기준
  Ride.prototype.launchAt = function () { return this.R.flipTime * this.R.rampShare; };

  /**
   * 경사로 연출 (flipTime초, 앞으로는 flySpeed로 계속 간다)
   *   앞 rampShare: 휜 면을 타고 올라 일어섰다가(pitch π/2) 꼭대기에서 뒤집힌다(pitch π, 높이 rampH)
   *   나머지: 같은 방향으로 루프를 마저 돌아(pitch 2π) 비행 시작 높이(flyStartH)로
   *   꼭대기 순간에 Space: launchPerfect초 안 = 퍼펙트(+점수, 공기 가득), launchGood초 안 = 좋음
   */
  Ride.prototype.updateFlip = function (dt, input) {
    var R = this.R;
    var S = R.score;
    this.z += R.flySpeed * dt;
    this.x += (0 - this.x) * Math.min(1, dt * 3); // 경사로 가운데로
    // 꼭대기보다 한참 일찍(launchEarly초 넘게) 누른 것은 세지 않는다: 기회는 한 번뿐이라 주행 때 누르던 Space로 날리지 않게
    var tooEarly = this.phaseTime < this.launchAt() - (R.launchEarly || 99);
    if (input && input.jumpPressed && !this.launch && !tooEarly) {
      var off = Math.abs(this.phaseTime - this.launchAt());
      if (off <= R.launchPerfect) {
        this.launch = 'perfect';
        this.air = R.air;
        this.gain(S.launchPerfect, '', '#7cf2ff', 96); // 큰 글자 "퍼펙트 발사!"는 화면 가운데 (main.js)
        this.emit('rperfect');
      } else if (off <= R.launchGood) {
        this.launch = 'good';
        this.gain(S.launchGood, '', '#ffe066', 96);
        this.emit('rgoodlaunch');
      } else {
        this.launch = 'late';
        this.addFloater(this.phaseTime < this.launchAt() ? '너무 빨라요' : '늦었어요', FX.x, 96, '#c8bfe0');
        this.emit('rlatelaunch');
      }
      this.stats.launch = this.launch;
    }
    var k = clamp(this.phaseTime / R.flipTime, 0, 1);
    var share = R.rampShare;
    var h0 = this.flipH0 || 0;
    if (k < share) {
      var u = k / share;
      this.h = h0 + (R.rampH - h0) * (1 - Math.cos(u * Math.PI / 2)); // 처음엔 완만하다가 벽을 타고 가파르게
      this.pitch = u * Math.PI; // 일어섰다가 꼭대기에서 뒤집힘
    } else {
      var v = (k - share) / (1 - share);
      this.h = R.rampH + (R.flyStartH - R.rampH) * easeInOut(v) + Math.sin(v * Math.PI) * 300;
      this.pitch = Math.PI + v * Math.PI; // 루프를 마저 돈다
      this.thrusting = true;
    }
    if (k >= 1) {
      if (!this.launch) { this.launch = 'none'; this.stats.launch = 'none'; }
      this.pitch = 0;
      this.h = R.flyStartH;
      this.vh = 0;
      this.z = this.flyZ0;
      this.speed = R.flySpeed;
      this.air = Math.max(this.air, R.flyStartAir);
      this.roll = 0;
      this.rollTurns = 0;
      this.setPhase('fly', 'rflygo');
    }
  };

  // ── 비행 ────────────────────────────────────────────────
  // 위성 체인 배율: 이어 모은 수 chain으로 1 → 2 → 3 → 4 (satChainStep개마다 +1, 최대 satMultMax)
  Ride.prototype.chainMult = function () {
    var R = this.R;
    if (this.chain <= 0) return 1;
    return Math.min(R.satMultMax, 1 + Math.floor((this.chain - 1) / R.satChainStep));
  };

  // 드론의 지금 높이 (위아래로 오르내린다)
  Ride.prototype.droneH = function (o) { return o.baseH + Math.sin(this.t * 2.2 + o.phase) * o.amp; };

  Ride.prototype.updateFly = function (dt, input) {
    var R = this.R;
    var zBefore = this.z;
    this.z += this.speed * dt;
    // ←→ 좌우
    if (input.left && !input.right) { this.x -= R.flySteer * dt; this.steerDir = -1; }
    else if (input.right && !input.left) { this.x += R.flySteer * dt; this.steerDir = 1; }
    this.x = clamp(this.x, -1.6, 1.6);
    // 킥플립: ↓로 구르는 동안은 추진기를 못 쓴다. 한 바퀴마다 점수
    var turned = this.updateRoll(dt, input);
    if (turned > 0) {
      this.stats.tricks += turned;
      this.gain(R.score.flyTrick * turned, '회전!', '#ff9af0', 96);
      this.emit('rtrick', { turns: turned, points: R.score.flyTrick * turned });
    }
    var acc = -R.flyGravity;
    if (input.jumpHeld && this.air > 0 && !this.rolling()) {
      acc += R.flyThrust;
      this.air = Math.max(0, this.air - R.flyCost * dt);
      this.thrusting = true;
    }
    this.vh = clamp(this.vh + acc * dt, -R.flyMaxVh, R.flyMaxVh);
    this.h += this.vh * dt;
    if (this.h > R.flyMaxH) { this.h = R.flyMaxH; if (this.vh > 0) this.vh = 0; }
    if (this.h <= 0) { // 땅에 닿으면 굴러가며 공기를 조금씩 채운다 (실패해도 계속, 대신 높은 링은 놓친다)
      this.h = 0;
      if (this.vh < 0) this.vh = 0;
      this.air = Math.min(R.air, this.air + R.flyRefill * dt);
    }
    this.checkFly(zBefore);
    // 게이트 바로 앞에서 카메라를 먼저 세운다: 문 전체가 화면에 들어오고 차가 문을 지나가는 모습이 보인다
    if (!this.camFreeze && this.z >= this.gateZ - (R.gateCamStop || 0)) this.camFreeze = { z: this.z, x: this.x, lift: this.camLift };
    if (this.z >= this.gateZ) this.passGate();
  };

  // 비행 판정: z가 물체를 지나는 순간 좌우·높이 거리로 위성 모으기·드론 충돌/아슬아슬·탱크
  Ride.prototype.checkFly = function (zBefore) {
    var R = this.R;
    var S = R.score;
    var self = this;
    var cy = this.h + R.carHalfH; // 차 가운데 높이
    var pz = this.z;
    this.fly.forEach(function (o) {
      if (o.kind === 'drone') o.h = self.droneH(o);
      if (o.z <= zBefore || o.z > pz) return; // 이번 단계에 지나간 것만
      var dx = (o.x - self.x) * R.roadWidth;
      var dh = o.h - cy;
      var d = Math.sqrt(dx * dx + dh * dh);
      if (o.kind === 'sat' && !o.done) {
        o.done = true;
        var tr = self.trails[o.trail];
        // 위성은 판정 중심이 그림보다 satDrop만큼 아래다 (차가 위성 조금 아래를 지나가도 모인다 → 위성이 차에 안 가린다)
        var dhs = dh - (R.satDrop || 0);
        var ds = Math.sqrt(dx * dx + dhs * dhs);
        if (ds <= R.satR) {
          o.ok = true;
          self.stats.sats++;
          self.chain++;
          self.air = Math.min(R.air, self.air + (R.satAir || 0)); // 위성을 모으면 공기가 조금 찬다
          tr.got++;
          if (self.chain > self.stats.bestChain) self.stats.bestChain = self.chain;
          var mult = self.chainMult();
          if (mult > self.stats.bestMult) self.stats.bestMult = mult;
          var pts = S.sat * mult;
          self.gain(pts, mult > 1 ? '×' + mult : '', '#9be7ff', 100);
          self.emit('rsat', { points: pts, mult: mult });
          if (tr.got === tr.sats.length && !tr.finished) { // 한 줄을 다 모음
            tr.finished = true;
            self.stats.trails++;
            self.gain(S.trail, '위성 줄 완주!', '#7cf29a', 88);
            self.emit('rtrail', { points: S.trail });
          }
        } else {
          if (self.chain > 0) self.addFloater('체인 끊김', FX.x, 96, '#c8bfe0');
          self.chain = 0;
          self.emit('rsatmiss');
        }
      } else if (o.kind === 'drone' && !o.hit) {
        if (self.invuln <= 0 && d <= R.droneR) {
          o.hit = true;
          self.air = Math.max(0, self.air - R.droneAirLoss);
          self.chain = 0;
          self.crash(S.dronePenalty);
        } else if (d <= R.droneNear && !o.near) { // 바짝 스치고 지나감
          o.near = true;
          self.stats.nearDrone++;
          self.gain(S.nearDrone, '아슬아슬!', '#7cf2ff', 92);
          self.emit('rneardrone');
        }
      } else if (o.kind === 'tank' && !o.taken && d <= R.tankR) {
        o.taken = true;
        self.air = Math.min(R.air, self.air + R.tankAir);
        self.stats.tanks++;
        self.gain(S.tank, '공기', '#9be7ff', 100);
        self.emit('rtank');
      }
    });
  };

  // 지금 위치 그대로 게이트에 닿으면 어떻게 되는지 (다가갈 때 안내·문틀 색, 지나는 순간 판정에 함께 쓴다)
  //   'ok' = 문 사이(|x| ≤ gateHalfW - carW, 높이 gateLow-gateHigh) / 'low' = 문턱 아래 / 'high' = 문 위 / 'left'·'right' = 그쪽으로 벗어남
  Ride.prototype.gateAim = function () {
    var R = this.R;
    if (this.h < R.gateLow) return 'low';
    if (this.h + R.carHalfH * 2 > R.gateHigh) return 'high';
    if (this.x < -(R.gateHalfW - R.carW)) return 'left';
    if (this.x > R.gateHalfW - R.carW) return 'right';
    return 'ok';
  };

  // 결승 게이트: 문 사이로 지나가면 통과 (판정은 gateAim과 같다)
  Ride.prototype.passGate = function () {
    var R = this.R;
    var S = R.score;
    var aim = this.gateAim();
    this.gateOk = aim === 'ok';
    this.gateMiss = this.gateOk ? null : aim;
    this.stats.gate = this.gateOk;
    if (this.gateOk) {
      this.gateBonus = S.gate + Math.round(this.air) * S.gatePerAir;
      this.stats.gateBonus = this.gateBonus;
      this.score += this.gateBonus; // 떠오르는 글자는 없다: 차가 문을 지나는 모습을 가리지 않게, 보너스는 화면 위 큰 글자 아래에 적는다 (main.js)
      this.emit('rgate', { bonus: this.gateBonus });
    } else {
      this.emit('rgatemiss', { why: aim }); // 놓친 까닭은 화면 가운데 큰 글자로 알린다 (main.js)
    }
    // 카메라는 멈춰 있고(게이트 바로 앞에서 이미 멈췄다) 차만 멀리 날아간다
    if (!this.camFreeze) this.camFreeze = { z: this.z, x: this.x, lift: this.camLift };
    this.setPhase('finish');
  };

  Ride.prototype.updateFinish = function (dt, input) {
    var R = this.R;
    // 게이트를 지난 직후에는 잠깐 느리게 흐른다: 차가 문을 지나는 순간이 눈에 들어온다 (끝나는 시간 finishTime은 그대로 실제 시간)
    if (this.phaseTime < (R.gateSlowTime || 0)) dt *= R.gateSlow || 1;
    this.speed = Math.min(R.flySpeed * 1.6, this.speed + 4000 * dt);
    this.z += this.speed * dt;
    this.h += (600 + this.phaseTime * 900) * dt;
    this.x += (0 - this.x) * Math.min(1, dt * 1.5);
    this.thrusting = true;
    if (this.phaseTime >= R.finishTime || (input.skip && this.phaseTime >= R.finishSkipAfter)) this.setPhase('done', 'rdone');
  };

  // 결과 화면용 요약
  Ride.prototype.summary = function () { return Object.assign({ score: this.score }, this.stats); };

  /**
   * 자동 조종 (자동 플레이 봇·시험용). 사람처럼 앞을 보고 조향·점프·킥플립·발사·비행을 한다.
   * @returns 입력 { left, right, jumpPressed, jumpHeld, down }
   */
  function autoInput(rs) {
    var R = rs.R;
    if (rs.phase === 'drive') {
      var look = Math.max(1500, rs.speed * 0.55); // 이만큼 앞을 본다
      var lanes = R.lanes.map(function (lx) { return { x: lx, d: Infinity, score: 0 }; });
      rs.traffic.forEach(function (v) {
        if (v.passed || v.hit) return;
        var dz = v.z - rs.z;
        if (dz < -v.len || dz > look * 1.6) return;
        lanes.forEach(function (ln) { if (Math.abs(ln.x - v.x) < 0.4 && dz < ln.d) ln.d = dz; });
      });
      rs.boosts.concat(rs.tanks).forEach(function (p) { // 부스트·탱크가 있는 차선은 조금 더 좋다
        if (p.used || p.taken) return;
        var dz = p.z - rs.z;
        if (dz > 0 && dz < look * 1.4) lanes.forEach(function (ln) { if (Math.abs(ln.x - p.x) < 0.2) ln.score += 600; });
      });
      var best = null;
      var cur = null;
      lanes.forEach(function (ln) {
        ln.value = Math.min(ln.d, look * 1.6) + ln.score - Math.abs(ln.x - rs.x) * 400;
        if (!best || ln.value > best.value) best = ln;
        if (Math.abs(ln.x - rs.x) < 0.34) cur = ln;
      });
      var inp = {};
      if (rs.x < best.x - 0.06) inp.right = true;
      else if (rs.x > best.x + 0.06) inp.left = true;
      rs.traffic.forEach(function (v) { // 차선을 바꾸다 옆 차에 스치지 않게 비킨다
        if (v.passed || v.hit) return;
        var dz = v.z - rs.z;
        if (dz < -(v.len + R.carLen) / 2 || dz > rs.speed * 0.12 + 300) return;
        if (Math.abs(v.x - rs.x) < v.w + R.carW + 0.05 && rs.h < v.h) {
          inp.left = v.x > rs.x;
          inp.right = !inp.left;
        }
      });
      var lineDz = R.lineupSeg * R.seg - rs.z;
      var ahead = cur && cur.d < rs.speed * 0.32 && cur.d > 0;
      if (rs.h <= 0 && ((lineDz > 0 && lineDz < rs.speed * 0.45) || ahead)) inp.jumpPressed = true;
      if (rs.h > 0 && lineDz > -600 && lineDz < rs.speed * 0.6) inp.jumpHeld = true; // 다섯 대 위에서는 꾹
      if (rs.h > 0 && ahead) inp.jumpHeld = true;
      if (rs.h > 0 && rs.vh > 2000 && rs.air >= 40 && rs.roll < 0.6) inp.down = true; // 막 떠오른 순간 킥플립 한 바퀴
      return inp;
    }
    if (rs.phase === 'flip') {
      var at = rs.launchAt();
      return { jumpPressed: !rs.launch && rs.phaseTime >= at && rs.phaseTime < at + 0.05 };
    }
    if (rs.phase === 'fly') {
      // 다음 링(없으면 탱크·게이트)을 목표로, 가까운 드론은 비킨다
      var tx = 0, th = (R.gateLow + R.gateHigh) / 2 - R.carHalfH;
      var picked = false; // 다음 위성(없으면 탱크·게이트)
      for (var j = 0; j < rs.fly.length; j++) {
        var f = rs.fly[j];
        if (f.z < rs.z) continue;
        if (f.z > rs.z + rs.speed * 2.2) break;
        if (f.kind === 'sat' && !f.done) { tx = f.x; th = f.h - R.carHalfH - (R.satDrop || 0); picked = true; break; } // 봇도 위성 조금 아래를 노린다
        if (f.kind === 'tank' && !f.taken) { tx = f.x; th = f.h - R.carHalfH; picked = true; break; }
      }
      rs.fly.forEach(function (d) {
        if (d.kind !== 'drone' || d.hit) return;
        var dz = d.z - rs.z;
        if (dz < 0 || dz > rs.speed * 0.6) return;
        var dxw = (d.x - tx) * R.roadWidth;
        if (Math.abs(dxw) < R.droneR + 250 && Math.abs(d.baseH - (th + R.carHalfH)) < d.amp + R.droneR + 200) {
          tx = d.x + (d.x > 0 ? -1 : 1) * (R.droneR + 300) / R.roadWidth; // 옆으로 비킨다
        }
      });
      var input = {};
      if (rs.x < tx - 0.03) input.right = true;
      else if (rs.x > tx + 0.03) input.left = true;
      input.jumpHeld = rs.h + rs.vh * 0.3 < th;
      return input;
    }
    return {};
  }

  return {
    buildTrack: buildTrack,
    roadY: roadY,
    flyStartZ: flyStartZ,
    rollTilt: rollTilt,
    Ride: Ride,
    create: function (opts) { return new Ride(opts); },
    autoInput: autoInput,
  };
});

/* ===== src/game.js ===== */
/*
 * game.js — 한 판(4개 회사 한 바퀴)의 규칙과 움직임 (그리기·소리와 분리된 로직, 2판)
 * ------------------------------------------------------------
 * 규칙 요약: 어두운 무대의 꺼진 장치에 몸이 닿으면 켜진다. 모두 켜면 다음 무대.
 *           버그(벌레)는 켜진 장치에 닿으면 다시 끄고, 플레이어가 닿으면 감전된다.
 *           회사마다 제한 시간(기본 30초)이 따로 있다. 시간 안에 다 켜면 완료 +500과 남은 시간 보너스,

      case 'intro':
        // 시작 컷신: 게임 시간은 흐르지 않는다. 다 보거나, 시작 뒤 skipAfter(0.4초)가 지나 Enter·Space를 누르면 끝
        // 컷이 바뀌는 순간 'cut' 알림 (컷마다 효과음: 휙 / 지직 / 툭- / 삐삐)
        var cutIdx = Math.min(cfg.STORY.cuts.length - 1, Math.floor(this.phaseTime / cfg.STORY.cutTime));
        if (cutIdx !== this.cutIndex && this.phaseTime < this.introTime()) {
          this.cutIndex = cutIdx;
          var cut = cfg.STORY.cuts[cutIdx];
          this.emit('cut', { index: cutIdx, key: cut.key, sfx: cut.sfx || null });
        }
        if (this.phaseTime >= this.introTime() || (input.skip && this.phaseTime >= cfg.STORY.skipAfter)) {
          this.stageTime = 0; // 무대 시작 말풍선이 컷신 동안 지나가 버리지 않게
          this.setPhase('ready', 'introend');
        }
        break;
      case 'ready':
        this.updatePlayer(dt, NONE);
        if (this.phaseTime >= this.readyTime()) this.setPhase('play', 'go');
        break;
      case 'play':
        this.tickTime(dt);
        // 이 회사 시간이 방금 0이 되어 'over'로 바뀌었으면 이 프레임에는 움직이지도,
        // 장치를 켜지도, 버그를 움직이지도 않는다. (1판 리뷰 5번 원칙, 회사마다 똑같이)
        if (this.phase !== 'play') break;
        this.playClock += dt;
        if (this.hasPower('autopilot')) input = this.autopilotInput(input);
        this.updatePlayer(dt, input);
        this.updatePads(dt); // 점프대: 밟으면 위로 튕김
        this.updateTraps(dt); // 함정: 밀기·감전·로봇청소기·미끼 (시간이 0이 된 프레임에는 여기까지 오지 않는다)
        // 오토파일럿은 벽에 막히면 끝난다
        if (this.hasPower('autopilot') && this.player.blocked) this.endPower();
        this.updateBugs(dt);
        this.checkWorld();
        this.updatePower(dt);
        break;
      case 'clear':
        this.updatePlayer(dt, NONE);
        // 완료 연출 효과음: clearSounds의 시각을 지날 때 한 번씩 (부릉·꽥·샤락·발사 굉음·철컥 등)
        var snd = this.stageDef().clearSounds || [];
        while (this.clearSoundIdx < snd.length && this.phaseTime >= snd[this.clearSoundIdx][0]) {
          this.emit('clearsfx', { name: snd[this.clearSoundIdx][1] });
          this.clearSoundIdx++;
        }
        // 연출 시간이 다 됐거나, 조금 지난 뒤 Enter·Space를 누르면 다음 무대 (그동안 시간은 멈춰 있다)
        if (this.phaseTime >= this.clearTime() || (input.skip && this.phaseTime >= cfg.CLEAR_SKIP_AFTER)) this.advance();
        break;
      case 'over':
        // "시간 종료!"를 잠깐 보여 준 뒤 다음 회사로 (마지막 회사면 결과)
        this.updatePlayer(dt, NONE);
        if (this.phaseTime >= cfg.OVER_TIME) this.advance();
        break;
      case 'roadster':
        // 2단계: roadster.js가 진행하고, 점수는 1단계 점수에 이어서 보여 준다
        this.rs.update(dt, input);
        this.score = this.score1 + this.rs.score;
        if (this.rs.phase === 'done') this.endRoadster();
        break;
      case 'ending':
        // 인사 발령: stampAt에 도장 "쾅", endingTime이 지나거나 조금 뒤 Enter·Space면 결과로
        if (!this.stamped && this.phaseTime >= cfg.STORY.stampAt) { this.stamped = true; this.emit('stamp'); }
        if (this.phaseTime >= cfg.STORY.endingTime || (input.skip && this.phaseTime >= cfg.STORY.endingSkipAfter)) {
          // 발령장 뒤에 직급별 세레머니 화면 (config.CEREMONY, 시간이 0이면 건너뛰고 바로 결과)
          if (cfg.CEREMONY && cfg.CEREMONY.time > 0) { this.setPhase('ceremony'); this.emit('ceremony', { titleIndex: fun.titleOf(this.score, cfg.TITLES).index }); }
          else this.finish();
        }
        break;
      case 'ceremony':
        // 직급별 세레머니: time초 뒤 또는 조금 뒤 Enter·Space면 결과로 (그림은 main.js drawCeremony)
        if (this.phaseTime >= cfg.CEREMONY.time || (input.skip && this.phaseTime >= cfg.CEREMONY.skipAfter)) this.finish();
        break;
      default:
        break;
    }
    this.updateCamera(dt, false);
  };

  Session.prototype.setPhase = function (phase, eventName) {
    this.phase = phase;
    this.phaseTime = 0;
    if (eventName) this.emit(eventName);
  };

  // 이 회사의 남은 시간 줄이기. 마지막 WARN_TIME(5초)은 1초마다 'tick' 알림.
  Session.prototype.tickTime = function (dt) {
    this.time = Math.max(0, this.time - dt);
    var whole = Math.ceil(this.time);
    if (whole !== this.lastWholeSecond) {
      this.lastWholeSecond = whole;
      if (whole <= (this.cfg.WARN_TIME || 5) && whole > 0) this.emit('tick', whole);
    }
    if (this.time <= 0) {
      this.time = 0;
      // 시간 종료: 완료 보너스·완료 연출 없이 성적만 남긴다. 켠 장치 점수는 그대로.
      this.player.vx = 0;
      this.recordCompany(false);
      if (this.power) this.endPower();
      this.setPhase('over', 'end');
    }
  };

  // 플레이어 움직임 (달리기·점프·중력·충돌·감전)
  Session.prototype.updatePlayer = function (dt, input) {
    var P = this.cfg.PLAYER;
    var p = this.player;
    if (p.safe > 0) p.safe = Math.max(0, p.safe - dt);
    if (p.stun > 0) {
      p.stun = Math.max(0, p.stun - dt);
      input = NONE; // 감전 중에는 키 입력을 받지 않는다
    }
    var dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    var speed = P.runSpeed * (this.hasPower('jacket') ? this.cfg.POWERUP.speedMul : 1); // 가죽 재킷: 빨라짐

    // 가로 속도: 목표 속도 쪽으로 가속, 키를 놓으면 감속
    if (dir !== 0) {
      p.vx = physics.approach(p.vx, dir * speed, (p.onGround ? P.accel : P.airAccel) * dt);
      p.facing = dir;
    } else {
      p.vx = physics.approach(p.vx, 0, (p.onGround ? P.friction : P.airFriction) * dt);
    }

    // 코요테 타임: 땅 위면 가득 채우고, 공중이면 줄인다
    p.coyote = p.onGround ? P.coyote : Math.max(0, p.coyote - dt);
    // 점프 버퍼: 점프를 누르면 잠깐 기억해 둔다
    p.buffer = input.jumpPressed ? P.buffer : Math.max(0, p.buffer - dt);

    if (p.buffer > 0 && p.coyote > 0) {
      p.vy = -P.jumpSpeed;
      p.buffer = 0;
      p.coyote = 0;
      p.onGround = false;
      p.jumping = true;
      this.emit('jump');
    } else if (input.jumpPressed && !p.onGround && p.airJumps > 0 && this.hasPower('jetpack')) {
      // 랩터 제트팩: 공중에서 한 번 더 점프 (2단 점프)
      p.vy = -P.jumpSpeed;
      p.airJumps--;
      p.buffer = 0;
      p.jumping = true;
      this.emit('jump', { air: true });
    }
    // 낮은 점프: 올라가는 도중에 버튼을 떼면 위로 가는 속도를 줄인다 (한 번만)
    if (p.jumping && !input.jumpHeld && p.vy < 0) {
      p.vy *= P.jumpCut;
      p.jumping = false;
    }

    // 중력
    p.vy = Math.min(p.vy + P.gravity * dt, P.maxFall);

    // 이동 + 충돌
    var res = physics.moveAndCollide(p, p.vx * dt, p.vy * dt, this.map);
    var movedX = res.x - p.x;
    p.x = res.x;
    p.y = res.y;
    if (res.hitLeft || res.hitRight) p.vx = 0;
    if (res.onGround || res.hitTop) p.vy = 0;
    if (res.hitTop) p.jumping = false;
    p.onGround = res.onGround;
    if (p.onGround) {
      p.jumping = false;
      p.airJumps = this.cfg.POWERUP ? this.cfg.POWERUP.airJumps : 0; // 땅에 닿으면 공중 점프 횟수를 채운다
    }
    p.blocked = dir !== 0 && (res.hitLeft || res.hitRight); // 가려는 쪽이 벽에 막혔는지 (오토파일럿 종료용)

    // 혹시 맵 밖으로 빠지면(맵을 잘못 그린 경우) 시작 위치로 돌려놓는다. 벌칙은 없다.
    if (p.y > this.map.height * this.map.tileSize + 40) {
      var keep = { stun: p.stun, safe: p.safe };
      this.player = p = makePlayer(P, this.spawnFeet);
      p.stun = keep.stun;
      p.safe = keep.safe;
    }

    // 애니메이션 상태 고르기
    p.animTime += dt;
    if (p.stun > 0) {
      p.anim = 'stun';
    } else if (!p.onGround) {
      p.anim = 'jump';
    } else if (Math.abs(p.vx) > 10) {
      p.anim = 'run';
      p.runDist += Math.abs(movedX);
    } else {
      p.anim = 'idle';
    }
  };

  // 플레이어 그림 프레임 번호 (render.js가 쓴다)
  Session.prototype.playerFrame = function () {
    var p = this.player;
    if (p.anim === 'run') return Math.floor(p.runDist / 6) % 4; // 6픽셀 갈 때마다 다음 장
    if (p.anim === 'idle') return Math.floor(p.animTime * 2) % 2;
    return 0;
  };

  // 버그 걷는 속도 (한 바퀴만 돌므로 무대마다 같다. 어려움은 버그 수로 올린다)
  Session.prototype.bugSpeed = function () {
    return this.cfg.BUG.speed;
  };

  // 버그 움직임: 발판 위를 좌우로 걷다가 벽이나 발판 끝에서 돌아선다. 켜진 장치에 들어가면 끈다.
  Session.prototype.updateBugs = function (dt) {
    var B = this.cfg.BUG;
    var map = this.map;
    var T = map.tileSize;
    var speed = this.bugSpeed();
    for (var i = 0; i < this.bugs.length; i++) {
      var b = this.bugs[i];
      b.animTime += dt;
      b.vy = Math.min(b.vy + B.gravity * dt, 420);
      var res = physics.moveAndCollide(b, b.dir * speed * dt, b.vy * dt, map);
      b.x = res.x;
      b.y = res.y;
      if (res.onGround || res.hitTop) b.vy = 0;
      b.onGround = res.onGround;
      if (res.hitLeft || res.hitRight) {
        b.dir = -b.dir;
      } else if (b.onGround) {
        // 앞발 바로 아래가 빈칸이면 (발판 끝) 돌아선다
        var frontX = b.dir > 0 ? b.x + b.w + 1 : b.x - 1;
        var below = Math.floor((b.y + b.h + 1) / T);
        if (mapApi.cellAt(map, Math.floor(frontX / T), below) === mapApi.EMPTY) b.dir = -b.dir;
      }
      // 켜진 장치에 "들어가는 순간" 끈다. (이미 겹친 채로 플레이어가 다시 켠 장치는 지나갈 때까지 둔다)
      for (var d = 0; d < this.devices.length; d++) {
        var dev = this.devices[d];
        var touching = physics.overlaps(b, deviceBox(dev, T));
        if (touching && !b.touching[d] && dev.on) this.turnOff(dev);
        b.touching[d] = touching;
      }
    }
  };

  // ── 점프대 ──────────────────────────────────────────────
  // 점프대 윗면에 닿는 상자 (칸 가운데 12픽셀 폭, 바닥 위 3픽셀)
  function padBox(pad, T) {
    return { x: pad.x * T + 2, y: (pad.y + 1) * T - 3, w: T - 4, h: 3 };
  }

  Session.prototype.updatePads = function (dt) {
    if (!this.pads.length) return;
    var T = this.map.tileSize;
    var p = this.player;
    var P = this.cfg.PADS || { speed: 475, press: 0.18 };
    for (var i = 0; i < this.pads.length; i++) {
      var pad = this.pads[i];
      if (pad.press > 0) pad.press = Math.max(0, pad.press - dt);
      // 내려오거나 서 있을 때(위로 솟는 중이 아닐 때) 윗면에 발이 닿으면 튕긴다. 감전 중에는 튕기지 않는다.
      if (p.stun > 0 || p.vy < 0 || !physics.overlaps(p, padBox(pad, T))) continue;
      p.vy = -P.speed;
      p.onGround = false;
      p.jumping = false; // 점프 키를 떼도 튕김이 줄지 않게 (낮은 점프 처리 대상 아님)
      p.coyote = 0;
      p.buffer = 0;
      pad.press = P.press;
      this.stats.pads = (this.stats.pads || 0) + 1;
      this.emit('pad', { x: pad.x, y: pad.y });
    }
  };

  // ── 함정 ────────────────────────────────────────────────
  Session.prototype.updateTraps = function (dt) {
    var C = this.cfg.TRAPS;
    if (!C || !this.traps.length) return;
    var T = this.map.tileSize;
    var p = this.player;
    this.trapClock += dt;
    this.pushedThisStep = false;
    var pcx = p.x + p.w / 2;
    for (var i = 0; i < this.traps.length; i++) {
      var tr = this.traps[i];
      var box = trapsApi.hitBox(tr, T, this.cfg);
      var st = trapsApi.stateOf(tr, this.trapClock, this.cfg);
      // 상태가 바뀌는 순간 알림 (가까운 함정만: 멀리 있는 함정 소리까지 나면 시끄럽다)
      if (trapsApi.PERIODIC[tr.kind] && st !== tr.state) {
        var near = Math.abs((box.x + box.w / 2) - pcx) <= (C.warnSoundDist || 9) * T;
        if (near && st === 'warn') this.emit('trapwarn', { kind: tr.kind });
        if (near && st === 'on') this.emit('trapon', { kind: tr.kind });
      }
      tr.state = st;
      switch (tr.kind) {
        case 'conveyor': // 위에 서 있으면 늘 한쪽으로 밀린다 (감전 아님)
          if (p.onGround && physics.overlaps(p, box)) this.pushPlayer(tr.dir * C.conveyor.push * dt);
          break;
        case 'wind': // 에어 샤워: 켜진 동안 그 구간에서 옆으로 밀린다 (감전 아님)
          if (st === 'on' && physics.overlaps(p, box)) this.pushPlayer(tr.dir * C.wind.push * dt);
          break;
        case 'vac':
          this.updateVac(tr, dt, box);
          break;
        case 'decoy':
          this.updateDecoy(tr, dt, box);
          break;
        default: // 감전 함정: 켜졌을 때 닿으면 감전 (감전 중·무적 시간·가죽 재킷이면 넘어간다)
          if (st === 'on' && trapsApi.HURT[tr.kind] && physics.overlaps(p, box)) this.hurt(box, tr.kind);
          break;
      }
    }
    // 컨베이어·바람에 밀리는 동안 약한 "웅웅" (약 0.45초마다)
    if (this.pushedThisStep) {
      this.humT -= dt;
      if (this.humT <= 0) { this.emit('hum'); this.humT = 0.45; }
    } else {
      this.humT = 0;
    }
  };

  // 플레이어를 옆으로 밀기 (벽은 뚫지 않는다)
  Session.prototype.pushPlayer = function (dx) {
    var p = this.player;
    var res = physics.moveAndCollide(p, dx, 0, this.map);
    p.x = res.x;
    this.pushedThisStep = true;
  };

  // 함정 감전: 버그 감전과 똑같다 (0.8초 못 움직임 + 함정 반대쪽으로 살짝 밀림 + 무적 시간)
  //   kind가 'flame'(SpaceX 엔진 화염)이면 규칙은 같고 모습만 "불에 탐" (2026-11-10 사용자 요청)
  Session.prototype.hurt = function (box, kind) {
    var p = this.player;
    if (p.stun > 0 || p.safe > 0 || this.hasPower('jacket')) return false;
    this.zap(box, kind === 'flame' ? 'burn' : 'zap');
    this.trapPenalty();
    return true;
  };

  // 함정 감점: 함정에 맞을 때마다 연봉을 조금 깎는다 (config.SCORE.trapPenalty, 2026-11-10 사용자 요청)
  //   - 연봉은 0원 아래로 내려가지 않는다 (가진 만큼만 깎는다)
  //   - 버그에 닿은 감전은 함정이 아니라서 깎지 않는다
  //   - 맞은 뒤에는 무적 시간이 있어서 한 번 맞을 때 한 번만 깎인다
  Session.prototype.trapPenalty = function () {
    var want = this.cfg.SCORE.trapPenalty || 0;
    var lost = Math.min(want, this.score); // 실제로 깎이는 점수
    this.stats.trapHits++;
    if (lost <= 0) return;
    this.score -= lost;
    this.stats.trapLost += lost;
    var p = this.player;
    // 빨간 글자로 "-150만" 을 머리 위에 띄운다 (감전!·쿵! 글자보다 한 줄 위)
    this.addFloater('-' + fun.formatSalary(lost, false, true, this.score), p.x + p.w / 2, p.y - 16, '#ff6b6b');
    this.emit('penalty', { lost: lost });
  };

  // 로봇청소기: 좌우로 오가다 벽·끝에서 돌아선다. 부딪히면 밀려남(감전 아님, 잠깐 무적)
  Session.prototype.updateVac = function (tr, dt, box) {
    var C = this.cfg.TRAPS.vac;
    var T = this.map.tileSize;
    var nx = tr.px + tr.vx * dt;
    var front = Math.floor((nx + (tr.vx > 0 ? 8 : -8)) / T);
    if (nx < tr.minX || nx > tr.maxX || mapApi.cellAt(this.map, front, tr.y) === mapApi.SOLID) tr.vx = -tr.vx;
    else tr.px = nx;
    var p = this.player;
    if (p.stun > 0 || p.safe > 0 || !physics.overlaps(p, trapsApi.hitBox(tr, T, this.cfg))) return;
    var away = p.x + p.w / 2 < tr.px ? -1 : 1;
    p.vx = away * C.knockX;
    p.vy = -C.knockY;
    p.onGround = false;
    p.jumping = false;
    p.safe = C.safe;
    this.addFloater('쿵!', p.x + p.w / 2, p.y - 6, '#9ad8ff');
    this.emit('knock');
    this.trapPenalty();
  };

  // 미끼 장치: 닿으면 버그가 튀어나와 offDelay초 뒤 가장 가까운 켜진 장치 하나를 끄고, bugLife초 뒤 사라진다 (한 번만)
  Session.prototype.updateDecoy = function (tr, dt, box) {
    var C = this.cfg.TRAPS.decoy;
    var T = this.map.tileSize;
    if (!tr.sprung && physics.overlaps(this.player, box)) {
      tr.sprung = true;
      var cx = box.x + box.w / 2;
      var target = null;
      var best = Infinity;
      this.devices.forEach(function (d) {
        if (!d.on) return;
        var dist = Math.abs(d.x * T + T / 2 - cx) + Math.abs(d.y - tr.y) * T;
        if (dist < best) { best = dist; target = d; }
      });
      tr.bug = { x: cx, y: (tr.y + 1) * T - 10, sx: cx, t: 0, target: target, done: false };
      this.addFloater('미끼다!', cx, box.y - 6, '#c78bff');
      this.emit('decoy', { x: cx, y: box.y });
    }
    var b = tr.bug;
    if (!b) return;
    b.t += dt;
    // 버그가 목표 장치 쪽으로 달려간다 (그림용 위치)
    if (b.target) {
      var tx = b.target.x * T + T / 2;
      b.x = b.sx + (tx - b.sx) * Math.min(1, b.t / C.offDelay);
      b.y = (b.target.y + 1) * T - 10;
    }
    if (!b.done && b.t >= C.offDelay) {
      b.done = true;
      if (b.target && b.target.on) this.turnOff(b.target);
    }
    if (b.t >= C.bugLife) tr.bug = null;
  };

  // 장치 그림 크기(픽셀). 켜진 장치가 따로 크기를 가지면(펼친 폴드) 그 크기.
  function deviceSize(dev, T) {
    var on = dev.on && dev.onPw;
    return {
      w: on ? dev.onPw : dev.pw || T,
      h: on ? dev.onPh : dev.ph || dev.h * T,
    };
  }

  // 장치의 충돌 상자: 기준 칸(왼쪽 아래)에서 오른쪽·위로. 가장자리 2픽셀은 빼서 살짝 안쪽까지 들어가야 닿게.
  function deviceBox(dev, T) {
    var sz = deviceSize(dev, T);
    return { x: dev.x * T + 2, y: (dev.y + 1) * T - sz.h + 2, w: sz.w - 4, h: sz.h - 2 };
  }

  // 버그의 충돌 상자 (플레이어와 닿을 때는 조금 작게 봐 준다)
  function bugHitBox(b) {
    return { x: b.x + 2, y: b.y + 2, w: b.w - 4, h: b.h - 2 };
  }

  // 장치 켜기·감전 확인
  Session.prototype.checkWorld = function () {
    if (this.phase !== 'play') return; // 진행 중일 때만 확인한다
    var T = this.map.tileSize;
    var p = this.player;

    // 1) 꺼진 장치에 닿으면 켠다
    for (var i = 0; i < this.devices.length; i++) {
      var dev = this.devices[i];
      if (dev.on) continue;
      if (physics.overlaps(p, deviceBox(dev, T))) {
        this.turnOn(dev);
        if (this.devicesOn() === this.devices.length) {
          this.clearStage();
          return;
        }
      }
    }

    // 2) 파워업 상자에 닿으면 발동
    var it = this.item;
    if (it && !it.taken && physics.overlaps(p, { x: it.x * T + 2, y: it.y * T + 2, w: T - 4, h: T - 4 })) this.collectItem();

    // 3) 버그에 닿으면 감전 (감전 중·무적 시간·가죽 재킷이면 넘어간다)
    if (p.stun > 0 || p.safe > 0 || this.hasPower('jacket')) return;
    for (var b = 0; b < this.bugs.length; b++) {
      if (physics.overlaps(p, bugHitBox(this.bugs[b]))) {
        this.zap(this.bugs[b]);
        return;
      }
    }
  };

  // 장치 켜기: 처음 켜면 +100, 3초 안에 이어서 켜면 연속 보너스.
  // 버그가 끈 장치를 다시 켜면 SCORE.relight(+30)만, 연속 보너스·연속 이어짐에는 넣지 않는다 (파워업 개수는 예전처럼 센다).
  Session.prototype.turnOn = function (dev) {
    var cfg = this.cfg;
    var S = cfg.SCORE;
    var T = this.map.tileSize;
    dev.on = true;
    dev.flash = 0.4;
    this.stats.devices++;
    if (dev.everOn) {
      var re = S.relight !== undefined ? S.relight : S.device;
      this.score += re;
      this.stats.relights = (this.stats.relights || 0) + 1;
      var rb = deviceBox(dev, T);
      this.addFloater(fun.formatSalary(re, true, true, this.score - re), rb.x + rb.w / 2, rb.y - 4, '#b8f2c8');
      if (cfg.JUICE) this.hitStop = cfg.JUICE.hitStop;
      this.emit('power', { device: dev, combo: 0, bonus: 0, relight: true, x: rb.x + rb.w / 2, y: rb.y + rb.h / 2 });
      this.stageOnCount++; // 파워업 상자 조건(장치 켠 횟수)은 다시 켜기도 센다 (예전 규칙 그대로)
      if (cfg.POWERUP && !this.itemSpawned && this.stageOnCount >= cfg.POWERUP.unlockAfter && this.stageDef().powerup) this.spawnItem();
      return;
    }
    dev.everOn = true; // 이 무대에서 한 번이라도 켰다 (무대를 불러올 때 장치를 새로 만들므로 무대마다 처음부터)
    if (this.lastOnAt !== null && this.playClock - this.lastOnAt <= cfg.COMBO_WINDOW) this.combo++;
    else this.combo = 0;
    this.lastOnAt = this.playClock;
    var bonus = this.combo > 0 ? Math.min(S.comboStep * this.combo, S.comboMax) : 0;
    if (this.combo > this.stats.bestCombo) this.stats.bestCombo = this.combo;
    this.score += S.device + bonus;
    var box = deviceBox(dev, T);
    var cx = box.x + box.w / 2;
    var topY = box.y;
    this.addFloater(fun.formatSalary(S.device, true, true, this.score - S.device - bonus), cx, topY - 4, '#7cf29a');
    if (bonus) this.addFloater((this.combo + 1) + '연속! ' + fun.formatSalary(bonus, true, true, this.score - bonus), cx, topY - 14, '#ffe066');
    if (cfg.JUICE) this.hitStop = cfg.JUICE.hitStop;
    this.emit('power', { device: dev, combo: this.combo, bonus: bonus, x: cx, y: box.y + box.h / 2 });
    // 이 무대에서 장치를 일정 수 켜면 파워업 상자가 나타난다 (무대마다 한 번)
    this.stageOnCount++;
    if (cfg.POWERUP && !this.itemSpawned && this.stageOnCount >= cfg.POWERUP.unlockAfter && this.stageDef().powerup) this.spawnItem();
  };

  // 버그가 장치를 끔
  Session.prototype.turnOff = function (dev) {
    var T = this.map.tileSize;
    dev.on = false;
    dev.flash = 0;
    this.stats.offs++;
    var box = deviceBox(dev, T);
    this.addFloater('꺼짐!', box.x + box.w / 2, box.y - 4, '#ff6b6b');
    this.emit('off', { device: dev });
  };

  // 감전: 잠깐 못 움직이고 버그 반대쪽으로 살짝 밀린다
  //   how: 'zap'(감전, 기본) / 'burn'(화염에 탐: 그을린 모습·불길·연기, 'burn' 알림). 규칙은 같다
  Session.prototype.zap = function (bug, how) {
    var S = this.cfg.STUN;
    var p = this.player;
    p.stun = S.time;
    p.safe = S.time + S.safeTime;
    var away = p.x + p.w / 2 < bug.x + bug.w / 2 ? -1 : 1;
    p.vx = away * S.pushX;
    p.vy = -S.pushY;
    p.onGround = false;
    p.jumping = false;
    p.buffer = 0;
    p.anim = 'stun';
    p.hurtKind = how === 'burn' ? 'burn' : 'zap'; // 그리기: 'burn'이면 감전 스파크 대신 불길·연기·그을린 색
    this.stats.zaps++;
    if (p.hurtKind === 'burn') {
      this.addFloater('앗 뜨거!', p.x + p.w / 2, p.y - 6, '#ff9a3a');
      this.emit('burn');
    } else {
      this.addFloater('감전!', p.x + p.w / 2, p.y - 6, '#ffd23f');
      this.emit('zap');
    }
  };

  // ── 파워업 ──────────────────────────────────────────────
  Session.prototype.hasPower = function (key) {
    return !!(this.power && this.power.key === key);
  };

  Session.prototype.endPower = function () {
    if (!this.power) return;
    this.power = null;
    this.emit('powerend');
  };

  // 효과 시간 줄이기 (진행 중일 때만 부른다)
  Session.prototype.updatePower = function (dt) {
    if (!this.power) return;
    this.power.time -= dt;
    if (this.power.time <= 0) this.endPower();
  };

  /**
   * 파워업 상자 후보 자리: 맵의 Powerups 레이어 칸, 없으면 밟을 수 있는 면마다 가운데 위 칸.
   * 장치가 차지한 칸은 뺀다.
   */
  Session.prototype.itemSpots = function () {
    var map = this.map;
    var taken = {};
    this.devices.forEach(function (d) {
      for (var i = 0; i < (d.w || 1); i++) for (var k = 0; k < d.h; k++) taken[(d.x + i) + ',' + (d.y - k)] = true;
    });
    var list = (map.powerups && map.powerups.length) ? map.powerups.slice() : mapApi.surfaces(map).map(function (sf) {
      return { x: Math.floor((sf.x0 + sf.x1) / 2), y: sf.y - 1 };
    });
    return list.filter(function (c) {
      return c.y >= 1 && mapApi.cellAt(map, c.x, c.y) === mapApi.EMPTY && !taken[c.x + ',' + c.y];
    });
  };

  // 상자 나타내기: 후보 중 플레이어에게서 약 10칸 떨어진 곳 (너무 가깝지도 멀지도 않게, 같은 상황이면 늘 같은 자리)
  Session.prototype.spawnItem = function () {
    var T = this.map.tileSize;
    var spots = this.itemSpots();
    this.itemSpawned = true;
    if (!spots.length) return;
    var px = (this.player.x + this.player.w / 2) / T;
    var py = (this.player.y + this.player.h) / T;
    var best = spots[0];
    var bestScore = Infinity;
    spots.forEach(function (c) {
      var dist = Math.abs(c.x + 0.5 - px) + Math.abs(c.y + 1 - py);
      var score = Math.abs(dist - 10);
      if (score < bestScore) { bestScore = score; best = c; }
    });
    var def = this.stageDef().powerup;
    this.item = { x: best.x, y: best.y, key: def.key, taken: false };
    this.emit('itemspawn', this.item);
  };

  // 상자를 먹음: +50, 효과 발동
  Session.prototype.collectItem = function () {
    var T = this.map.tileSize;
    var def = this.stageDef().powerup;
    var it = this.item;
    it.taken = true;
    this.score += this.cfg.POWERUP.score;
    this.stats.powerups++;
    this.power = { key: def.key, name: def.name, time: def.time, max: def.time };
    this.addFloater(def.name + '! ' + fun.formatSalary(this.cfg.POWERUP.score, true, true, this.score - this.cfg.POWERUP.score), it.x * T + T / 2, it.y * T - 4, '#ffd23f');
    this.emit('powerup', { key: def.key, name: def.name, line: def.line });
  };

  /**
   * 오토파일럿 입력: 가장 가까운 꺼진 장치 쪽으로 달리고, 장치가 위에 있으면 점프한다.
   * 꺼진 장치가 없으면 오토파일럿을 끝내고 원래 입력을 돌려준다.
   */
  Session.prototype.autopilotInput = function (input) {
    var T = this.map.tileSize;
    var p = this.player;
    var cx = p.x + p.w / 2;
    var feet = p.y + p.h;
    var best = null;
    var bestCost = Infinity;
    for (var i = 0; i < this.devices.length; i++) {
      var d = this.devices[i];
      if (d.on) continue;
      var box = deviceBox(d, T);
      var cost = Math.abs(box.x + box.w / 2 - cx) + 2 * Math.abs((d.y + 1) * T - feet);
      if (cost < bestCost) { bestCost = cost; best = box; best.feet = (d.y + 1) * T; }
    }
    if (!best) { this.endPower(); return input; }
    var tx = best.x + best.w / 2;
    var higher = best.feet < feet - 4;
    return {
      right: tx > cx + 2,
      left: tx < cx - 2,
      jumpPressed: higher && p.onGround,
      jumpHeld: true,
      skip: input.skip,
    };
  };

  Session.prototype.devicesOn = function () {
    var n = 0;
    for (var i = 0; i < this.devices.length; i++) if (this.devices[i].on) n++;
    return n;
  };

  // 지금 무대의 전체 밝기 (render.js가 어둠을 칠할 때 쓴다)
  Session.prototype.brightness = function () {
    if (this.phase === 'clear') return 1;
    return brightness(this.devicesOn(), this.devices.length, this.cfg.LIGHT.base);
  };

  /**
   * 남은 시간 보너스: SCORE.timeBonus(20) × 남은 초(내림).
   * 부동소수 오차로 12초가 11.9999…가 되어 하나 깎이지 않게 아주 조금 더한 뒤 내린다.
   */
  function timeBonus(timeLeft, perSecond) {
    return Math.floor(Math.max(0, timeLeft) + 1e-6) * perSecond;
  }

  Session.prototype.clearStage = function () {
    if (this.phase !== 'play') return; // 시간 종료 처리 중에는 완료로 바꾸지 않는다
    var p = this.player;
    var S = this.cfg.SCORE;
    var bonus = timeBonus(this.time, S.timeBonus || 0);
    this.score += S.stage + bonus;
    this.stats.stages++;
    this.stats.timeBonus += bonus;
    this.lastTimeBonus = bonus; // 완료 연출 화면에 보여 줄 값
    p.vx = 0;
    this.recordCompany(true);
    this.clearSoundIdx = 0; // 완료 연출 효과음을 처음부터
    this.addFloater('무대 완료 ' + fun.formatSalary(S.stage, true, true, this.score - S.stage - bonus), p.x + p.w / 2, p.y - 20, '#7cf29a');
    if (bonus) this.addFloater('남은 ' + Math.floor(this.time + 1e-6) + '초 ' + fun.formatSalary(bonus, true, true, this.score - bonus), p.x + p.w / 2, p.y - 30, '#ffe066');
    this.setPhase('clear', 'stage');
  };

  // 지금 회사 성적을 남긴다 (완료 또는 시간 종료 순간에 한 번)
  Session.prototype.recordCompany = function (cleared) {
    var def = this.stageDef();
    this.companies[this.stageIndex] = {
      key: def.key,
      name: def.name,
      short: def.short || def.key,
      on: this.devicesOn(),
      total: this.devices.length,
      cleared: cleared,
      timeLeft: cleared ? this.time : 0,
    };
  };

  // 완료 연출이나 "시간 종료!"가 끝났을 때: 다음 회사로, 마지막 회사였으면 결과로
  Session.prototype.advance = function () {
    if (this.isLastStage()) {
      if (this.stage2 && !this.rs) { this.startRoadster(); return; } // 1단계 끝 → 2단계 새 로드스터
      if (this.story) this.setPhase('ending', 'ending'); // 결과 전에 인사 발령 엔딩
      else this.finish();
      return;
    }
    this.nextStage();
  };

  // 2단계 시작: 로드스터 한 판을 만들고 알림은 그대로 main.js로 넘긴다
  Session.prototype.startRoadster = function () {
    var self = this;
    if (this.power) { this.power = null; this.emit('powerend'); }
    this.combo = 0;
    this.lastOnAt = null;
    this.floaters = [];
    this.score1 = this.score;
    this.rs = roadsterApi.create({ config: this.cfg, baseScore: this.score1, onEvent: function (name, data) { self.emit(name, data); } });
    this.setPhase('roadster', 'stage2');
  };

  // 2단계 끝: 엔딩(이야기 모드) 또는 바로 결과
  Session.prototype.endRoadster = function () {
    this.score = this.score1 + this.rs.score;
    if (this.story) this.setPhase('ending', 'ending');
    else this.finish();
  };

  // 한 판 끝: 'done' + 'finish'. 몇 번 불려도 'finish'는 한 번만 보낸다 (랭킹 저장 한 번)
  Session.prototype.finish = function () {
    if (this.finished) return;
    this.finished = true;
    this.setPhase('done');
    this.emit('finish', this.result());
  };

  // 다음 회사 불러오기 → 짧은 안내(ready) 뒤 시작. 시간은 그 회사 몫으로 새로 채워진다.
  Session.prototype.nextStage = function () {
    var next = Math.min(this.stageIndex + 1, this.cfg.STAGES.length - 1);
    this.stageIndex = next;
    this.loadStage(next);
    this.setPhase('ready', 'ready'); // "준비" 신호음
  };

  // 떠오르는 글자
  Session.prototype.addFloater = function (text, x, y, color) {
    this.floaters.push({ text: text, x: x, y: y, life: 0.9, max: 0.9, color: color });
  };

  Session.prototype.updateFloaters = function (dt) {
    for (var i = this.floaters.length - 1; i >= 0; i--) {
      var f = this.floaters[i];
      f.life -= dt;
      f.y -= 20 * dt;
      if (f.life <= 0) this.floaters.splice(i, 1);
    }
  };

  // 카메라: 가로로만 플레이어를 따라간다 (가운데). 세로는 맵 아래쪽에 맞춰 고정.
  Session.prototype.updateCamera = function (dt, snap) {
    var cfg = this.cfg;
    var T = this.map.tileSize;
    var p = this.player;
    var maxX = Math.max(0, this.map.width * T - cfg.VIEW_W);
    var tx = clamp(p.x + p.w / 2 - cfg.VIEW_W * 0.5, 0, maxX);
    var ty = this.map.height * T - cfg.VIEW_H; // 맵이 화면보다 낮으면 음수 → 아래쪽에 맞춤
    if (snap) {
      this.camera.x = tx;
    } else {
      this.camera.x += (tx - this.camera.x) * Math.min(1, dt * 8);
    }
    this.camera.y = ty;
  };

  Session.prototype.result = function () {
    return {
      score: this.score,
      stats: Object.assign({}, this.stats),
      stageIndex: this.stageIndex,
      companies: this.companies.slice(), // 회사별 성적 (결과 화면)
      roadster: this.rs ? this.rs.summary() : null, // 2단계 성적 (결과 화면 한 줄)
    };
  };

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  /**
   * 완료 연출 단계 (SpaceX 우주 비행 장면): stage.show [[시작 초, 단계], …]에서 t초일 때의 단계
   * @returns { key, index, start, end, local(단계 안에서 흐른 초), k(0-1 진행도) } 또는 null(단계가 없는 무대)
   */
  function showAt(stage, t, clearTime) {
    var list = stage && stage.show;
    if (!list || !list.length) return null;
    var i = 0;
    while (i + 1 < list.length && t >= list[i + 1][0]) i++;
    var start = list[i][0];
    var end = i + 1 < list.length ? list[i + 1][0] : (clearTime || stage.clearTime || start + 1);
    var local = Math.max(0, t - start);
    return { key: list[i][1], index: i, start: start, end: end, local: local, k: Math.max(0, Math.min(1, local / (end - start))) };
  }

  return {
    Session: Session,
    createSession: function (opts) { return new Session(opts); },
    showAt: showAt,
    brightness: brightness,
    minLightAlpha: minLightAlpha,
    deviceBox: deviceBox,
    deviceSize: deviceSize,
    timeBonus: timeBonus,
  };
});

/* ===== src/autoplay.js ===== */
/*
 * autoplay.js — 자동 플레이 봇 (공용 모듈: 자동 시연·tools/bot.js·테스트가 같은 코드를 쓴다)
 * ------------------------------------------------------------
 * 브라우저(자동 시연, attract.js)와 Node(tools/bot.js, 테스트) 양쪽에서 읽힌다.
 *
 * 봇이 하는 일 (사람보다 빠르고 정확한 "잘하는 사람" 기준)
 *   1) 아직 꺼진 장치 중 가까운 것(높이 차는 더 멀게 친다)을 목표로 고른다.
 *   2) 목표가 같은 높이면 그쪽으로 달린다. 앞이 막히면 점프한다.
 *   3) 목표가 더 높으면, 한 번에 오를 수 있는 발판 아래로 가서 점프해 뚫고 올라간다.
 *   4) 목표가 더 낮으면, 지금 발판 끝으로 걸어가 떨어진다.
 *   5) 파워업 상자가 나타나면 그것도 목표 후보에 넣는다 (오토파일럿 등 효과는 게임 규칙대로).

    seq: null, // music.js 순서기
    tempo: 1, // 템포 배율
    level: -1, // 지금 bgmGain 목표 크기 (바뀔 때만 다시 맞춘다)

    try {

        if (!AC) return; // 오디오를 지원하지 않는 환경
        ctx = new AC();

        master = ctx.createGain();
        master.gain.value = muted ? 0 : 1;
        if (ctx.createDynamicsCompressor) {
          comp = ctx.createDynamicsCompressor();
          setParam(comp.threshold, -14); // 이 크기(dB)를 넘는 소리부터 눌러 준다
          setParam(comp.knee, 10);
          setParam(comp.ratio, 6);
          setParam(comp.attack, 0.004);
          setParam(comp.release, 0.18);
          master.connect(comp);
          comp.connect(ctx.destination);
        } else {
          master.connect(ctx.destination);
        }
        sfxGain = ctx.createGain();
        sfxGain.gain.value = A.sfxVolume;
        sfxGain.connect(master);
        bgmGain = ctx.createGain();
        bgmGain.gain.value = 0; // 곡이 정해지면 setBgm이 올린다
        bgmGain.connect(master);
        noiseBuf = makeNoise();
        bgm.timer = setInterval(scheduleBgm, A.schedulerMs);
      }
      if (ctx.state === 'suspended' && !hidden) ctx.resume();
    } catch (e) {
      ctx = null; // 실패해도 게임은 계속 (소리만 안 남)
    }
  }

  // 드럼·효과음 재료: 1초 길이의 무작위 잡음
  function makeNoise() {
    var len = Math.floor(ctx.sampleRate);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

    return !!ctx && ctx.state === 'running' && !muted && sfxOn;
  }

  /**
   * 음 하나 울리기
   * @param {object} o
   *   type   : 'square' | 'triangle' | 'sawtooth' | 'sine' (파형)
   *   freq   : 시작 음높이(Hz),  to : 끝 음높이(Hz) — 주면 음이 미끄러지듯 바뀐다
   *   dur    : 길이(초),  vol : 크기(0-1),  delay : 몇 초 뒤에 울릴지
   *   attack : 크기가 다 올라오는 데 걸리는 시간(초, 기본 0.01). 패드처럼 천천히 커지게 할 때 길게

  function tone(o) {
    if (!canPlay()) return;
    try {
      var t0 = ctx.currentTime + (o.delay || 0);
      var dur = o.dur || 0.1;
      var att = Math.min(o.attack || 0.01, dur * 0.8);

      var gain = ctx.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(o.freq, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
      if (o.vib) {

        var lg = ctx.createGain();
        lfo.frequency.value = o.vib.rate;
        lg.gain.value = o.vib.depth;
        lfo.connect(lg);
        lg.connect(osc.frequency);
        lfo.start(t0);
        lfo.stop(t0 + dur + 0.02);

      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(o.vol || 0.5, t0 + att);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(sfxGain);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) {
      /* 소리 실패는 무시 */
    }
  }

   *   filter : 'lowpass'(낮은 소리만) | 'highpass'(높은 소리만) | 'bandpass'(가운데만)

      src.buffer = noiseBuf;
      src.loop = dur > 0.9; // 1초보다 긴 소리는 잡음 재료를 되풀이

      if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t0 + dur);
      if (o.q) f.Q.value = o.q;
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.4, t0 + att);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f);
      f.connect(g);
      g.connect(sfxGain);
      src.start(t0, Math.random() * 0.5);
      src.stop(t0 + dur + 0.02);
    } catch (e) {
      /* 소리 실패는 무시 */
    }
  }

    notes.forEach(function (n) { tone({ type: type, freq: n[0], delay: n[1], dur: n[2], vol: vol }); });
  }

    n: '#2a2a30', r: '#4a2a26', w: '#6a6660', b: '#2a2e3a', j: '#22242c', J: '#1a1c22', o: '#55524c' };

      jump: FRAMES.jump.map(toCanvas),

      var top = i < 13 ? 4 - Math.floor(i / 4) + 1 : 1 + Math.floor((i - 13) / 3.2);
      top = Math.max(1, Math.min(8, top));
      ctx.fillStyle = '#1d1a2b';
      ctx.fillRect(x + i, y + top - 1, 1, 1); // 외곽선
      ctx.fillStyle = i % 7 === 0 ? '#b8bec8' : '#d4d9e0'; // 스테인리스 판 이음새
      ctx.fillRect(x + i, y + top, 1, 11 - top);
    }
    ctx.fillStyle = '#2a2f3a'; // 창문
    ctx.fillRect(x + 9, y + 4, 12, 2);
    ctx.fillStyle = '#ffffff'; // 앞쪽 가로 라이트
    ctx.fillRect(x + 27, y + 8, 5, 1);
    ctx.fillStyle = '#e82127'; // 뒤쪽 빨간 등
    ctx.fillRect(x, y + 8, 2, 1);

      ctx.fillStyle = '#121212';
      ctx.fillRect(x + wx - 3, y + 9, 7, 5);
      ctx.fillStyle = '#8a909a';
      ctx.fillRect(x + wx - 1, y + 10, 3, 3);

  /**
   * 스타십 모양 로켓 (SpaceX 완료 연출). 가로 12, 세로 44. (cx, bottom)은 가운데 아래.
   * flame이 true면 아래로 불꽃을 뿜는다.
   */
  function drawRocket(ctx, cx, bottom, t, flame) {
    var x = Math.round(cx) - 6;
    var top = Math.round(bottom) - 44;
    ctx.fillStyle = '#1d1a2b';
    ctx.fillRect(x + 1, top + 6, 10, 38); // 몸통 외곽
    ctx.fillStyle = '#d9dee6';
    ctx.fillRect(x + 2, top + 6, 8, 37); // 스테인리스 몸통
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + 3, top + 6, 2, 37); // 빛 반사
    // 둥근 앞부분 (위로 갈수록 좁아짐)
    var nose = [[4, 0, 4], [3, 1, 6], [2, 3, 8]];
    nose.forEach(function (n) {
      ctx.fillStyle = '#1d1a2b';
      ctx.fillRect(x + n[0] - 1, top + n[1], n[2] + 2, n[1] === 3 ? 3 : 2);
      ctx.fillStyle = '#d9dee6';
      ctx.fillRect(x + n[0], top + n[1] + (n[1] === 0 ? 1 : 0), n[2], 2);
    });
    // 날개(앞뒤 플랩)
    ctx.fillStyle = '#9aa3b2';
    ctx.fillRect(x - 1, top + 9, 3, 6);
    ctx.fillRect(x + 10, top + 9, 3, 6);
    ctx.fillRect(x - 2, top + 34, 4, 9);
    ctx.fillRect(x + 10, top + 34, 4, 9);
    if (flame) {
      var f = Math.floor(t * 16) % 2;
      ctx.fillStyle = '#ff8a2a';
      ctx.fillRect(x + 2, bottom, 8, 6 + f * 3);
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(x + 3, bottom, 6, 4 + f * 2);
      ctx.fillStyle = '#fff6d0';
      ctx.fillRect(x + 4, bottom, 4, 2 + f);
    }
  }

  return {
    W: W,
    H: H,
    FRAMES: FRAMES,
    PALETTE: PALETTE,
    BUG_W: BUG_W,
    BUG_H: BUG_H,
    BUG_FRAMES: BUG_FRAMES,
    BUG_PALETTE: BUG_PALETTE,
    drawPlayer: drawPlayer,
    drawBug: drawBug,
    drawSpark: drawSpark,
    drawTruck: drawTruck,
    drawRocket: drawRocket,
  };
});

/*
 * tileset.js — 타일 그림 묶음(아틀라스) 준비와 타일 그리기 (브라우저 전용, 2판)
 * ------------------------------------------------------------
 * 1) build.mjs가 assets/tileset_tech.png를 base64로 HTML 안에 넣어 두었으면
 *    (window.PF_ASSETS.tileset) 그 그림을 쓴다.
 *    (tiles.js의 IMAGE_READY가 false면 build가 PNG를 넣지 않는다 → 아래 2번)
 * 2) 그림이 없거나 읽기에 실패하면, tiles.js의 fb(대체 그림) 정보로
 *    단순한 픽셀 타일셋을 코드로 만들어 쓴다. 그래서 타일셋이 없어도 게임은 돌아간다.
 * 3) 실제 그림이 번호표보다 작아서 어떤 번호의 칸이 없으면, 그 칸만 대체 그림을 쓴다.
 */
(function (PF) {
  'use strict';

  var T = PF.config.TILE;
  var COLS = PF.tiles.COLS;

  var image = null; // 실제 타일셋 그림 (읽기에 성공하면)
  var imageHi = null; // 고해상도 판: 타일 칸마다 Scale3x로 3배 (hires.js). 없으면 image를 그대로 쓴다
  var fallbackHi = null; // 대체 타일의 고해상도 판
  var imageRows = 0; // 실제 그림의 세로 칸 수
  var fallback = null; // 코드로 만든 대체 타일셋 캔버스

  // ── 색 도우미 ───────────────────────────────────────────
  // 색을 밝게(+) 또는 어둡게(-) 만든다. amt는 -255~255
  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.max(0, Math.min(255, (n >> 16) + amt));
    var g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    var b = Math.max(0, Math.min(255, (n & 255) + amt));
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  // 꺼진 장치용: 색을 회색 쪽으로 섞고 어둡게 (채도 낮게)
  function dull(hex) {

    var r = n >> 16;
    var g = (n >> 8) & 255;
    var b = n & 255;
    var gray = (r + g + b) / 3;
    function mix(c) { return Math.max(0, Math.round((c * 0.35 + gray * 0.65) * 0.55)); }
    return '#' + ((1 << 24) | (mix(r) << 16) | (mix(g) << 8) | mix(b)).toString(16).slice(1);

  // ── 지형 ────────────────────────────────────────────────
  function drawFallbackTile(g, fb, ox, oy, id) {
    switch (fb.t) {
      case 'ground': {

        rect(g, ox + 13, oy + 2, 1, 1, shade(fb.body, 30));
        rect(g, ox + 2, oy + 13, 1, 1, shade(fb.body, 30));
        rect(g, ox + 13, oy + 13, 1, 1, shade(fb.body, 30));
        rect(g, ox, oy + T - 1, T, 1, shade(fb.body, -25)); // 판 이음새
        if (fb.top) {

        }
        if (fb.l) rect(g, ox, oy, 1, T, shade(fb.top || fb.body, -50));

        for (var i = 2; i < T; i += 4) rect(g, ox + i, oy + 2, 2, 1, shade(fb.c, -55)); // 구멍
        rect(g, ox, oy + 5, T, 1, fb.line || shade(fb.c, -60));
        rect(g, ox + 3, oy + 6, 1, 3, shade(fb.c, -40)); // 받침 다리
        rect(g, ox + 12, oy + 6, 1, 3, shade(fb.c, -40));
        if (fb.l) rect(g, ox, oy, 1, 6, shade(fb.c, -60));
        if (fb.r) rect(g, ox + T - 1, oy, 1, 6, shade(fb.c, -60));
        break;
      }
      case 'block': {

        rect(g, ox + 1, oy + 1, T - 2, T - 2, fb.c);
        rect(g, ox + 1, oy + 1, T - 2, 1, shade(fb.c, 40));
        rect(g, ox + 3, oy + 3, 10, 10, shade(fb.c, 12));

        break;
      case 'filter': // 천장 필터 격자
        rect(g, ox, oy, T, 6, c);
        for (var f = 0; f < T; f += 4) rect(g, ox + f, oy, 1, 6, shade(c, -30));
        rect(g, ox, oy + 6, T, 1, shade(c, -45));
        break;
      case 'wafer': // 무지개빛 웨이퍼
        rect(g, ox + 3, oy + 8, 10, 8, '#8a94b0');
        rect(g, ox + 4, oy + 9, 8, 6, '#c8b6ff');
        rect(g, ox + 5, oy + 10, 3, 2, '#9ff2ff');
        rect(g, ox + 8, oy + 12, 3, 2, '#ffd6a0');
        break;
      case 'suit': // 방진복 걸이
        rect(g, ox + 2, oy + 3, 12, 1, '#8a94a6');
        rect(g, ox + 5, oy + 4, 6, 11, shade(c, -15));
        rect(g, ox + 6, oy + 5, 4, 2, '#2a3a6a'); // 고글
        break;
      case 'cart':
        rect(g, ox + 2, oy + 8, 12, 5, c);
        rect(g, ox + 2, oy + 8, 12, 1, lite);
        rect(g, ox + 3, oy + 14, 2, 2, '#3c4352');
        rect(g, ox + 11, oy + 14, 2, 2, '#3c4352');
        break;
      case 'truss': // 발사대 철골
        rect(g, ox + 3, oy, 1, T, c);
        rect(g, ox + 12, oy, 1, T, c);
        for (var tr = 0; tr < T; tr++) rect(g, ox + 3 + Math.floor(tr * 9 / 15), oy + tr, 1, 1, dark);
        break;
      case 'smoke':
        rect(g, ox + 2, oy + 9, 12, 7, c);
        rect(g, ox + 4, oy + 6, 8, 4, shade(c, 15));
        break;
      case 'star':
        rect(g, ox + 7, oy + 6, 1, 3, c);
        rect(g, ox + 6, oy + 7, 3, 1, c);
        break;
      case 'antenna':
        rect(g, ox + 7, oy + 4, 1, 12, c);
        rect(g, ox + 3, oy + 3, 9, 2, c);

  // ── 장치 ────────────────────────────────────────────────

        rect(g, x + 2, y + 5, 12, 2, shade(B, 25));
        rect(g, x + 4, y + 9, 8, 7, D);
        rect(g, x + 5, y + 10, 6, 5, L); // 빛나는 창
        rect(g, x + 4, y + 20, 8, 1, D);
        rect(g, x + 4, y + 23, 8, 1, D);

      case 'foup': // 웨이퍼 보관함: 작은 상자 + 웨이퍼 줄

        rect(g, x + 4, y + 3, 8, 11, B);
        rect(g, x + 5, y + 5, 6, 3, L);
        rect(g, x + 5, y + 10, 2, 2, D);

      case 'tank': // 연료 탱크: 둥근 원통 + 띠 + 눈금

        rect(g, x + 3, y + 6, 10, 1, D);

    c.height = rows * T;

/*

 * build.mjs가 assets/sprites_tech.png(그림)와 sprites_tech.json(프레임 위치)을

 *
 *   PF.spritesheet.draw(ctx, '이름', 프레임, x, y, { flip, scale, alpha })
 *     (x, y)는 그림 왼쪽 위. 프레임 번호는 넘쳐도 자동으로 돌아간다.

(function (PF) {

  var DEFS = PF.spritedefs;

  var imageHi = null; // 고해상도 판 (Scale3x 3배, hires.js). 없으면 image
  var hiCache = {}; // 대체 그림의 고해상도 판

  var fallbackCache = {}; // '이름#프레임' → 대체 그림 캔버스

  function init(onReady) {
    var A = window.PF_ASSETS || {};

    var json = A.spriteFrames;
    if (!src || !json || !json.frames) {
      console.info('[sprites] 스프라이트 시트가 없어 대체 그림을 씁니다.');
      onReady();
      return;

      onReady();
    };
    img.onerror = function () {
      console.warn('[sprites] 스프라이트 시트를 읽지 못해 대체 그림을 씁니다.');

  // ── 대체 그림 (그림 담당 시트가 없을 때) ────────────────
  function fallback(name, fi) {

    if (fallbackCache[key]) return fallbackCache[key];

    var c = document.createElement('canvas');

    c.height = d.h;

  var K = '#0e1018'; // 외곽선

    px(g, 4, y0 + 1, 8, 1, o.hair);
    px(g, 4, y0 + 2, 8, 6, K); // 얼굴 외곽
    px(g, 5, y0 + 2, 6, 5, SKIN);
    px(g, 5, y0 + 2, 6, 1, o.hair);

    px(g, 3, y0 + 8, 10, 8, K); // 몸통 외곽
    px(g, 4, y0 + 8, 8, 7, o.top);
    if (o.shine) px(g, 5, y0 + 9, 1, 5, o.shine); // 가죽 재킷 광택
    if (o.collar) px(g, 7, y0 + 8, 2, 3, o.collar);

    } else {

  // 차 모양 (32x16). kind: 'car' 세단, 'suv', 'roadster', 'car2' 2인승, 'truck'
  function vehicle(g, d, f, on, kind) {

/*
 * background.js — 무대(회사)별 배경을 코드로 그린다 (브라우저 전용, 2판)
 * ------------------------------------------------------------
 * 그림 파일 없이 벽 색 + 먼 시설 실루엣 + 회사 분위기 소품을 그린다.
 * 공식 로고는 그리지 않는다. 회사 대표 색과 제품 모양으로 분위기만 낸다.
 * "시차 스크롤(parallax)": 먼 물체는 카메라보다 천천히 움직여서 깊이감이 생긴다.
 *   화면 위치 = 원래 위치 - 카메라 위치 × 비율(0이면 고정, 1이면 땅과 같이 움직임)
 * 게임 중에는 이 위에 어둠이 덮이므로, 배경은 밝아질수록 드러난다.
