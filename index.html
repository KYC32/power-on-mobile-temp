(function (PF) {
  'use strict';

  var W = PF.config.VIEW_W;
  var H = PF.config.VIEW_H;

  // 항상 같은 결과가 나오는 간단한 난수 (seed가 같으면 같은 수열)
  function seeded(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  // 별·소품 위치를 미리 정해 둔다 (매 프레임 새로 만들지 않게)
  var rnd = seeded(20261109);
  var STARS = [];
  for (var i = 0; i < 70; i++) STARS.push({ x: rnd() * 640, y: rnd() * 110, p: rnd() });
  var LEDS = [];
  for (var j = 0; j < 90; j++) LEDS.push({ x: rnd() * 640, y: 30 + rnd() * 110, p: rnd() });

  // 양수 나머지 (음수 좌표에서도 0~n 사이로)
  function wrap(v, n) { return ((v % n) + n) % n; }

  // 벽(하늘): 위 → 가운데 → 아래 3색 그라데이션 (무대별로 한 번만 만들어 둔다)
  var bgCache = {};

    ctx.fillStyle = g;

    for (var x = -off - gap; x < W + gap; x += gap) fn(Math.round(x));

    // TESLA 기가팩토리: 밝은 공장 벽, 큰 창, 빨간 띠, 천장 트러스
    tesla: function (ctx, s, camX, t) {
      repeat(camX, 0.15, 64, function (x) { // 먼 천장 트러스
        rect(ctx, x, 14, 64, 2, '#aab1bb');
        for (var k = 0; k < 64; k += 8) rect(ctx, x + k, 16, 1, 8, '#b7bec8');
      });
      repeat(camX, 0.3, 80, function (x) { // 큰 창
        rect(ctx, x + 10, 36, 50, 40, '#8796a8');
        rect(ctx, x + 12, 38, 46, 36, '#b9cbdc');
        rect(ctx, x + 34, 38, 2, 36, '#8796a8');
        rect(ctx, x + 12, 55, 46, 2, '#8796a8');
      });
      rect(ctx, 0, 92, W, 4, s.color); // 빨간 띠
      repeat(camX, 0.45, 120, function (x) { // 먼 조립 라인 실루엣
        rect(ctx, x + 10, 110, 70, 26, '#a3aab4');
        rect(ctx, x + 20, 100, 8, 10, '#a3aab4');
        rect(ctx, x + 60, 96, 6, 14, '#a3aab4');
      });
    },
    // NVIDIA AI 데이터센터: 검은 방, 먼 서버 랙 줄, 깜빡이는 초록 LED
    nvidia: function (ctx, s, camX, t) {
      repeat(camX, 0.3, 36, function (x) {
        rect(ctx, x + 4, 28, 26, 120, '#151a12');
        rect(ctx, x + 5, 29, 24, 118, '#1c2318');
      });

        rect(ctx, x, l.y, 1, 1, on ? s.color : '#2a3a1a');
      });
      rect(ctx, 0, 18, W, 2, '#2a3324'); // 천장 케이블 트레이
      rect(ctx, 0, 21, W, 1, '#3d4a30');
    },

    samsung: function (ctx, s, camX, t) {
      repeat(camX, 0.15, 24, function (x) { // 천장 필터
        rect(ctx, x, 10, 23, 14, '#dfe5f0');
        rect(ctx, x + 23, 10, 1, 14, '#c3cbdb');
      });
      rect(ctx, 0, 24, W, 1, '#c3cbdb');
      repeat(camX, 0.3, 90, function (x) { // 유리 칸막이와 먼 장비
        rect(ctx, x + 6, 40, 70, 60, '#d3dcec');
        rect(ctx, x + 8, 42, 66, 56, '#e7eef9');
        rect(ctx, x + 20, 70, 24, 28, '#c8d2e4');
        rect(ctx, x + 50, 76, 16, 22, '#c8d2e4');
      });
      rect(ctx, 0, 100, W, 3, s.color); // 파란 띠
    },
    // SpaceX 발사장: 밤하늘, 별, 먼 발사탑과 언덕
    spacex: function (ctx, s, camX, t) {
      STARS.forEach(function (st) {
        var x = wrap(st.x - camX * 0.05, 640);
        if (x > W) return;
        rect(ctx, x, st.y, 1, 1, Math.sin(t * 2 + st.p * 10) > 0.6 ? '#ffffff' : '#8f9ad0');
      });
      repeat(camX, 0.25, 220, function (x) { // 먼 발사탑
        rect(ctx, x + 40, 60, 10, 80, '#1b2350');
        for (var k = 0; k < 80; k += 8) rect(ctx, x + 40, 60 + k, 10, 1, '#2a3366');
        rect(ctx, x + 50, 72, 14, 2, '#1b2350');
        rect(ctx, x + 41, 56, 1, 4, '#ff5a3a');
      });
      repeat(camX, 0.4, 160, function (x) { // 언덕
        rect(ctx, x, 132, 160, 48, '#121a3e');
        rect(ctx, x + 30, 126, 60, 6, '#121a3e');
      });
    },
  };

  /**
   * 배경 그리기
   * @param stage  config.STAGES의 한 항목
   * @param camX   카메라 x (픽셀)
   * @param t      흐른 시간(초) — 반짝임용
   */

    var fn = DRAW[stage.key];

  PF.background = { draw: draw };
})(window.PF);

/* ===== src/fx.js ===== */
/*
 * fx.js — 손맛 연출: 화면 흔들림, 번쩍임, 빛 입자, 폭죽 (브라우저 전용, docs/fun-brief.md 6번)
 * ------------------------------------------------------------
 * main.js가 게임 알림(power, stage, zap)을 받으면 여기를 부르고, render.js가 그린다.
 * 세기는 config.JUICE 한 곳에서 조절한다 (부스에서 여럿이 보므로 과하지 않게).
 * 게임 규칙에는 영향이 없다 (순수 장식).
 */
(function (PF) {
  'use strict';

  var W = PF.config.VIEW_W;
  var H = PF.config.VIEW_H;

  var shakeAmt = 0; // 흔들림 세기(픽셀)
  var shakeLeft = 0; // 남은 흔들림 시간
  var shakeMax = 0;
  var flashes = []; // [{ color(r,g,b), alpha, life, max }]
  var sparks = []; // 월드 좌표 입자 [{ x, y, vx, vy, life, max, color }]
  var fireworks = []; // 화면 좌표 입자 [{ x, y, vx, vy, life, max, color }]
  var clock = 0;

  var SPARK_COLORS = ['#fff6a0', '#ffffff', '#ffd23f', '#a6e33f'];
  var FIRE_COLORS = ['#ff4a5a', '#ffd23f', '#7cf29a', '#72a0ff', '#e04fae', '#ffffff'];

  // 늘 같은 순서로 나오는 간단한 난수 (화면 장식용)
  var seed = 12345;
  function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }

  /** 화면 흔들림 시작. 더 센 흔들림이 진행 중이면 그대로 둔다 */
  function shake(amount, time) {
    if (amount <= 0) return;
    if (shakeLeft > 0 && shakeAmt > amount) return;
    shakeAmt = amount;
    shakeLeft = time;
    shakeMax = time;
  }

  /** 화면 번쩍 (rgb는 '255,255,255' 같은 글자) */
  function flash(rgb, alpha, time) {
    if (alpha <= 0) return;
    flashes.push({ rgb: rgb, alpha: alpha, life: time, max: time });
  }

  /** 빛 입자 튀기기 (월드 좌표) */
  function burst(x, y, count) {
    for (var i = 0; i < count; i++) {
      var a = rnd() * Math.PI * 2;
      var sp = 40 + rnd() * 60;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: 0.45, max: 0.45, color: SPARK_COLORS[i % SPARK_COLORS.length] });
    }
  }

  /** 폭죽 (화면 좌표, 위쪽 하늘에서 터진다) */
  function fireworksShow(count) {
    for (var f = 0; f < count; f++) {
      var cx = 50 + rnd() * (W - 100);
      var cy = 40 + rnd() * 50;
      var color = FIRE_COLORS[Math.floor(rnd() * FIRE_COLORS.length)];
      for (var i = 0; i < 18; i++) {
        var a = i / 18 * Math.PI * 2;
        var sp = 45 + rnd() * 20;
        fireworks.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.9 + f * 0.15, max: 0.9 + f * 0.15, color: color, delay: f * 0.18 });
      }
    }
  }

  function update(dt) {
    clock += dt;
    if (shakeLeft > 0) shakeLeft = Math.max(0, shakeLeft - dt);
    for (var i = flashes.length - 1; i >= 0; i--) {
      flashes[i].life -= dt;
      if (flashes[i].life <= 0) flashes.splice(i, 1);
    }
    stepParticles(sparks, dt, 160);
    stepParticles(fireworks, dt, 50);
  }

  function stepParticles(list, dt, gravity) {
    for (var i = list.length - 1; i >= 0; i--) {
      var p = list[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.life -= dt;
      if (p.life <= 0) { list.splice(i, 1); continue; }
      p.vy += gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  /** 지금 흔들림 양 { x, y } (픽셀, 정수). 시간이 갈수록 약해진다 */
  function offset() {
    if (shakeLeft <= 0) return { x: 0, y: 0 };
    var k = shakeLeft / shakeMax;
    var a = Math.round(shakeAmt * k);
    return { x: Math.round(Math.sin(clock * 83) * a), y: Math.round(Math.cos(clock * 67) * a * 0.6) };
  }

  /** 월드 입자 그리기 (카메라 좌표를 빼서) */
  function drawSparks(g, camX, camY) {
    for (var i = 0; i < sparks.length; i++) {
      var p = sparks[i];
      g.globalAlpha = Math.max(0, p.life / p.max);
      g.fillStyle = p.color;
      g.fillRect(Math.round(p.x - camX), Math.round(p.y - camY), 2, 2);
    }
    g.globalAlpha = 1;
  }

  /** 화면 위 연출 그리기 (폭죽, 번쩍임) */
  function drawScreen(g) {
    for (var i = 0; i < fireworks.length; i++) {
      var p = fireworks[i];
      if (p.delay > 0) continue;
      g.globalAlpha = Math.max(0, p.life / p.max);
      g.fillStyle = p.color;
      g.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
    }
    g.globalAlpha = 1;
    for (var f = 0; f < flashes.length; f++) {
      var fl = flashes[f];
      g.fillStyle = 'rgba(' + fl.rgb + ',' + (fl.alpha * fl.life / fl.max).toFixed(3) + ')';
      g.fillRect(0, 0, W, H);
    }
  }

  /** 새 판·타이틀로 돌아갈 때 모두 지운다 */
  function reset() {
    shakeLeft = 0;
    flashes = [];
    sparks = [];
    fireworks = [];
  }

  PF.fx = {
    shake: shake,
    flash: flash,
    burst: burst,
    fireworks: fireworksShow,
    update: update,
    offset: offset,
    drawSparks: drawSparks,
    drawScreen: drawScreen,
    reset: reset,
  };
})(window.PF);

/*
 * render.js — 게임 세계를 저해상도(320x180) 캔버스에 그린다 (브라우저 전용, 2판 + 콘텐츠 보강)
 * ------------------------------------------------------------
 * 그리는 순서
 *   배경 → 뒤쪽 소품(로보택시·Falcon 9·위성 줄) → 바닥·벽·장식 → 장치 → 앞쪽 소품(오리 로봇·로봇청소기)
 *   → 버그 → 플레이어 → 어둠 → (어둠 위) 꺼진 장치 최소 밝기·대기등·버그·스파크·진행자 → 완료 연출
 * 글자(말풍선 글, HUD)는 main.js가 큰 캔버스에 따로 그린다. 한글이 뭉개지지 않게 하기 위해서다.
 *
 * 어둠 연출
 *   1) 화면 전체를 어두운 색으로 덮는다. 덮는 진하기 = 1 - 밝기(game.js의 brightness).
 *   2) 플레이어 둘레와 켠 장치 둘레는 어둠을 지워 밝게 한다.
 *   3) 어둠 위에 꺼진 장치와 버그를 최소 밝기로 한 번 더 그리고, 빨간 대기 표시등을 깜빡인다.
 *
 * 큰 그림(차·인물·연출)은 PF.spritesheet가 그린다. 시트에 그 이름이 없으면 대체 그림이 나온다.
 */
(function (PF) {
  'use strict';

  var cfg = PF.config;
  var T = cfg.TILE;
  var W = cfg.VIEW_W;
  var H = cfg.VIEW_H;
  var S = PF.sprites;
  var SP = PF.spritesheet;
  var DARK_RGB = '5,6,14'; // 어둠 색 (아주 진한 남색)
  var TL = PF.tiles.ID; // 타일 이름 → 번호
  var HOST_POS = { x: 6, y: 31 }; // 무대 시작 때 진행자를 세우는 화면 위치 (말풍선은 main.js가 오른쪽에)

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(v) { v = clamp01(v); return 1 - (1 - v) * (1 - v); } // 처음 빠르고 끝에 느려짐
  function lerp(a, b, v) { return a + (b - a) * v; }

  // 맵의 움직이지 않는 타일(바닥·벽·장식)은 맵마다 큰 캔버스 한 장에 미리 그려 둔다.

    var c = staticCache && staticCache.get(map);

    c.logicalH = map.height * T;

    map.drawLayers.forEach(function (layer) {
      layer.tiles.forEach(function (t) {

    d.fillStyle = 'rgba(' + DARK_RGB + ',' + (1 - brightness).toFixed(3) + ')';
    d.fillRect(0, 0, W, H);
    // 빛: 어둠을 "지운다". 띠 모양(계단식)으로 지워 픽셀 게임다운 둥근 빛이 된다.

  // 꺼진 장치의 대기 표시등 깜빡임 (그림 속 led_red 픽셀 자리에서)
  // bright: 폴드 펼치기 파워업 중이면 더 크고 밝게

  function drawStandbyLeds(g, dev, bx, by, blinkOn, bright, led) {

    var mapW = s.map.width * T;
    if (stage.key === 'tesla') {
      // 로보택시(Cybercab)가 바닥 뒤쪽 차선을 천천히 지나간다 (오른쪽 → 왼쪽으로 반복)
      var lane = propSpot(s, 'robotaxi', 30);
      var x = mapW - ((s.t * 22 + (mapW - lane.x * T)) % (mapW + 64));
      SP.draw(g, 'robotaxi', Math.floor(s.t * 6), x - camX, (lane.y + 1) * T - 16 - camY, { flip: true });
    } else if (stage.key === 'spacex') {
      // Falcon 9가 서 있다 (기준 칸의 왼쪽 아래에 그림의 왼쪽 아래를 맞춘다)
      var f9 = propSpot(s, 'falcon9', 27);
      var fh = SP.size('falcon9').h;
      SP.draw(g, 'falcon9', 0, f9.x * T - camX, (f9.y + 1) * T - fh - camY);
      // 스타링크 위성 줄이 14초마다 한 번 밤하늘을 가로지른다 (화면에 고정된 하늘)
      var ph = s.t % 14;
      if (ph < 5) SP.draw(g, 'sat_train', 0, lerp(-70, W + 10, ph / 5), 34 - ph * 2);
    }
  }

  // 앞쪽: 장치 다음에 그린다 (어둠 속에서는 같이 어둡다)
  function drawPropsFront(g, s, stage, camX, camY) {
    var range = s.map.width * T - 4 * T; // 양옆 벽 사이를 왔다 갔다
    if (stage.key === 'nvidia' && s.phase !== 'clear') {
      // 오리 로봇(마이크로덕): 뒤뚱뒤뚱 앞뒤로 왔다 갔다 (흔들림은 그림 프레임 안에 그려져 있다)
      // 그리는 위치는 실제 프레임 크기(16x16 또는 24x24)로 계산한다: 그림 아래 끝 = 기준 칸 아래(바닥 윗면)
      var spot = propSpot(s, 'duckbot_walk', 20);
      var dFrame = Math.floor(s.t * 6);
      var dSize = SP.size('duckbot_walk', dFrame);
      var dRange = Math.max(T, s.map.width * T - 3 * T - dSize.w); // 오른쪽 끝에서도 그림이 벽에 묻히지 않게
      var v = s.t * 18 + (spot.x - 2) * T;
      var goingLeft = Math.floor(v / dRange) % 2 === 1;
      SP.draw(g, 'duckbot_walk', dFrame, 2 * T + pingpong(v, dRange) - camX, (spot.y + 1) * T - dSize.h - camY, { flip: goingLeft });
    } else if (stage.key === 'samsung' && !(s.traps || []).some(function (tr) { return tr.kind === 'vac'; })) {
      // 로봇청소기: 바닥을 왔다 갔다 (맵에 로봇청소기 함정이 있으면 함정이 대신 움직인다)
      var vac = propSpot(s, 'robovac', 14);
      var v2 = s.t * 26 + (vac.x - 2) * T;
      SP.draw(g, 'robovac', Math.floor(s.t * 8), 2 * T + pingpong(v2, range) - camX, (vac.y + 1) * T - 16 - camY, { flip: Math.floor(v2 / range) % 2 === 1 });
    }
  }

  // ── 게임 중 화면 ────────────────────────────────────────
  // 완료 연출 중 화면 흔들림 (SpaceX 발사·캐치 순간)
  function shakeOf(s, stage) {
    if (s.phase !== 'clear' || stage.key !== 'spacex') return 0;
    var pt = s.phaseTime;
    if ((pt > 0.1 && pt < 1.0) || (pt > 2.9 && pt < 3.4)) return Math.round(Math.sin(s.t * 70) * 2);
    return 0;
  }

  /**
   * s는 game.js의 Session.
   * opts.host: true면 진행자를 왼쪽 위에 세운다 (파워업 한마디 때. 무대 시작 2초는 자동)
   */
  function drawWorld(g, s, opts) {
    opts = opts || {};
    var stage = s.stageDef();
    var map = s.map;
    var clear = s.phase === 'clear';
    var jolt = PF.fx.offset(); // 손맛 흔들림 (장치 켤 때·무대 완료)
    var camX = Math.round(s.camera.x) + shakeOf(s, stage) + jolt.x;
    var camY = Math.round(s.camera.y) + jolt.y;
    var foldOn = s.hasPower('fold'); // 폴드 펼치기: 빛 반지름 2배, 대기등 더 밝게

    // 1) 배경, 뒤쪽 소품, 바닥·벽·장식
    PF.background.draw(g, stage, camX, s.t);
    drawPropsBack(g, s, stage, camX, camY);
    var layerC = staticLayer(map);
    g.drawImage(layerC, -camX, -camY, layerC.logicalW || layerC.width, layerC.logicalH || layerC.height);

    // 2) 장치. 막 켜진 장치는 잠깐 하얗게 번쩍인다.
    var lights = [];
    var onScreen = function (dev) { var bx = dev.x * T - camX; return bx > -3 * T && bx < W + T; };
    s.devices.forEach(function (dev) {
      var bx = dev.x * T - camX;
      var by = dev.y * T - camY;
      var r = deviceRect(dev, bx, by);
      // 빛은 그림보다 넓으므로 화면 걸러내기와 따로 넣는다 (원 전체가 화면 밖이면 drawDarkness가 건너뛴다)
      if (dev.on) lights.push({ x: r.x + r.w / 2, y: r.y + r.h / 2, r: cfg.LIGHT.deviceRadius });
      if (!onScreen(dev)) return;
      drawDevice(g, dev, bx, by, s.t);
      if (dev.flash > 0) {
        g.fillStyle = 'rgba(255,255,255,' + Math.min(0.8, dev.flash * 2).toFixed(2) + ')';
        g.fillRect(r.x, r.y, r.w, r.h);
      }
    });

    // 2-1) 함정 몸체 (어둠 아래. 경고·발동 효과는 어둠 위에 다시 그린다)
    (s.traps || []).forEach(function (tr) { if (trapOnScreen(tr, camX)) drawTrapBody(g, s, tr, camX, camY); });
    trapLights(s, camX, camY, lights);
    // 2-2) 점프대 (회사마다 모양이 다르다, docs/minute-pad-brief.md)
    (s.pads || []).forEach(function (pad) { drawPad(g, s, stage, pad, camX, camY, false); });

    // 3) 앞쪽 소품, 버그, 플레이어 (감전 뒤 무적 시간에는 깜빡인다)
    drawPropsFront(g, s, stage, camX, camY);
    s.bugs.forEach(function (b) { drawBugAt(g, b, camX, camY); });
    var p = s.player;
    var pcx = Math.round(p.x + p.w / 2 - camX);
    var pcy = Math.round(p.y + p.h / 2 - camY);
    var blink = p.stun <= 0 && p.safe > 0 && Math.floor(s.t * 15) % 2 === 0;
    var burning = p.stun > 0 && p.hurtKind === 'burn'; // SpaceX 화염에 탐 (감전 대신)
    if (!blink) {
      S.drawPlayer(g, p.anim, s.playerFrame(), pcx - S.W / 2, Math.round(p.y + p.h - S.H - camY), p.facing < 0, burning ? 'burnt' : s.hasPower('jacket') ? 'jacket' : null);
    }
    lights.push({ x: pcx, y: pcy, r: cfg.LIGHT.playerRadius * (foldOn ? cfg.POWERUP.lightMul : 1) });
    // 파워업 상자도 은은하게 빛난다
    if (s.item && !s.item.taken) lights.push({ x: s.item.x * T + T / 2 - camX, y: s.item.y * T + T / 2 - camY, r: 22 });

    // 4) 어둠
    var bright = s.brightness();
    drawDarkness(g, bright, lights);

    // 5) 어둠 위: 최소 밝기(꺼진 장치·버그), 대기등 깜빡임, 감전 스파크
    var devAlpha = PF.game.minLightAlpha(bright, cfg.LIGHT.offDeviceMin);
    var bugAlpha = PF.game.minLightAlpha(bright, cfg.LIGHT.bugMin);
    var blinkOn = Math.floor(s.t * 2.5) % 2 === 0;
    s.devices.forEach(function (dev) {
      if (dev.on || !onScreen(dev)) return;
      var bx = dev.x * T - camX;
      var by = dev.y * T - camY;
      if (devAlpha > 0) {
        g.globalAlpha = devAlpha;
        drawDevice(g, dev, bx, by, s.t);
        g.globalAlpha = 1;
      }
      drawStandbyLeds(g, dev, bx, by, blinkOn, foldOn);
    });
    if (bugAlpha > 0) {
      g.globalAlpha = bugAlpha;
      s.bugs.forEach(function (b) { drawBugAt(g, b, camX, camY); });
      g.globalAlpha = 1;
    }
    // 함정: 어둠 속에서도 희미하게 보이게 몸체를 한 번 더 + 경고 깜빡임·발동 효과 (docs/trap-time-brief.md)
    (s.traps || []).forEach(function (tr) { if (trapOnScreen(tr, camX)) drawTrapFx(g, s, tr, camX, camY); });
    // 점프대도 어둠 속에서 희미하게 보이게 한 번 더 + 회사 색 표시등
    (s.pads || []).forEach(function (pad) { drawPad(g, s, stage, pad, camX, camY, true); });
    // 파워업 상자 (어둠 위, 반짝임)
    if (s.item && !s.item.taken) drawItem(g, s.item, stage, s.t, camX, camY);
    // 랩터 제트팩: 공중에 있으면 발밑에 작은 불꽃
    if (s.hasPower('jetpack') && !p.onGround) drawFlame(g, pcx, Math.round(p.y + p.h - camY) - 2, s.t, 0.6);
    // 장치 켤 때 튄 빛 입자
    PF.fx.drawSparks(g, camX, camY);
    if (burning) {
      drawBurning(g, pcx, Math.round(p.y + p.h - camY), s.t, 1 - p.stun / cfg.STUN.time);
    } else if (p.stun > 0) {
      var sparkId = TL['spark_' + (Math.floor(s.t * 20) % 2 + 1)];
      if (PF.tileset.has(sparkId)) PF.tileset.drawTile(g, sparkId, pcx - T / 2, pcy - T / 2);
      else S.drawSpark(g, pcx, pcy, s.t);
    }

    // 6) 진행자 (무대 시작 말풍선 시간 동안 왼쪽 위에 선다. 말풍선 글은 main.js)
    if (stage.host && !clear && (s.stageTime < cfg.BUBBLE_TIME || opts.host)) {
      SP.draw(g, stage.host + '_idle', Math.floor(s.t * 3), HOST_POS.x, HOST_POS.y);
    }

    // 7) 무대 완료 연출, 화면 위 손맛 연출(폭죽·번쩍임)
    if (clear) drawClearFx(g, s, stage, camX, camY);
    PF.fx.drawScreen(g);
  }

  /**
   * 불에 타는 모습 (SpaceX 화염에 닿음): 몸 위로 일렁이는 불길 + 피어오르는 연기 + 튀는 불티.
   *   (cx, feet) = 몸 가운데 x, 발 y. k = 0(막 닿음) → 1(곧 풀림): 불길은 줄고 연기가 는다
   */
  function drawBurning(g, cx, feet, t, k) {
    var top = feet - 24;
    // 불길: 몸 둘레에서 위로 일렁이는 혀 모양 (바깥 주황 → 안 노랑 → 심지 흰색)
    var fire = Math.max(0, 1 - k * 0.9);
    for (var i = 0; i < 5; i++) {
      var fx = cx - 9 + i * 4.5 + Math.sin(t * 23 + i * 1.7) * 1.2; // 어깨·몸통 양옆에서 (얼굴은 가리지 않게)
      var fh = (6 + 5 * Math.abs(Math.sin(t * 17 + i * 2.3))) * fire * (i === 2 ? 0.7 : 1);
      var base = top + 15 + (i % 2) * 4;
      if (fh < 1) continue;
      g.fillStyle = 'rgba(255,110,30,0.85)';
      g.beginPath(); g.moveTo(fx - 2.4, base); g.quadraticCurveTo(fx - 1.2, base - fh * 0.6, fx, base - fh); g.quadraticCurveTo(fx + 1.2, base - fh * 0.6, fx + 2.4, base); g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,214,90,0.9)';
      g.beginPath(); g.moveTo(fx - 1.2, base); g.quadraticCurveTo(fx - 0.5, base - fh * 0.4, fx, base - fh * 0.65); g.quadraticCurveTo(fx + 0.5, base - fh * 0.4, fx + 1.2, base); g.closePath(); g.fill();
    }
    // 연기: 회색 덩어리가 위로 퍼지며 옅어진다
    for (var j = 0; j < 4; j++) {
      var ph = (t * 1.6 + j * 0.25) % 1;
      var r = 1.5 + ph * 3.5;
      g.fillStyle = 'rgba(90,90,100,' + ((1 - ph) * (0.35 + k * 0.35)).toFixed(2) + ')';
      g.beginPath(); g.arc(cx + Math.sin(j * 2.1 + t * 2) * 3, top - ph * 14, r, 0, Math.PI * 2); g.fill();
    }
    // 불티
    for (var q = 0; q < 4; q++) {
      var sp = (t * 2.3 + q * 0.27) % 1;
      g.fillStyle = 'rgba(255,200,80,' + (1 - sp).toFixed(2) + ')';
      g.fillRect(cx - 6 + q * 4 + Math.sin(t * 9 + q) * 2, top + 6 - sp * 16, 1, 1);
    }
  }

  // ── 함정 그리기 (새 그림 없이 기존 타일 + 코드 그림) ─────────────
  var TRAP_GLOW = 0.4; // 어둠 위에 몸체를 다시 그릴 때 불투명도 (어두운 무대에서도 함정 자리가 보이게)

  function trapOnScreen(tr, camX) {
    var x0 = (tr.kind === 'vac' ? tr.px - 3 * T : tr.x0 * T) - camX;
    var x1 = (tr.kind === 'vac' ? tr.px + 3 * T : (tr.x1 + 1) * T) - camX;
    return x1 > -2 * T && x0 < W + 2 * T;
  }

  function trapState(s, tr) {
    return tr.state || PF.traps.stateOf(tr, s.trapClock || 0);
  }

  // 로봇 팔이 얼마나 내려왔는지 0(위) - 1(바닥): 켜지는 순간 0.08초 만에 쾅
  function armReach(s, tr) {
    if (trapState(s, tr) !== 'on') return 0;
    var def = tr.def || cfg.TRAPS.arm;
    var elapsed = def.on - PF.traps.timeToOff(tr, s.trapClock || 0);
    return clamp01(elapsed / 0.08);
  }

  /** 함정 몸체: 금속판·컨베이어 벨트·로봇 팔·배관 구멍·노즐·천장 송풍구·로봇청소기·미끼 장치 */
  function drawTrapBody(g, s, tr, camX, camY) {
    var bx = tr.x0 * T - camX;
    var w = (tr.x1 - tr.x0 + 1) * T;
    var floor = (tr.y + 1) * T - camY; // 바닥(발판) 윗면 화면 y
    var cx = bx + T / 2;
    var i;
    switch (tr.kind) {
      case 'shock': // 누전 바닥: 어두운 금속판 + 노란 경고 빗금
        g.fillStyle = '#2a2e3e';
        g.fillRect(bx + 1, floor - 2, w - 2, 2);
        g.fillStyle = '#c8a020';
        for (i = bx + 2; i < bx + w - 2; i += 4) g.fillRect(i, floor - 2, 2, 2);
        break;
      case 'conveyor': { // 컨베이어: 기존 벨트 타일(48-50)을 바닥 윗줄에 깔고, 미는 방향 화살표가 흘러간다
        var n = tr.x1 - tr.x0 + 1;
        for (i = 0; i < n; i++) {
          var id = i === 0 ? TL.tesla_conveyor_l : i === n - 1 ? TL.tesla_conveyor_r : TL.tesla_conveyor_m;
          PF.tileset.drawTile(g, id, bx + i * T, floor);
        }
        drawConveyorArrows(g, s, tr, bx, w, floor);
        break;
      }
      case 'arm': { // 조립 로봇 팔: 천장 레일 + 팔 + 주황 집게 머리 (켜지면 바닥까지 내려찍음)
        var railY = floor - 3 * T - 4;
        var headTop = railY + 3 + armReach(s, tr) * (floor - 8 - railY - 3);
        if (trapState(s, tr) === 'warn') headTop += Math.floor(s.t * 30) % 2; // 경고: 덜덜 떨린다
        g.fillStyle = '#5a6380';
        g.fillRect(bx, railY, T, 3);
        g.fillStyle = '#b3bccd';
        g.fillRect(cx - 1, railY + 3, 2, Math.max(0, headTop - railY - 3));
        g.fillStyle = '#0e1018';
        g.fillRect(cx - 7, headTop - 1, 14, 9);
        g.fillStyle = '#ff7a4a';
        g.fillRect(cx - 6, headTop, 12, 6);
        g.fillStyle = '#c4501e';
        g.fillRect(cx - 6, headTop + 6, 3, 2);
        g.fillRect(cx + 3, headTop + 6, 3, 2);
        break;
      }
      case 'steam': // 과열 증기: 바닥의 배관 구멍(격자)
        g.fillStyle = '#323a4f';
        g.fillRect(cx - 6, floor - 3, 12, 3);
        g.fillStyle = '#0e1018';
        for (i = -4; i <= 3; i += 3) g.fillRect(cx + i, floor - 2, 1, 2);
        break;
      case 'flame': // 엔진 화염: 바닥 노즐
        g.fillStyle = '#4a5470';
        g.fillRect(cx - 5, floor - 4, 10, 4);
        g.fillStyle = '#8d97ae';
        g.fillRect(cx - 3, floor - 6, 6, 2);
        g.fillStyle = '#1d2030';
        g.fillRect(cx - 2, floor - 6, 4, 1);
        break;
      case 'wind': { // 에어 샤워: 위쪽 송풍구 + 바닥 방향 표시
        var top = floor - cfg.TRAPS.wind.rows * T;
        g.fillStyle = '#b3bccd';
        g.fillRect(bx, top, w, 3);
        g.fillStyle = '#68738f';
        for (i = bx + 2; i < bx + w - 2; i += 4) g.fillRect(i, top + 1, 2, 1);
        drawWindArrows(g, tr, bx, w, floor - 3, '#68738f');
        break;
      }
      case 'vac': // 로봇청소기 (기존 스프라이트)
        SP.draw(g, 'robovac', Math.floor(s.t * 8), Math.round(tr.px - T / 2 - camX), floor - T, { flip: tr.vx < 0 });
        break;
      case 'decoy': { // 미끼 장치: 진짜 꺼진 장치처럼 그린다 (작동한 뒤에는 어둡게)
        var dev = { kind: tr.device, on: false, w: tr.w, h: tr.h };
        if (tr.sprung) g.globalAlpha *= 0.45;
        drawDevice(g, dev, bx, tr.y * T - camY, s.t);
        if (tr.sprung) g.globalAlpha /= 0.45;
        break;
      }
      default: break;
    }
  }

  /**
   * 점프대 그리기 (코드 그림). glow = true면 어둠 위에 희미하게 한 번 더 + 표시등·효과
   *   TESLA 빨간 줄무늬 스프링 / NVIDIA 초록 LED 냉각팬 상승 기류 / SAMSUNG 파란 스프링 / SpaceX 작은 로켓 분사 패드
   *   밟는 순간(pad.press): 앞 절반은 눌린 모양, 뒤 절반은 튀어 오른 모양 (2프레임)
   */
  function drawPad(g, s, stage, pad, camX, camY, glow) {
    var bx = pad.x * T - camX;
    if (bx < -2 * T || bx > W + T) return;
    var floor = (pad.y + 1) * T - camY;
    var P = cfg.PADS || { press: 0.18 };
    var pressed = pad.press > P.press / 2; // 눌림 (앞 절반)
    var popped = pad.press > 0 && !pressed; // 튀어 오름 (뒤 절반)
    var springH = pressed ? 2 : popped ? 7 : 4; // 스프링 높이
    var key = stage.key;
    var i;
    if (glow) g.globalAlpha = 0.45;
    // 바닥 받침
    g.fillStyle = '#1d2030';
    g.fillRect(bx + 1, floor - 2, T - 2, 2);
    if (key === 'nvidia') {
      // 냉각팬: 어두운 상자 + 돌아가는 날개 + 초록 LED
      g.fillStyle = '#2a2f26';
      g.fillRect(bx + 2, floor - 5, T - 4, 4);
      g.fillStyle = '#76b900';
      var spin = Math.floor(s.t * 12) % 2;
      g.fillRect(bx + 4 + spin * 4, floor - 4, 4, 1);
      g.fillRect(bx + 8 - spin * 4, floor - 3, 4, 1);
    } else if (key === 'spacex') {
      // 로켓 분사 패드: 회색 노즐 두 개
      g.fillStyle = '#68738f';
      g.fillRect(bx + 2, floor - 4, T - 4, 2);
      g.fillStyle = '#4a5470';
      g.fillRect(bx + 3, floor - 6, 3, 2);
      g.fillRect(bx + T - 6, floor - 6, 3, 2);
    } else {
      // 스프링 패드: TESLA 빨강·흰 줄무늬, SAMSUNG 파랑
      var c1 = key === 'samsung' ? '#2e58d6' : '#e04848';
      var c2 = key === 'samsung' ? '#9ab8ff' : '#f3f6fa';
      for (i = 0; i < springH; i++) {
        g.fillStyle = i % 2 ? c2 : c1;
        g.fillRect(bx + 4, floor - 2 - i - 1, T - 8, 1);
      }
      g.fillStyle = c1; // 윗판
      g.fillRect(bx + 2, floor - 2 - springH - 2, T - 4, 2);
    }
    if (glow) {
      g.globalAlpha = 1;
      var blink = Math.floor(s.t * 3) % 2 === 0;
      var led = key === 'nvidia' ? '#a6ff3f' : key === 'samsung' ? '#72a0ff' : key === 'spacex' ? '#ffa034' : '#ff6a6a';
      g.fillStyle = blink ? led : 'rgba(255,255,255,0.25)';
      g.fillRect(bx + T / 2 - 1, floor - 1, 2, 1); // 표시등
      // 위로 향하는 작은 화살표 (점프대라는 표시, 희미하게)
      g.fillStyle = 'rgba(255,255,255,' + (blink ? 0.45 : 0.2) + ')';
      g.fillRect(bx + T / 2 - 1, floor - 13, 2, 3);
      g.fillRect(bx + T / 2 - 2, floor - 12, 4, 1);
      // NVIDIA: 위로 올라가는 바람 줄 (늘 약하게, 밟으면 진하게)
      if (key === 'nvidia') {
        g.fillStyle = 'rgba(166,255,63,' + (pad.press > 0 ? 0.7 : 0.25) + ')';
        for (i = 0; i < 3; i++) {
          var yy = floor - 6 - ((s.t * 50 + i * 9) % 26);
          g.fillRect(bx + 4 + i * 3, Math.round(yy), 1, 4);
        }
      }
      // 밟는 순간 효과: SpaceX 불꽃 한 번, 나머지는 반짝 테두리
      if (pad.press > 0) {
        if (key === 'spacex') {
          g.fillStyle = '#ffd23f';
          g.fillRect(bx + 3, floor - 10, 3, 4);
          g.fillRect(bx + T - 6, floor - 10, 3, 4);
          g.fillStyle = '#ff8a2a';
          g.fillRect(bx + 2, floor - 7, 5, 2);
          g.fillRect(bx + T - 7, floor - 7, 5, 2);
        } else {
          g.fillStyle = 'rgba(255,255,255,0.6)';
          g.fillRect(bx + 1, floor - 2 - springH - 4, T - 2, 1);
        }
      }
    }
  }

  // 컨베이어 화살표: 미는 방향으로 흘러가는 노란 꺾쇠
  function drawConveyorArrows(g, s, tr, bx, w, floor) {
    var shift = ((s.trapClock || 0) * cfg.TRAPS.conveyor.push) % 8;
    g.fillStyle = '#ffd23f';
    for (var x = 0; x < w; x += 8) {
      var ax = tr.dir > 0 ? bx + ((x + shift) % w) : bx + w - 1 - ((x + shift) % w);
      g.fillRect(Math.round(ax), floor + 2, 1, 1);
      g.fillRect(Math.round(ax - tr.dir), floor + 1, 1, 1);
      g.fillRect(Math.round(ax - tr.dir), floor + 3, 1, 1);
    }
  }

  // 바람 방향 화살표 (바닥 바로 위)
  function drawWindArrows(g, tr, bx, w, y, color) {
    g.fillStyle = color;
    for (var x = bx + 4; x < bx + w - 3; x += 8) {
      g.fillRect(x, y, 4, 1);
      g.fillRect(tr.dir > 0 ? x + 3 : x, y - 1, 1, 3);
    }
  }

  // 켜진 감전 함정은 주변을 밝힌다 (어둠 계산에 빛으로 넣는다)
  function trapLights(s, camX, camY, lights) {
    (s.traps || []).forEach(function (tr) {
      var st = trapState(s, tr);
      var cxw = (tr.x0 + tr.x1 + 1) * T / 2 - camX;
      var floor = (tr.y + 1) * T - camY;
      if ((tr.kind === 'flame' || tr.kind === 'steam') && st === 'on') lights.push({ x: cxw, y: floor - 20, r: tr.kind === 'flame' ? 34 : 22 });
      else if (tr.kind === 'shock' && st === 'on') lights.push({ x: cxw, y: floor - 4, r: 16 + (tr.x1 - tr.x0) * 6 });
      else if (tr.kind === 'vac') lights.push({ x: tr.px - camX, y: floor - 6, r: 12 });
    });
  }

  /** 어둠 위: 몸체를 희미하게 한 번 더 + 경고 깜빡임 + 발동 효과 (불꽃·증기·전기·바람·버그) */
  function drawTrapFx(g, s, tr, camX, camY) {
    var st = trapState(s, tr);
    var bx = tr.x0 * T - camX;
    var w = (tr.x1 - tr.x0 + 1) * T;
    var floor = (tr.y + 1) * T - camY;
    var cx = bx + T / 2;
    var blink = Math.floor(s.t * 10) % 2 === 0; // 경고 깜빡임 (1초에 5번)
    var i, k;
    g.globalAlpha = TRAP_GLOW;
    drawTrapBody(g, s, tr, camX, camY);
    g.globalAlpha = 1;
    switch (tr.kind) {
      case 'shock':
        if (st === 'warn' && blink) {
          g.fillStyle = 'rgba(255,230,80,0.9)';
          g.fillRect(bx + 1, floor - 2, w - 2, 2);
        } else if (st === 'on') {
          g.fillStyle = 'rgba(120,220,255,0.35)';
          g.fillRect(bx + 1, floor - 6, w - 2, 6);
          // 지지직 전기 줄 (프레임마다 모양이 바뀐다)
          g.fillStyle = Math.floor(s.t * 20) % 2 ? '#e8fbff' : '#7cdcff';
          for (i = bx + 2; i < bx + w - 2; i += 2) {
            var hgt = 1 + ((i * 7 + Math.floor(s.t * 24)) % 5);
            g.fillRect(i, floor - 2 - hgt, 1, hgt);
          }
        }
        break;
      case 'arm': {
        var railY = floor - 3 * T - 4;
        g.fillStyle = st === 'warn' ? (blink ? '#ffb020' : '#5a3a10') : st === 'on' ? '#ff4a4a' : '#5a3a10';
        g.fillRect(cx - 1, railY - 2, 2, 2); // 레일 위 경고등
        if (st === 'on' && armReach(s, tr) >= 1) {
          g.fillStyle = '#fff4a2'; // 바닥에 부딪힌 불티
          g.fillRect(cx - 8, floor - 2, 2, 1);
          g.fillRect(cx + 6, floor - 2, 2, 1);
        }
        break;
      }
      case 'steam':
        if (st === 'warn') drawSteamWarn(g, s, cx, floor, blink);
        else if (st === 'on') drawSteamColumn(g, s, cx, floor, (tr.def || cfg.TRAPS.steam).rows || 3);
        break;
      case 'flame':
        if (st === 'warn') {
          g.fillStyle = blink ? 'rgba(255,150,40,0.95)' : 'rgba(255,90,30,0.5)';
          g.fillRect(cx - 2, floor - 8, 4, 2);
        } else if (st === 'on') {
          var hf = cfg.TRAPS.flame.rows * T;
          var fl = Math.floor(s.t * 20) % 2;
          g.fillStyle = 'rgba(255,120,30,0.85)';
          g.fillRect(cx - 5, floor - 6 - hf + 6 + fl * 2, 10, hf - 6);
          g.fillStyle = 'rgba(255,210,60,0.95)';
          g.fillRect(cx - 3, floor - 6 - hf + 12 + fl, 6, hf - 12);
          g.fillStyle = '#fff6d0';
          g.fillRect(cx - 1, floor - 6 - hf + 20, 2, hf - 20);
        }
        break;
      case 'wind':
        if (st === 'warn' && blink) drawWindArrows(g, tr, bx, w, floor - 3, '#bfe8ff');
        else if (st === 'on') {
          var hw = cfg.TRAPS.wind.rows * T;
          g.fillStyle = 'rgba(230,245,255,0.55)';
          for (k = 0; k < 10; k++) {
            var lx = ((s.t * 110 * tr.dir + k * 23) % w + w) % w;
            var ly = floor - 4 - ((k * 17) % (hw - 8));
            g.fillRect(Math.round(bx + lx), Math.round(ly), 6, 1);
          }
          drawWindArrows(g, tr, bx, w, floor - 3, '#bfe8ff');
        }
        break;
      case 'vac': // 위의 표시등이 깜빡여 어둠 속에서도 보인다
        g.fillStyle = blink ? '#3fd4f4' : '#ff4040';
        g.fillRect(Math.round(tr.px - camX) - 1, floor - 12, 2, 2);
        break;
      case 'decoy': {
        if (!tr.sprung) {
          // 가까이 가면 대기등이 빨강이 아니라 보라색으로 깜빡인다 (눈치챌 수 있게)
          var p = s.player;
          var near = Math.abs(p.x + p.w / 2 - (bx + camX + w / 2)) <= cfg.TRAPS.decoy.near * T;
          var dev = { kind: tr.device, on: false, w: tr.w, h: tr.h };
          drawStandbyLeds(g, dev, bx, tr.y * T - camY, Math.floor(s.t * 2.5) % 2 === 0 || near && blink,
            false, near ? { core: '#c050ff', glow: 'rgba(200,80,255,0.45)', dim: '#4a1866' } : null);
        }
        if (tr.bug) S.drawBug(g, Math.round(tr.bug.x - S.BUG_W / 2 - camX), Math.round(tr.bug.y - camY), s.t, tr.bug.target && tr.bug.target.x * T < tr.bug.x ? -1 : 1);
        break;
      }
      default: break;
    }
  }

  /**
   * 과열 증기 기둥 (켜짐): 2픽셀 줄마다 폭이 출렁이는 띠를 빈틈없이 쌓아 촘촘하게 그린다.
   *   바깥 김(옅은 하늘색) + 안쪽 줄기(거의 흰색), 위로 갈수록 넓어지고 옅어진다. 무늬는 위로 흘러간다.
   *   맨 아래 폭(약 10픽셀)이 닿음 상자(10픽셀)보다 좁아지지 않게 해, 보이는 곳과 맞는 곳이 같다.
   *   꼭대기에서는 작은 김 조각이 흩어지고, 분출구는 하늘색으로 빛난다.
   */
  function drawSteamColumn(g, s, cx, floor, rows) {
    var hs = rows * T;
    var base = floor - 3; // 분출구 윗면
    var flow = s.t * 70; // 위로 흐르는 속도(픽셀/초)
    for (var yy = 0; yy < hs; yy += 2) {
      var k = yy / hs; // 0 = 아래, 1 = 위
      var n = Math.sin((yy - flow) * 0.31) + 0.6 * Math.sin((yy - flow) * 0.11 + 1.7); // 출렁임 (-1.6 - 1.6)
      var half = 5 + k * 3 + n * (0.6 + k); // 반폭: 아래 5픽셀 → 위 8픽셀 안팎
      half = Math.max(5, half);
      var sway = Math.sin((yy - flow) * 0.07) * (0.5 + k * 1.8); // 위로 갈수록 좌우로 휜다
      var y = Math.round(base - yy - 2);
      g.fillStyle = 'rgba(190,230,255,' + (0.5 - 0.3 * k).toFixed(3) + ')';
      g.fillRect(Math.round(cx - half + sway), y, Math.round(half * 2), 2);
      var inner = Math.max(1.5, half * 0.45);
      g.fillStyle = 'rgba(245,252,255,' + (0.8 - 0.55 * k).toFixed(3) + ')';
      g.fillRect(Math.round(cx - inner + sway * 0.7), y, Math.round(inner * 2), 2);
      // 띠 가장자리에 작은 김 알갱이 (2줄에 하나씩 번갈아)
      if ((yy / 2 + Math.floor(flow / 6)) % 3 === 0) {
        g.fillStyle = 'rgba(220,240,255,' + (0.45 - 0.3 * k).toFixed(3) + ')';
        g.fillRect(Math.round(cx + (n > 0 ? half : -half - 1) + sway), y, 1, 1);
      }
    }
    // 꼭대기: 흩어지는 작은 김 조각 6개 (위로 떠오르며 사라짐)
    for (var i = 0; i < 6; i++) {
      var life = (s.t * 1.4 + i / 6) % 1;
      var px = cx + Math.sin(i * 2.3 + s.t * 2.5) * (5 + life * 7);
      var py = base - hs - life * 10;
      g.fillStyle = 'rgba(225,242,255,' + (0.5 * (1 - life)).toFixed(3) + ')';
      g.fillRect(Math.round(px) - 1, Math.round(py), 2 + (i % 2), 2);
    }
    g.fillStyle = 'rgba(150,225,255,0.9)'; // 분출구 빛
    g.fillRect(Math.round(cx - 5), base - 1, 10, 1);
  }

  /** 과열 증기 경고: 분출구에서 작은 김 두세 가닥이 피어오르며 깜빡인다 */
  function drawSteamWarn(g, s, cx, floor, blink) {
    var base = floor - 3;
    for (var i = 0; i < 3; i++) {
      var life = (s.t * 2.2 + i / 3) % 1;
      g.fillStyle = 'rgba(210,240,255,' + ((blink ? 0.8 : 0.45) * (1 - life)).toFixed(3) + ')';
      g.fillRect(Math.round(cx - 3 + i * 2 + Math.sin(s.t * 6 + i) * 1.5), Math.round(base - 2 - life * 9), 2, 2);
    }
    g.fillStyle = blink ? 'rgba(150,225,255,0.9)' : 'rgba(150,225,255,0.4)';
    g.fillRect(Math.round(cx - 5), base - 1, 10, 1);
  }

  /** 파워업 상자: 회사 색 상자가 위아래로 살짝 떠다니며 반짝인다 */
  function drawItem(g, it, stage, t, camX, camY) {
    var x = Math.round(it.x * T + 2 - camX);
    var y = Math.round(it.y * T + 3 - camY + Math.sin(t * 5) * 1.5);
    g.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.2 * Math.sin(t * 8)).toFixed(2) + ')';
    g.fillRect(x - 2, y - 2, 16, 16); // 번지는 빛
    g.fillStyle = '#0e1018';
    g.fillRect(x, y, 12, 12);
    g.fillStyle = stage.color;
    g.fillRect(x + 1, y + 1, 10, 10);
    g.fillStyle = '#ffffff';
    g.fillRect(x + 1, y + 1, 10, 1); // 윗면 빛
    g.fillRect(x + 5, y + 1, 2, 10); // 리본
    g.fillRect(x + 1, y + 5, 10, 2);
    if (Math.floor(t * 4) % 2 === 0) { // 반짝이
      g.fillRect(x + 12, y - 3, 1, 3);
      g.fillRect(x + 11, y - 2, 3, 1);
    }
  }

  // 버그 그리기: 타일셋에 버그 그림(176·177, 오른쪽을 봄)이 있으면 그것을, 없으면 코드 그림을 쓴다
  function drawBugAt(g, b, camX, camY) {
    var frame = Math.floor(b.animTime * 8) % 2;
    var id = TL['bug_' + (frame + 1)];
    if (PF.tileset.has(id)) {
      // 16x16 그림의 아래 가운데를 충돌 상자 아래 가운데에 맞춘다
      PF.tileset.drawTileFlip(g, id, Math.round(b.x + b.w / 2 - T / 2 - camX), Math.round(b.y + b.h - T - camY), b.dir < 0);
    } else {
      S.drawBug(g, Math.round(b.x + b.w / 2 - S.BUG_W / 2 - camX), Math.round(b.y + b.h - S.BUG_H - camY), b.animTime, b.dir);
    }
  }

  // ── 완료 연출용 큰 그림 (시트 → 타일셋 → 코드 그림 순서로 있는 것을 쓴다) ──
  function drawCybertruck(g, x, bottom) {
    if (SP.has('cybertruck')) SP.draw(g, 'cybertruck', 0, x, bottom - 16);
    else if (PF.tileset.has(TL.tesla_truck_l)) {
      PF.tileset.drawTile(g, TL.tesla_truck_l, Math.round(x), bottom - T);
      PF.tileset.drawTile(g, TL.tesla_truck_r, Math.round(x) + T, bottom - T);
    } else S.drawTruck(g, x, bottom - 15);
  }

  function drawStarship(g, cx, bottom, t) {
    if (SP.has('starship')) {
      SP.draw(g, 'starship', 0, cx - 8, bottom - SP.size('starship').h);
    } else if (PF.tileset.has(TL.spacex_rocket_top)) {
      var rx = Math.round(cx - T / 2);
      var rb = Math.round(bottom);
      PF.tileset.drawTile(g, TL.spacex_rocket_top, rx, rb - 3 * T);
      PF.tileset.drawTile(g, TL.spacex_rocket_mid, rx, rb - 2 * T);
      PF.tileset.drawTile(g, TL.spacex_rocket_bottom, rx, rb - T);
    } else {
      SP.draw(g, 'starship', 0, cx - 8, bottom - 48);
    }
  }

  // 로켓 불꽃 (시트 flame → 타일셋 172·173 번갈아 → 코드 그림)
  // scale: 1보다 작으면 작은 불꽃 (제트팩)
  function drawFlame(g, cx, top, t, scale) {
    var id = Math.floor(t * 16) % 2 ? TL.spacex_flame_2 : TL.spacex_flame_1;
    if (scale && scale < 1) {
      // 제트팩 불꽃: 작은 코드 그림 (발밑에서 아래로)
      var f = Math.floor(t * 20) % 2;
      g.fillStyle = '#ff8a2a'; g.fillRect(Math.round(cx - 2), Math.round(top), 4, 4 + f * 2);
      g.fillStyle = '#ffd23f'; g.fillRect(Math.round(cx - 1), Math.round(top), 2, 3 + f);
      return;
    }
    if (SP.has('flame')) SP.draw(g, 'flame', Math.floor(t * 16), cx - 8, top);
    else if (PF.tileset.has(id)) PF.tileset.drawTile(g, id, Math.round(cx - T / 2), Math.round(top));
    else {
      var f = Math.floor(t * 16) % 2;
      g.fillStyle = '#ff8a2a'; g.fillRect(Math.round(cx - 4), Math.round(top), 8, 6 + f * 3);
      g.fillStyle = '#ffd23f'; g.fillRect(Math.round(cx - 3), Math.round(top), 6, 4 + f * 2);
    }
  }

  // 원(디스크)을 가로줄로 채워 그린다 (픽셀이 또렷하게)
  function disc(g, cx, cy, r, colorAt) {
    for (var y = -r; y <= r; y++) {
      var half = Math.floor(Math.sqrt(r * r - y * y));
      g.fillStyle = colorAt(y + r);
      g.fillRect(Math.round(cx - half), Math.round(cy + y), half * 2 + 1, 1);
    }
  }

  /** 회사별 무대 완료 연출. pt = 연출이 시작된 뒤 흐른 시간(초) */
  function drawClearFx(g, s, stage, camX, camY) {
    var pt = s.phaseTime;
    var floorY = (s.map.height - 2) * T - camY; // 바닥 윗면의 화면 y
    var cheer = stage.host ? stage.host + '_cheer' : null;
    var cheerFrame = Math.floor(s.t * 4);
    // 시작할 때 화면이 하얗게 번쩍인다
    if (pt < 0.4) {
      g.fillStyle = 'rgba(255,255,255,' + (0.6 * (1 - pt / 0.4)).toFixed(2) + ')';
      g.fillRect(0, 0, W, H);
    }
    switch (stage.key) {
      case 'tesla': { // 사이버트럭(왼쪽)과 신형 로드스터(오른쪽)가 무대 가운데로, 일론이 환호
        drawCybertruck(g, lerp(-40, W / 2 - 44, ease(pt / 1.0)), floorY);
        if (pt > 1.0) SP.draw(g, 'roadster', 0, lerp(W + 10, W / 2 + 12, ease((pt - 1.0) / 0.9)), floorY - 16, { flip: true });
        if (cheer) SP.draw(g, cheer, cheerFrame, W / 2 - 8, floorY - 24);
        break;
      }
      case 'nvidia': { // 랙 LED 초록 물결 + 젠슨이 가운데로 걸어 나와 손을 들고, 오리 로봇이 춤춘다
        var wave = clamp01(pt / 1.6) * (W + 80) - 40;
        for (var x = 0; x < W; x += 4) {
          var dist = wave - x;
          if (dist < 0 || dist > 70) continue;
          g.fillStyle = 'rgba(118,185,0,' + ((1 - dist / 70) * 0.9).toFixed(2) + ')';
          for (var y = 30; y < floorY; y += 6) g.fillRect(x, y, 2, 2);
        }
        var walk = ease(pt / 1.0);
        var jx = lerp(-16, W / 2 - 20, walk);
        if (pt < 1.0) SP.draw(g, 'jensen_idle', Math.floor(s.t * 6), jx, floorY - 24);
        else SP.draw(g, 'jensen_cheer', cheerFrame, jx, floorY - 24);
        // 오리 로봇 춤: 프레임 높이만큼 올려 그려 발이 바닥(floorY)에 닿게
        var danceFrame = Math.floor(s.t * 8);
        SP.draw(g, 'duckbot_dance', danceFrame, W / 2 + 4, floorY - SP.size('duckbot_dance', danceFrame).h);
        break;
      }
      case 'samsung': { // Galaxy Z Fold가 크게 펼쳐지며 반짝, 이재용 회장이 환호
        var scale = 1 + 2 * ease(pt / 0.6);
        var fw = 32 * scale;
        var fh = 16 * scale;
        var hue = s.t * 300;
        // 무지개 반짝이가 폴드 둘레에 흩어진다
        for (var i = 0; i < 14; i++) {
          var ang = i / 14 * Math.PI * 2 + s.t * 2;
          var rr = 30 + scale * 14;
          disc(g, W / 2 + Math.cos(ang) * rr, 96 + Math.sin(ang) * rr * 0.55, 1 + (i % 2), function () {
            return 'hsl(' + Math.round((hue + i * 25) % 360) + ',90%,72%)';
          });
        }
        SP.draw(g, 'fold_on', 0, Math.round(W / 2 - fw / 2), Math.round(96 - fh / 2), { scale: Math.round(scale * 4) / 4 });
        if (cheer) SP.draw(g, cheer, cheerFrame, W / 2 - 76, floorY - 24);
        break;
      }
      case 'spacex': { // 발사 → 상승(우주로) → 단 분리 → 우주(지구·스타링크·화성) → 귀환·젓가락 캐치 (docs/sfx-space-brief.md)
        var seg = PF.game.showAt(stage, pt, s.clearTime()) || { key: 'launch', local: pt, k: 0 };
        if (seg.key === 'ascent' || seg.key === 'separate' || seg.key === 'space') {
          drawSpaceShow(g, s, seg); // 화면 전체를 하늘·우주 장면으로 덮는다 (카메라가 로켓을 따라 올라간 것처럼)
          break;
        }
        // 메카질라 그림: 왼쪽이 철골 탑, 오른쪽으로 젓가락 팔. 아래쪽에 발사대(받침).
        // TILESET_TECH.md: mechazilla_closed의 (25, 27)에 booster를 겹치면 팔이 붙잡는 자리다.
        var towerX = Math.round(W / 2 - 40); // 메카질라 그림 왼쪽
        var towerH = SP.size('mechazilla_open').h;
        var towerTop = floorY - towerH;
        var catchT = stage.catchAt || 7.2; // 붙잡는 순간(초)
        var caught = pt >= catchT;
        var boosterH = SP.size('booster').h;
        var rocketX = towerX + 25; // 부스터 그림 왼쪽 (팔이 붙잡는 열)
        var cx = rocketX + 8; // 로켓 가운데 x
        var catchBottom = towerTop + 27 + boosterH; // 붙잡혔을 때 부스터 아래 끝
        var padBottom = towerTop + Math.round(towerH * 0.8); // 발사대 받침 윗면 (그림 아래쪽 1/5 지점)
        SP.draw(g, caught ? 'mechazilla_closed' : 'mechazilla_open', 0, towerX, towerTop);
        if (seg.key === 'launch') {
          // 1) 발사: 부스터 + 스타십이 함께 올라간다 (발사 연기와 불꽃)
          var up = Math.pow(seg.k, 2) * 240;
          var bb = padBottom - up;
          g.globalAlpha = clamp01(1 - seg.k * 0.8);
          for (var c = -3; c <= 3; c++) {
            var cid = c === -3 ? TL.spacex_cloud_l : c === 3 ? TL.spacex_cloud_r : TL.spacex_cloud_m;
            if (PF.tileset.has(cid)) PF.tileset.drawTile(g, cid, Math.round(cx - T / 2 + c * T * (1 + seg.k * 0.5)), floorY - T);
          }
          g.globalAlpha = 1;
          SP.draw(g, 'booster', 0, rocketX, bb - boosterH);
          drawStarship(g, cx, bb - boosterH, s.t);
          drawFlame(g, cx, bb, s.t);
        } else if (!caught) {
          // 5) 귀환: 부스터가 불꽃을 뿜으며 탑으로 내려온다
          var b2 = lerp(-20, catchBottom, ease((pt - seg.start) / Math.max(0.1, catchT - seg.start)));
          SP.draw(g, 'booster', 0, rocketX, b2 - boosterH);
          drawFlame(g, cx, b2, s.t);
        } else {
          // 젓가락 팔에 붙잡힌 부스터 + 일론 환호 + 붙잡는 순간 불티
          SP.draw(g, 'booster', 0, rocketX, catchBottom - boosterH);
          if (pt - catchT < 0.25) {
            g.fillStyle = '#fff4a2';
            for (var sp = 0; sp < 6; sp++) g.fillRect(cx - 14 + sp * 5, catchBottom - boosterH + 2 + (sp % 2) * 3, 2, 1);
          }
          if (cheer) SP.draw(g, cheer, cheerFrame, towerX + 70, floorY - 24);
        }
        break;
      }
      default:
        break;
    }
  }

  // ── 타이틀·닉네임·결과 화면 뒤 장면 ─────────────────────
  /**
   * 무대 배경 + 바닥 + 차례로 켜지는 장치 + 달리는 신입 사원.
   * "어둠 속 장치에 전원을 켠다"는 규칙을 한눈에 보여 준다.
   */
  function drawScene(g, stage, t, showRunner) {
    var camX = Math.floor(t * 30); // 배경이 천천히 흘러간다
    PF.background.draw(g, stage, camX, t);
    var set = PF.tiles.SETS[stage.key];
    var top = TL[set.top[1]];
    var body = TL.floor_m;
    var groundY = H - 2 * T + 4;
    var off = camX % T;
    for (var x = -off; x < W; x += T) {
      PF.tileset.drawTile(g, top, x, groundY);
      PF.tileset.drawTile(g, body, x, groundY + T);
    }
    // 장치 6개(이 무대의 여러 종류)가 1초 남짓마다 하나씩 켜지고, 다 켜지면 처음부터
    var count = 6;
    var lit = Math.floor((t * 1.2) % (count + 2));
    var lights = [];
    // 큰 그림 장치를 먼저 보여 준다 (콘텐츠 보강 장치가 눈에 띄게)
    var kinds = set.devices.slice().sort(function (a, b) {
      return (PF.tiles.DEVICES[b].sprite ? 1 : 0) - (PF.tiles.DEVICES[a].sprite ? 1 : 0);
    });
    for (var i = 0; i < count; i++) {
      var kind = kinds[i % kinds.length];
      var def = PF.tiles.DEVICES[kind];
      var dev = { kind: kind, on: i < lit, h: def.h, w: def.w };
      var bx = 10 + i * 52;
      var by = groundY - T;
      drawDevice(g, dev, bx, by, t);
      var r = deviceRect(dev, bx, by);
      if (dev.on) lights.push({ x: r.x + r.w / 2, y: r.y + r.h / 2, r: cfg.LIGHT.deviceRadius });
      else drawStandbyLeds(g, dev, bx, by, Math.floor(t * 2.5) % 2 === 0);
    }
    var runX = 30 + ((t * 40) % (W - 40));
    if (showRunner) {
      S.drawPlayer(g, 'run', Math.floor(t * 10) % 4, Math.round(runX), groundY - S.H, false);
      lights.push({ x: runX + 8, y: groundY - 12, r: cfg.LIGHT.playerRadius });
    }
    var b = PF.game.brightness(Math.min(lit, count), count);
    drawDarkness(g, Math.min(1, b + 0.25), lights); // 글자가 읽히게 조금 더 밝게
  }

  // ── SpaceX 우주 비행 장면 (코드 그림 + 기존 스프라이트: booster, starship, sat_train, elon_cheer) ──
  // 두 색 사이 섞기 ('#rrggbb', 0-1) → 'rgb(r,g,b)'
  function mixColor(a, b, k) {
    var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
    var pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
    return 'rgb(' + pa.map(function (v, i) { return Math.round(v + (pb[i] - v) * k); }).join(',') + ')';
  }

  // 별: n개, 아래로 흘러가는 속도 speed(올라가는 느낌). 위치는 늘 같은 "가짜 난수"
  function drawStars(g, n, t, speed, alpha) {
    for (var i = 0; i < n; i++) {
      var x = Math.floor(hash01(i * 3 + 1) * W);
      var y = Math.floor((hash01(i * 7 + 2) * H + t * speed * (0.5 + hash01(i))) % H);
      var tw = 0.5 + 0.5 * Math.sin(t * 3 + i); // 반짝임
      g.fillStyle = 'rgba(255,255,255,' + (alpha * (0.4 + 0.6 * tw)).toFixed(3) + ')';
      g.fillRect(x, y, i % 9 === 0 ? 2 : 1, i % 9 === 0 ? 2 : 1);
    }
  }

  // 지구 곡선: 화면 아래쪽 큰 원의 윗부분 + 대륙·구름 조각 + 대기 띠
  function drawEarth(g, t) {
    var ex = W / 2 + 30, ey = H + 250, r = 300; // 원 가운데·반지름 → 꼭대기가 y 130
    g.save();
    g.beginPath();
    g.arc(ex, ey, r, 0, Math.PI * 2);
    g.clip();
    var sea = g.createLinearGradient(0, ey - r, 0, H);
    sea.addColorStop(0, '#3f8be0');
    sea.addColorStop(1, '#123a7a');
    g.fillStyle = sea;
    g.fillRect(0, ey - r, W, H);
    // 대륙(초록)과 구름(흰 띠): 천천히 오른쪽으로 돈다
    var drift = (t * 6) % W;
    g.fillStyle = '#3c8f4a';
    [[20, 140, 46, 10], [120, 150, 70, 14], [230, 138, 40, 9], [300, 160, 60, 12]].forEach(function (c) {
      var x = ((c[0] + drift) % (W + 80)) - 40;
      g.fillRect(Math.round(x), c[1], c[2], c[3]);
      g.fillRect(Math.round(x) + 6, c[1] - 3, c[2] - 14, 3);
    });
    g.fillStyle = 'rgba(255,255,255,0.7)';
    [[60, 136, 50], [180, 146, 70], [270, 155, 40]].forEach(function (c) {
      var x = ((c[0] + drift * 1.4) % (W + 80)) - 40;
      g.fillRect(Math.round(x), c[1], c[2], 2);
    });
    g.restore();
    // 대기 띠 (하늘색 얇은 줄 + 은은한 빛)
    g.strokeStyle = 'rgba(120,200,255,0.25)';
    g.lineWidth = 6;
    g.beginPath(); g.arc(ex, ey, r + 3, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
    g.strokeStyle = 'rgba(160,225,255,0.9)';
    g.lineWidth = 1.5;
    g.beginPath(); g.arc(ex, ey, r + 0.5, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
  }

  // 화성: 멀리 붉은 점 (그늘 + 은은한 빛)
  function drawMars(g, x, y, t) {
    var glow = 'rgba(255,110,60,' + (0.16 + 0.06 * Math.sin(t * 2)).toFixed(3) + ')';
    disc(g, x, y, 7, function () { return glow; }); // 둥글게 번지는 빛
    disc(g, x, y, 4, function (row) { return row >= 6 ? '#8a2e18' : '#d9542c'; }); // 아래쪽 줄은 그늘
    g.fillStyle = '#ffb08a';
    g.fillRect(x - 2, y - 2, 1, 1);
  }

  // 구름 조각 (흰 직사각형 세 개를 겹친 뭉게구름)
  function drawCloud(g, x, y, w, alpha) {
    g.fillStyle = 'rgba(235,240,255,' + alpha.toFixed(3) + ')';
    g.fillRect(Math.round(x), Math.round(y), w, 5);
    g.fillRect(Math.round(x + w * 0.2), Math.round(y - 3), Math.round(w * 0.5), 3);
    g.fillRect(Math.round(x + w * 0.1), Math.round(y + 5), Math.round(w * 0.8), 2);
  }

  /**
   * 우주 비행 장면 (상승 → 단 분리 → 우주). seg = game.showAt() 결과 { key, local, k }
   *   상승: 하늘이 남색 → 검정, 별이 늘고, 구름 조각이 아래로 빠르게 지나간다 (로켓은 화면 가운데에서 위로 가는 느낌)
   *   단 분리: 부스터가 떨어져 나가고 스타십만 불꽃을 뿜으며 올라간다
   *   우주: 아래에 푸른 지구 곡선, 위로 스타링크 위성 줄, 멀리 화성, 스타십이 오른쪽 위로 날아간다 (일론 "Occupy Mars!")
   */
  function drawSpaceShow(g, s, seg) {
    var t = s.t;
    var k = seg.key === 'ascent' ? seg.k : 1; // 하늘이 얼마나 검어졌는지
    var sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, mixColor('#141c46', '#020308', k));
    sky.addColorStop(1, mixColor('#3a5aa0', '#05060e', k));
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);
    var cx = W / 2;
    var bottom = 128; // 로켓 아래 끝 y (상승 중)
    var bh = SP.size('booster').h;
    if (seg.key === 'ascent') {
      drawStars(g, Math.floor(8 + 80 * k), t, 60, k);
      // 처음 0.4초: 발사장 바닥이 아래로 멀어진다
      if (seg.local < 0.5) {
        g.fillStyle = '#2a2f45';
        g.fillRect(0, Math.round(150 + seg.local * 260), W, H);
      }
      // 구름을 뚫고 지나감: 구름 조각이 아래로 빠르게 (하늘이 아직 밝을 때)
      if (k < 0.75) {
        for (var i = 0; i < 9; i++) {
          var y = ((i * 41 + seg.local * 320) % (H + 40)) - 20;
          var x = hash01(i + 5) * (W - 60);
          drawCloud(g, x, y, 30 + Math.floor(hash01(i + 9) * 40), 0.85 * (1 - k / 0.75));
        }
      }
      var wob = Math.round(Math.sin(t * 40) * (1 - k)); // 대기 속에서는 살짝 떨린다
      SP.draw(g, 'booster', 0, cx - 8 + wob, bottom - bh);
      drawStarship(g, cx + wob, bottom - bh, t);
      drawFlame(g, cx + wob, bottom, t, 1.3);
    } else if (seg.key === 'separate') {
      drawStars(g, 90, t, 30, 1);
      var fall = seg.local * seg.local * 160; // 부스터는 아래로 떨어진다
      var rise = seg.local * 50; // 스타십은 계속 올라간다
      g.globalAlpha = clamp01(1 - seg.local * 0.9);
      SP.draw(g, 'booster', 0, Math.round(cx - 8 - seg.local * 18), Math.round(bottom - bh + fall));
      g.globalAlpha = 1;
      var shipBottom = bottom - bh - rise;
      drawStarship(g, cx, shipBottom, t);
      drawFlame(g, cx, shipBottom, t, 1.0);
      if (seg.local < 0.15) { // 분리 순간 번쩍
        g.fillStyle = 'rgba(255,244,190,' + (0.9 * (1 - seg.local / 0.15)).toFixed(3) + ')';
        g.fillRect(cx - 12, bottom - bh - 6, 24, 10);
      }
    } else {
      // 우주
      drawStars(g, 110, t, 6, 1);
      drawMars(g, 278, 44, t);
      drawEarth(g, t);
      // 스타링크 위성 줄이 왼쪽에서 오른쪽으로 지나간다
      SP.draw(g, 'sat_train', 0, Math.round(lerp(-70, W + 10, seg.k)), Math.round(58 - seg.k * 10));
      // 스타십: 오른쪽 위(화성 쪽)로 날아가며 작아진다
      var sx = lerp(130, 250, ease(seg.k));
      var sy = lerp(126, 62, ease(seg.k));
      g.save();
      g.translate(Math.round(sx), Math.round(sy));
      g.rotate(0.85); // 오른쪽 위를 향해 기울임
      var sc = 1 - 0.4 * seg.k;
      g.scale(sc, sc);
      drawStarship(g, 0, 0, t);
      drawFlame(g, 0, 0, t, 1);
      g.restore();
      // 일론 환호 (말풍선 "Occupy Mars!"는 main.js가 옆에 그린다)
      SP.draw(g, 'elon_cheer', Math.floor(t * 4), HOST_POS.x, HOST_POS.y);
    }
  }

  // ── 시작 컷신 "신입 사원의 첫 출근" (docs/story-brief.md) ──────────
  // 새 그림 파일 없이 플레이어·버그·진행자 스프라이트와 코드 그림(사각형)으로만 그린다.
  // 글자(컷 설명·SOS 풍선)는 main.js가 고해상도로 위에 쓴다.
  var INTRO_GROUND = 150; // 컷신 바닥 윗면 y
  // 회사 건물 실루엣 (x, 폭, 높이). 로고는 그리지 않는다.
  var INTRO_TOWERS = [[6, 40, 70], [52, 30, 98], [88, 50, 62], [146, 36, 112], [190, 58, 80], [254, 28, 94], [288, 30, 60]];

  // 0-1 사이 "가짜 난수" (같은 값을 넣으면 늘 같은 값 → 화면이 매 프레임 마구 바뀌지 않게)
  function hash01(n) { var v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }

  /**
   * 건물 실루엣과 창문
   * @param body   건물 색
   * @param win    창문 색 (null이면 창문 없음)
   * @param redLed true면 일부 창문 자리에 빨간 대기등만 깜빡 (정전)
   */
  function introTowers(g, body, win, redLed, t) {
    INTRO_TOWERS.forEach(function (b, bi) {
      var x = b[0], w = b[1], h = b[2];
      g.fillStyle = body;
      g.fillRect(x, INTRO_GROUND - h, w, h);
      for (var wy = INTRO_GROUND - h + 6; wy < INTRO_GROUND - 8; wy += 9) {
        for (var wx = x + 4; wx < x + w - 5; wx += 8) {
          var k = hash01(bi * 97 + wx * 3 + wy);
          if (redLed) {
            // 정전: 창문 몇 곳에만 빨간 대기등(1-2픽셀)이 느리게 깜빡인다
            if (k < 0.22 && Math.floor(t * 2 + k * 4) % 2 === 0) { g.fillStyle = '#ff4040'; g.fillRect(wx + 1, wy + 1, 2, 2); }
          } else if (win && k < 0.7) {
            g.fillStyle = win;
            g.fillRect(wx, wy, 4, 5);
          }
        }
      }
    });
  }

  // 바닥 (보도 + 도로)
  function introGround(g, top, line) {
    g.fillStyle = top;
    g.fillRect(0, INTRO_GROUND, W, H - INTRO_GROUND);
    g.fillStyle = line;
    g.fillRect(0, INTRO_GROUND, W, 1);
    for (var x = 8; x < W; x += 28) g.fillRect(x, INTRO_GROUND + 14, 12, 1); // 차선
  }

  // 사원증을 건 신입 사원 (2배 크기). (x, 발 y)
  function introPlayer(g, x, feet, anim, frame) {
    g.save();
    g.translate(Math.round(x), Math.round(feet - S.H * 2));
    g.scale(2, 2);
    S.drawPlayer(g, anim, frame, 0, 0, false);
    // 사원증: 빨간 목줄 + 흰 카드 + 파란 띠 (16x24 그림 기준 가슴 자리)
    g.fillStyle = '#e04848';
    g.fillRect(6, 10, 1, 3);
    g.fillRect(9, 10, 1, 3);
    g.fillStyle = '#ffffff';
    g.fillRect(6, 13, 4, 4);
    g.fillStyle = '#2e58d6';
    g.fillRect(6, 13, 4, 1);
    g.restore();
  }

  // 지직거림: 가로 띠 몇 줄을 옆으로 밀고 초록 줄을 긋는다 (amount 0-1, 과하지 않게)
  function introGlitch(g, t, amount) {
    var tick = Math.floor(t * 12);
    for (var i = 0; i < 4; i++) {
      if (hash01(tick * 7 + i) > amount) continue;
      var y = Math.floor(hash01(tick * 13 + i) * (H - 12));
      var h = 2 + Math.floor(hash01(tick * 17 + i) * 6);
      var dx = Math.round((hash01(tick * 19 + i) - 0.5) * 14);
      var RS = PF.hires ? PF.hires.R : 1; // 그림판은 RS배라 원본 좌표 × RS로 잘라 온다
      g.drawImage(g.canvas, 0, y * RS, W * RS, h * RS, dx, y, W, h);
      g.fillStyle = 'rgba(80,255,140,0.25)';
      g.fillRect(0, y, W, 1);
    }
  }

  /**
   * 컷신 한 장면 그리기
   * @param cut story.cutAt() 결과 { index, local, key, fade }
   * @param t   컷신 시작 뒤 흐른 시간(초)
   */

  // 세계 너비(w, 세계 단위)인 그림을 투영 위치에 바닥 맞춰 그린다. clipY 아래는 언덕에 가려 안 그림
  function drawProjected(g, img, sx, sy, sc, worldW, clipY, alpha) {
    var dw = sc * worldW * W / 2;
    if (dw < 1) return;
    var dh = dw * img.height / img.width;
    var x = snap(sx - dw / 2);
    var y = snap(sy - dh);
    if (y >= clipY) return;
    g.save();
    if (clipY < H) { g.beginPath(); g.rect(0, 0, W, clipY); g.clip(); }
    if (alpha !== undefined) g.globalAlpha = alpha;
    g.imageSmoothingEnabled = dw * RS > img.width * 1.15; // 그림보다 크게 늘릴 때는 부드럽게 (각져 보이지 않게)
    g.drawImage(img, x, y, Math.max(1 / RS, snap(dw)), Math.max(1 / RS, snap(dh)));
    g.restore();
  }

  // 하늘·노을·산 (커브만큼 옆으로 흐른다). 산은 다각형 세 겹 + 능선 빛, 해는 빛 번짐, 지평선은 옅은 안개
  function drawSky3D(g, rs) {
    var sky = g.createLinearGradient(0, 0, 0, HZ + 10);
    sky.addColorStop(0, '#15123a');
    sky.addColorStop(0.45, '#3f2766');
    sky.addColorStop(0.8, '#a8487a');
    sky.addColorStop(1, '#f39a52');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, HZ + 30);
    var off = rs.skyX * 300;
    for (var i = 0; i < 40; i++) { // 별 (위쪽만, 반짝임)
      var tw = 0.5 + 0.5 * Math.sin(rs.t * 2 + i * 1.7);
      g.fillStyle = 'rgba(255,255,255,' + (0.2 + 0.5 * tw * (1 - i / 60)).toFixed(2) + ')';
      var st = i % 7 === 0 ? 2 / RS * 2 : 1 / RS * 2;
      g.fillRect(mod(hash01(i * 3 + 1) * W - off * 0.15, W), hash01(i * 7 + 2) * (HZ * 0.55) + 2, st, st);
    }
    var sunX = mod(220 - off * 0.3, W + 80) - 40;
    var glow = g.createRadialGradient(sunX, HZ, 2, sunX, HZ, 60);
    glow.addColorStop(0, 'rgba(255,214,140,0.85)'); glow.addColorStop(0.25, 'rgba(255,170,100,0.35)'); glow.addColorStop(1, 'rgba(255,140,90,0)');
    g.fillStyle = glow;
    g.fillRect(sunX - 60, HZ - 60, 120, 70);
    g.fillStyle = '#ffd890';
    g.beginPath(); g.arc(sunX, HZ - 1, 11, Math.PI, 0); g.fill();
    // 산 세 겹 (먼 것부터, 가까울수록 진하고 빨리 흐른다)
    [['#4a2c66', 0.3, 18, 0.017, 'rgba(255,170,140,0.35)'], ['#33214f', 0.55, 13, 0.027, 'rgba(255,150,130,0.25)'], ['#22173a', 0.9, 8, 0.041, null]].forEach(function (L) {
      g.beginPath();
      g.moveTo(0, HZ + 2);
      var pts = [];
      for (var x = 0; x <= W; x += 2) {
        var wx = x + off * L[1];
        var h = L[2] + Math.sin(wx * L[3]) * 6 + Math.sin(wx * L[3] * 2.7 + 1) * 4 + Math.sin(wx * L[3] * 6.1 + 2) * 1.5;
        pts.push([x, HZ - h]);
        g.lineTo(x, HZ - h);
      }
      g.lineTo(W, HZ + 2);
      g.closePath();
      g.fillStyle = L[0];
      g.fill();
      if (L[4]) { // 능선에 노을 빛
        g.strokeStyle = L[4];
        g.lineWidth = 1 / RS * 1.5;
        g.beginPath();
        pts.forEach(function (p, k) { if (k) g.lineTo(p[0], p[1]); else g.moveTo(p[0], p[1]); });
        g.stroke();
      }
    });
    var haze = g.createLinearGradient(0, HZ - 8, 0, HZ + 4);
    haze.addColorStop(0, 'rgba(240,150,110,0)'); haze.addColorStop(1, 'rgba(240,150,110,0.35)');
    g.fillStyle = haze;
    g.fillRect(0, HZ - 8, W, 12);
  }

  function poly(g, x1, y1, w1, x2, y2, w2, col) {
    g.fillStyle = col;
    g.beginPath();
    y1 += 0.7 / RS; // 앞(가까운) 가장자리를 아주 조금 겹쳐 그린다: 조각 사이 반투명 경계로 생기는 옅은 줄을 없앤다
    g.moveTo(x1 - w1, y1); g.lineTo(x2 - w2, y2); g.lineTo(x2 + w2, y2); g.lineTo(x1 + w1, y1);
    g.closePath();
    g.fill();
  }

  // 위성 그리기: 지나간 위성은 그리지 않는다. 다음에 모을 위성은 둘레가 깜빡이고, 땅에 작은 그림자를 둔다(높이 가늠)
  function drawSat3D(g, sx, sy, groundY, sc, o, next, t) {
    var img = satSprite();
    var dw = sc * 520 * W / 2;
    var dh = dw * img.height / img.width;
    var bob = Math.sin(t * 3 + o.index) * dh * 0.08;
    if (groundY > sy && groundY < H + 4) { // 땅 그림자
      g.fillStyle = 'rgba(0,0,0,0.22)';
      g.beginPath(); g.ellipse(sx, groundY, dw * 0.35, Math.max(0.6, dw * 0.06), 0, 0, Math.PI * 2); g.fill();
    }
    if (next) { // 다음 위성 표시: 깜빡이는 하늘색 고리
      g.strokeStyle = 'rgba(124,242,255,' + (0.45 + 0.35 * Math.sin(t * 10)).toFixed(2) + ')';
      g.lineWidth = Math.max(1 / RS, dw * 0.05);
      g.beginPath(); g.arc(sx, sy + bob, dw * 0.62, 0, Math.PI * 2); g.stroke();
    }
    g.drawImage(img, snap(sx - dw / 2), snap(sy - dh / 2 + bob), snap(dw), snap(dh));
  }

  /**
   * 결승 게이트: 도로 위의 큰 문. p = 게이트 가운데 바닥의 투영 { sx, sy, sc }.
   *   모양: 양 기둥 + 위 체크무늬 띠 + FINISH 간판 + 아래 문턱(빗금) + 문 안 빛 막 + 문틀 불빛
   *   st = { aim, passed, since } 로 "지나갈 수 있는지 / 지나갔는지"를 색으로 알린다 (2026-11-10 사용자: "게이트 통과가 좀 더 명확했으면")
   *     aim    : 다가가는 동안 지금 위치의 판정 ('ok'면 초록 문틀이 굵게 켜지고, 벗어나 있으면 주황으로 빠르게 깜빡인다). 멀 때는 null
   *     passed : null = 아직 / true = 통과 (빛 막이 하얗게 터지고 초록 고리가 퍼진다) / false = 놓침 (문이 빨갛게 바뀐다)
   *     since  : 지나간 뒤 흐른 시간(초)
   */
  function drawGate3D(g, p, R, t, clip, st) {
    var unit = p.sc * W / 2; // 세계 1 → 화면 픽셀 (가로)
    var unitH = p.sc * H / 2; // 세계 1 → 화면 픽셀 (세로)
    var hw = R.gateHalfW * R.roadWidth * unit;
    var low = p.sy - R.gateLow * unitH;
    var high = p.sy - R.gateHigh * unitH;
    var pw = Math.max(2, 180 * unit); // 기둥 폭
    var bandH = Math.max(2, 300 * unitH); // 체크무늬 띠 높이
    var left = p.sx - hw, right = p.sx + hw;
    var passed = st ? st.passed : null;
    var aim = st ? st.aim : null;
    var since = st ? st.since : 0;
    // 문 불빛 색: 통과·조준 맞음 = 초록, 조준 벗어남 = 주황, 놓침 = 빨강
    var rgb = passed === false ? '255,90,90' : passed === null && aim && aim !== 'ok' ? '255,190,60' : '124,242,154';
    g.save();
    if (clip < H) { g.beginPath(); g.rect(0, 0, W, clip); g.clip(); }
    // 기둥 (어두운 몸 + 안쪽 밝은 줄)
    var postTop = high - bandH;
    g.fillStyle = '#2c303b';
    g.fillRect(snap(left - pw), snap(postTop), snap(pw), snap(p.sy - postTop));
    g.fillRect(snap(right), snap(postTop), snap(pw), snap(p.sy - postTop));
    g.fillStyle = '#565d70';
    g.fillRect(snap(left - pw), snap(postTop), Math.max(1 / RS, snap(pw * 0.25)), snap(p.sy - postTop));
    g.fillRect(snap(right + pw * 0.75), snap(postTop), Math.max(1 / RS, snap(pw * 0.25)), snap(p.sy - postTop));
    // 위 체크무늬 띠 (흐른다)
    var cells = 12;
    var fullW = 2 * hw + 2 * pw;
    for (var i = 0; i < cells; i++) {
      for (var k = 0; k < 2; k++) {
        g.fillStyle = (i + k + Math.floor(t * 4)) % 2 ? '#ffffff' : '#15171d';
        g.fillRect(snap(left - pw + fullW * i / cells), snap(high - bandH + k * bandH / 2), fullW / cells + 0.4 / RS, bandH / 2 + 0.4 / RS);
      }
    }
    // FINISH 간판 (띠 위. 글자가 읽힐 만큼 가까워졌을 때만)
    var boardH = 420 * unitH;
    if (boardH >= 4.5) {
      var boardW = Math.min(fullW, boardH * 4.6);
      var by = high - bandH - boardH;
      g.fillStyle = '#15171d';
      g.fillRect(snap(p.sx - boardW / 2), snap(by), snap(boardW), snap(boardH) + 0.4 / RS);
      g.fillStyle = 'rgb(' + rgb + ')';
      g.fillRect(snap(p.sx - boardW / 2), snap(by), snap(boardW), Math.max(1 / RS, boardH * 0.08));
      g.font = 'bold ' + (boardH * 0.72).toFixed(2) + 'px ' + cfg.FONT;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = passed === false ? '#ff8a8a' : '#ffffff';
      g.fillText('FINISH', p.sx, by + boardH * 0.56);
    }
    // 아래 문턱 (낮은 문 아래는 막혀 있다): 어두운 벽 + 위쪽 노랑·검정 빗금 띠 (여기는 못 지나간다는 표시)
    g.fillStyle = 'rgba(40,44,56,0.94)';
    g.fillRect(snap(left), snap(low), snap(hw * 2), snap(p.sy - low));
    var hzH = Math.min(p.sy - low, Math.max(1.5, 110 * unitH));
    var hzN = 14;
    for (var q = 0; q < hzN; q++) {
      g.fillStyle = q % 2 ? '#1a1c22' : '#ffd23f';
      g.fillRect(snap(left + hw * 2 * q / hzN), snap(low), hw * 2 / hzN + 0.4 / RS, snap(hzH));
    }
    var openH = low - high;
    // 문 안 빛 막 (지나가야 할 자리). 통과하면 하얗게 터지며 사라지고, 놓치면 빨갛게 남는다
    if (passed === true) {
      var burst = Math.max(0, 0.75 - since * 2.2);
      if (burst > 0) { g.fillStyle = 'rgba(235,255,240,' + burst.toFixed(2) + ')'; g.fillRect(snap(left), snap(high), snap(hw * 2), snap(openH)); }
    } else {
      g.fillStyle = 'rgba(' + rgb + ',' + (passed === false ? 0.2 : 0.1 + 0.05 * Math.sin(t * 5)).toFixed(2) + ')';
      g.fillRect(snap(left), snap(high), snap(hw * 2), snap(openH));
      if (passed === null && openH > 8) { // 위로 흐르는 가로 빛줄 (빛 막 느낌)
        g.fillStyle = 'rgba(' + rgb + ',0.22)';
        for (var l = 0; l < 6; l++) {
          var ly = low - mod(t * 0.5 + l / 6, 1) * openH;
          g.fillRect(snap(left), snap(ly), snap(hw * 2), Math.max(1 / RS, openH * 0.012));
        }
      }
    }
    // 문틀 불빛 (문 안쪽 네 변). 평소엔 천천히 깜빡, 조준이 맞으면 굵게 켜진 채로, 벗어나 있으면 빠르게 깜빡
    var lit = passed !== null || aim === 'ok' ? true : Math.floor(t * (aim ? 10 : 6)) % 2 === 0;
    var fw = Math.max(1.5 / RS, pw * (aim === 'ok' || passed === true ? 0.55 : 0.34));
    g.fillStyle = 'rgba(' + rgb + ',' + (lit ? 1 : 0.4) + ')';
    g.fillRect(snap(left), snap(high), snap(fw), snap(openH));
    g.fillRect(snap(right - fw), snap(high), snap(fw), snap(openH));
    g.fillRect(snap(left), snap(high), snap(hw * 2), snap(fw));
    g.fillRect(snap(left), snap(low - fw), snap(hw * 2), snap(fw));
    // 통과: 문에서 밖으로 퍼지는 초록 고리 세 개
    if (passed === true) {
      for (var r = 0; r < 3; r++) {
        var tt = since * 1.5 - r * 0.22;
        if (tt <= 0 || tt >= 1) continue;
        var grow = tt * hw * 0.7;
        g.strokeStyle = 'rgba(' + rgb + ',' + ((1 - tt) * 0.85).toFixed(2) + ')';
        g.lineWidth = Math.max(1 / RS, fw * (1 - tt * 0.6));
        g.strokeRect(left - grow, high - grow, hw * 2 + grow * 2, openH + grow * 2);
      }
    }
    g.restore();
  }

  /**
   * 레이싱 화면 한 장 (2단계 모든 단계).
   *   카메라: 차 뒤 camBack, 높이 camHeight + camLift(경사로·비행 때 차 높이를 따라 올라감). 결승 뒤에는 멈춘 카메라(camFreeze).
   *   도로 조각을 가까운 것부터 그리고(언덕 너머는 가림), 물체·차는 먼 것부터 그린다.
   */
  function draw3D(g, s) {
    var rs = s.rs;
    var R = rs.R;
    var segs = rs.track;
    var depth = 1 / Math.tan((R.fov / 2) * Math.PI / 180);
    var cam = rs.camFreeze || { z: rs.z, x: rs.x, lift: rs.camLift };
    var camZ = cam.z - R.camBack;
    var camX = cam.x * R.roadWidth;
    var camY = rs.roadY(Math.max(0, cam.z)) + R.camHeight + cam.lift;
    var b = Math.max(0, Math.floor(Math.max(0, camZ) / R.seg));
    var basePct = (Math.max(0, camZ) - b * R.seg) / R.seg;
    // 먼저 화면 전체를 땅 색으로 (출발선 뒤처럼 도로 조각이 없는 곳에 앞 화면이 남지 않게)
    g.fillStyle = '#5f4233';
    g.fillRect(0, 0, W, H);
    // 높이 올라갈수록 지평선이 아래로 (하늘이 넓어진다)
    var hz = HZ + Math.min(40, cam.lift / 80);
    var saveHZ = HZ;
    HZ = hz;
    drawSky3D(g, rs);
    var maxy = H;
    var x = 0;
    var dx = -(segs[b] ? segs[b].curve * basePct : 0);
    var vis = [];
    var gateSeg = Math.floor(rs.gateZ / R.seg); // 결승 게이트가 선 도로 조각 (그 바로 앞 세 조각이 체크무늬 결승선. 뒤쪽은 문턱에 가려 안 보인다)
    function proj(z, y, xoff) {
      var zc = z - camZ;
      var sc = depth / zc;
      return { sx: W / 2 + sc * (xoff - camX) * W / 2, sy: hz - sc * (y - camY) * H / 2, sw: sc * R.roadWidth * W / 2, sc: sc, zc: zc };
    }
    for (var n = 0; n < R.drawDist; n++) {
      var seg = segs[b + n];
      if (!seg) break;
      var p1 = proj(seg.z1, seg.y1, -x);
      var p2 = proj(seg.z2, seg.y2, -x - dx);
      x += dx;
      dx += seg.curve;
      vis.push({ seg: seg, p1: p1, p2: p2, clip: maxy });
      if (p1.zc <= depth || p2.sy >= p1.sy || p2.sy >= maxy) continue;
      var dark = Math.floor(seg.index / 3) % 2 === 0;
      g.fillStyle = dark ? '#5f4233' : '#6b4a3a'; // 사막 흙
      // 이 조각 높이만큼만 칠한다 (넉넉히 칠하면 3배 그림판에서 앞 조각 도로 위에 흙 줄이 생긴다)
      var y0 = Math.floor(p2.sy * RS) / RS, y1 = Math.ceil(p1.sy * RS) / RS;
      g.fillRect(0, y0, W, y1 - y0);
      poly(g, p1.sx, p1.sy, p1.sw * 1.12, p2.sx, p2.sy, p2.sw * 1.12, dark ? '#ff3a3a' : '#f4f4f4'); // 연석 (빨강·흰색)
      poly(g, p1.sx, p1.sy, p1.sw * 1.02, p2.sx, p2.sy, p2.sw * 1.02, dark ? '#9a2a2a' : '#b8bcc6'); // 연석 안쪽 그늘 (입체)
      poly(g, p1.sx, p1.sy, p1.sw, p2.sx, p2.sy, p2.sw, dark ? '#2b2f3a' : '#30343f'); // 도로
      var segH = p1.sy - p2.sy;
      if (segH > 0.5) {
        // 갓길선 (도로 양쪽 흰 실선)
        poly(g, p1.sx - p1.sw * 0.93, p1.sy, Math.max(0.3, p1.sw * 0.012), p2.sx - p2.sw * 0.93, p2.sy, Math.max(0.3, p2.sw * 0.012), '#d8dce4');
        poly(g, p1.sx + p1.sw * 0.93, p1.sy, Math.max(0.3, p1.sw * 0.012), p2.sx + p2.sw * 0.93, p2.sy, Math.max(0.3, p2.sw * 0.012), '#d8dce4');
        // 아스팔트 입자 (조각마다 같은 자리)
        if (segH > 1.2) {
          for (var q = 0; q < 6; q++) {
            var u = hash01(seg.index * 13 + q) * 1.8 - 0.9;
            var v = hash01(seg.index * 7 + q * 3);
            var py = p2.sy + segH * v;
            var px = p2.sx + (p1.sx - p2.sx) * v + (p2.sw + (p1.sw - p2.sw) * v) * u;
            g.fillStyle = q % 2 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.18)';
            g.fillRect(px, py, Math.max(1 / RS, segH * 0.25), 1 / RS);
          }
        }
      }
      if (seg.index >= gateSeg - 3 && seg.index < gateSeg) {
        // 결승선: 도로 폭을 8칸으로 나눠 흰색·검정을 엇갈려 칠한다 (게이트가 어디에 서 있는지 바닥에서도 보인다)
        for (var c8 = 0; c8 < 8; c8++) {
          var cc = -1 + (2 * c8 + 1) / 8;
          poly(g, p1.sx + p1.sw * cc, p1.sy, p1.sw / 8, p2.sx + p2.sw * cc, p2.sy, p2.sw / 8, (c8 + seg.index) % 2 ? '#f4f4f4' : '#15171d');
        }
      } else if (dark) {
        [-1 / 3, 1 / 3].forEach(function (l) {
          poly(g, p1.sx + p1.sw * l * 2, p1.sy, Math.max(0.5, p1.sw * 0.02), p2.sx + p2.sw * l * 2, p2.sy, Math.max(0.5, p2.sw * 0.02), '#e8e2c0');
        });
      }
      maxy = p2.sy;
    }
    function at(z) { // z 위치의 투영 (조각 안에서 이음)
      var i = Math.floor(z / R.seg) - b;
      if (i < 0 || i >= vis.length) return null;
      var v = vis[i];
      var k = (z - v.seg.z1) / R.seg;
      return { sx: v.p1.sx + (v.p2.sx - v.p1.sx) * k, sy: v.p1.sy + (v.p2.sy - v.p1.sy) * k, sc: v.p1.sc + (v.p2.sc - v.p1.sc) * k, sw: v.p1.sw + (v.p2.sw - v.p1.sw) * k, clip: v.clip, zc: v.p1.zc };
    }
    // 물체 모으기 → 먼 것부터
    var items = [];
    vis.forEach(function (v) {
      v.seg.sprites.forEach(function (sp) { items.push({ z: v.seg.z1, x: sp.x, img: propSprite(sp.kind, sp.dir), ww: sp.kind === 'tower' ? 900 : sp.kind === 'tank3d' ? 700 : sp.kind === 'shrub' ? 500 : sp.kind === 'chevron' ? 380 : 110 }); });
    });
    rs.traffic.concat(rs.lineup).forEach(function (v) { items.push({ z: v.z, x: v.x, img: vehicleRear(v.type), ww: v.w * 2 * R.roadWidth * 1.05, alpha: v.hit ? 0.6 : 1 }); });
    rs.boosts.forEach(function (bo) { if (!bo.used) items.push({ z: bo.z, x: bo.x, img: propSprite('boost'), ww: 900, flat: true }); });
    rs.tanks.forEach(function (tk) { if (!tk.taken) items.push({ z: tk.z, x: tk.x, img: propSprite('airtank'), ww: 260, lift: 250 + Math.sin(rs.t * 4 + tk.z) * 60 }); });
    items.push({ z: R.rampSeg * R.seg + 300, x: 0, img: propSprite('ramp'), ww: 2 * R.roadWidth * 1.1, liftScale: 1.6 });
    rs.fly.forEach(function (o) {
      if (o.kind === 'sat') { if (!o.done) items.push({ z: o.z, x: o.x, sat: o }); }
      else if (o.kind === 'drone' && !o.hit) items.push({ z: o.z, x: o.x, img: droneSprite(Math.floor(rs.t * 20)), ww: 520, lift: rs.droneH(o) - 150 });
      else if (o.kind === 'tank' && !o.taken) items.push({ z: o.z, x: o.x, img: propSprite('airtank'), ww: 300, lift: o.h - 150 });
    });
    // 다음에 모을 위성 (차보다 앞에 있고 아직 안 지나간 첫 위성)
    var nextSat = null;
    for (var ns = 0; ns < rs.fly.length; ns++) { var fo = rs.fly[ns]; if (fo.kind === 'sat' && !fo.done && fo.z > rs.z) { nextSat = fo; break; } }
    items.push({ z: rs.gateZ, x: 0, gate: true });
    // 게이트 상태: 가까이 다가가면 지금 위치의 판정(aim), 지나간 뒤에는 통과 여부와 흐른 시간
    var ended = rs.phase === 'finish' || rs.phase === 'done';
    var gateState = {
      aim: rs.phase === 'fly' && rs.gateZ - rs.z < rs.speed * 2.5 ? rs.gateAim() : null,
      passed: ended ? rs.gateOk : null,
      since: rs.phase === 'finish' ? rs.phaseTime : ended ? 99 : 0,
    };
    items.push({ z: rs.z, x: rs.x, car: true }); // 내 차도 먼 것부터 순서에 끼워 그린다 (결승 뒤 멀어질 때)
    items.sort(function (a2, b2) { return b2.z - a2.z; });
    items.forEach(function (it) {
      if (it.z < camZ + 300) return;
      var p = at(it.z);
      if (!p || p.zc <= depth) return;
      var sx = p.sx + p.sw * it.x;
      if (it.car) { drawPlayer(g, rs, p, sx, depth); return; }
      if (it.gate) { drawGate3D(g, { sx: p.sx + p.sw * it.x, sy: p.sy, sc: p.sc }, R, rs.t, p.clip, gateState); return; }
      if (it.sat) {
        var cyS = p.sy - it.sat.h * p.sc * H / 2;
        drawSat3D(g, sx, cyS, p.sy, p.sc, it.sat, it.sat === nextSat, rs.t);
        return;
      }
      var sy = p.sy - (it.lift ? p.sc * it.lift * H / 2 : 0);
      if (it.flat) { // 도로에 납작하게 깔린 부스트 패드
        var fw = p.sc * it.ww * W / 2;
        var fh = Math.max(1, fw * 0.12);
        if (p.sy < p.clip) g.drawImage(it.img, Math.round(sx - fw / 2), Math.round(p.sy - fh), Math.round(fw), Math.round(fh));
        return;
      }
      if (it.liftScale) { // 경사로는 키가 크게
        var rw = p.sc * it.ww * W / 2;
        var rh = rw * it.img.height / it.img.width * it.liftScale;
        if (p.sy - rh < p.clip) {
          g.save();
          if (p.clip < H) { g.beginPath(); g.rect(0, 0, W, p.clip); g.clip(); }
          g.drawImage(it.img, Math.round(sx - rw / 2), Math.round(p.sy - rh), Math.round(rw), Math.round(rh));
          g.restore();
        }
        return;
      }
      drawProjected(g, it.img, sx, sy, p.sc, it.ww, p.clip, it.alpha);
    });
    // 속도선 (부스트나 아주 빠를 때, 비행 중에도)
    if (rs.phase !== 'finish' && (rs.boost > 0 || rs.speed > R.maxSpeed * 0.97 || rs.phase === 'fly')) {
      g.fillStyle = rs.boost > 0 ? 'rgba(124,242,255,0.55)' : 'rgba(255,255,255,0.3)';
      for (var l = 0; l < 14; l++) {
        var a = hash01(l * 13 + Math.floor(rs.t * 20)) * Math.PI * 2;
        var r0 = 70 + hash01(l * 7 + Math.floor(rs.t * 30)) * 60;
        g.fillRect(Math.round(W / 2 + Math.cos(a) * r0 * 1.6), Math.round(hz + 20 + Math.sin(a) * r0 * 0.8), Math.cos(a) > 0 ? 10 : -10, 1);
      }
    }
    HZ = saveHZ;
  }

  /**
   * 내 차 (뒤에서 본 모습). p = 차 z의 도로 투영. 높이만큼 위로, 도로에는 그림자.
   *   킥플립(roll): 통째로 돈다 / 경사로 루프(pitch): 위아래로 눌렸다 뒤집힌다(cos) / 공중(경사로·비행·점프)에서는 날개를 세운다
   */
  function drawPlayer(g, rs, p, sx, depth) {
    var R = rs.R;
    var scBase = depth / R.camBack;
    var k = p.sc / scBase; // 1 = 평소 (결승 뒤 멀어지면 작아진다)
    var lift = rs.h * p.sc * H / 2;
    var air = rs.h > 0 || rs.phase === 'flip' || rs.phase === 'fly' || rs.phase === 'finish';
    var carImg = roadsterRear(air);
    var cw = 60 * k;
    var ch = cw * carImg.height / carImg.width;
    var cx = (rs.camFreeze ? sx : W / 2) + rs.steerDir * 2;
    var cy = p.sy - lift;
    if (rs.h > 0 && k > 0.3) { // 그림자 (높을수록 옅게)
      g.fillStyle = 'rgba(0,0,0,' + Math.max(0.08, 0.4 - rs.h / 6000).toFixed(2) + ')';
      g.beginPath(); g.ellipse(cx, p.sy - 1.5 * k, cw * 0.45 * Math.max(0.5, 1 - rs.h / 6000), Math.max(0.8, 2.2 * k), 0, 0, Math.PI * 2); g.fill();
    }
    if (rs.h <= 0 && k > 0.3) { // 땅에 붙은 그림자
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.beginPath(); g.ellipse(cx, p.sy - 0.5 * k, cw * 0.5, 2 * k, 0, 0, Math.PI * 2); g.fill();
    }
    if (rs.invuln > 0 && Math.floor(rs.t * 12) % 2 === 0) return; // 부딪힌 뒤 깜빡임
    g.save();
    g.translate(Math.round(cx), Math.round(cy - ch / 2));
    g.rotate(rs.roll + rs.steerDir * (rs.phase === 'fly' ? 0.15 : 0.04)); // 킥플립: 통째로 돈다. 비행 중 좌우로 기운다
    if (rs.pitch) { // 경사로 루프: 일어섰다가 뒤집힌다
      var sy2 = Math.cos(rs.pitch);
      if (Math.abs(sy2) < 0.15) sy2 = sy2 < 0 ? -0.15 : 0.15;
      g.scale(1, sy2);
    }
    g.imageSmoothingEnabled = cw * RS > carImg.width * 1.15;
    g.drawImage(carImg, -cw / 2, -ch / 2, cw, ch);
    if (rs.thrusting || (rs.h > 0 && rs.vh > 0)) { // 추진기 흰 김 (아래로)
      g.fillStyle = 'rgba(235,245,255,0.75)';
      for (var q = 0; q < 4; q++) {
        var px = (-18 + q * 12) * k + (Math.random() * 2 - 1);
        g.fillRect(Math.round(px), Math.round(ch / 2 - 2), Math.max(1, Math.round(3 * k)), Math.round((4 + Math.random() * 8) * k));
      }
    }
    g.restore();
  }

  // ── 한 화면 ─────────────────────────────────────────────
  function draw(g, s) {
    var rs = s.rs;
    var R = rs.R;
    var jolt = PF.fx.offset(); // 손맛 흔들림 (부딪힘)
    g.save();
    g.translate(-jolt.x, -jolt.y);
    draw3D(g, s);
    // 안내 카드 동안 진행자(일론)가 왼쪽 위에 선다 (말풍선 글은 main.js). 결승하면 환호
    if (rs.phase === 'ready' && R.host) SP.draw(g, R.host + '_idle', Math.floor(rs.t * 3), HOST_POS.x, HOST_POS.y);
    if ((rs.phase === 'finish' || rs.phase === 'done') && rs.gateOk && R.host) SP.draw(g, R.host + '_cheer', Math.floor(rs.t * 4), HOST_POS.x, HOST_POS.y);
    g.restore();
    PF.fx.drawSparks(g, 0, 0); // 빛 입자 (화면 좌표로 터뜨린다)
    PF.fx.drawScreen(g); // 폭죽·번쩍임
  }

  PF.roadsterDraw = { draw: draw, HOST_POS: HOST_POS };
})(window.PF);

/* ===== src/ui.js ===== */
/*
 * ui.js — 글자·상자·랭킹 표 그리기 도우미 (브라우저 전용). 랭킹 점수는 연봉(예: 3억 3,900만)과 칭호로 보여 준다.
 * ------------------------------------------------------------
 * 큰 캔버스에 "가상 좌표(320x180)"로 그린다. main.js가 미리
 * ctx.setTransform(배율, …)을 해 두므로, 여기서는 320x180 화면이라고 생각하고 쓰면 된다.
 * 글자는 확대 후 해상도로 그려지므로 한글도 또렷하다.
 */
(function (PF) {
  'use strict';

  var FONT = PF.config.FONT;

  /**
   * 글자 쓰기
   * @param o.size    글자 크기(가상 픽셀)
   * @param o.color   글자 색
   * @param o.align   'left' | 'center' | 'right'
   * @param o.bold    굵게
   * @param o.outline 테두리 색 (없으면 기본 어두운 색, false면 테두리 없음)
   */
  function text(ctx, str, x, y, o) {
    o = o || {};
    var size = o.size || 8;
    ctx.font = (o.bold === false ? '' : 'bold ') + size + 'px ' + FONT;
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.baseline || 'middle';
    if (o.outline !== false) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = Math.max(1, size / 4);
      ctx.strokeStyle = o.outline || 'rgba(20,12,30,0.95)';
