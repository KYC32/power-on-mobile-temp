    PF.audio.play('select');
    if (act === 'stage1') startGame(false);
    else if (act === 'stage2') startGame(true);
    else if (act === 'title') goTitle();
    // 'resume'은 메뉴만 닫으면 게임이 이어진다
  }

  function handleMenuKey(e) {
    e.preventDefault();
    if (e.repeat) return; // 꾹 누른 반복은 무시
    if (clock - menu.at < 0.25) return; // 메뉴가 뜨자마자 눌린 키로 바로 넘어가지 않게
    var n = menu.items.length;
    var code = e.code;
    if (code === 'ArrowUp' || code === 'KeyW') { menu.index = (menu.index + n - 1) % n; PF.audio.play('key'); }
    else if (code === 'ArrowDown' || code === 'KeyS' || code === 'Tab') { menu.index = (menu.index + 1) % n; PF.audio.play('key'); }
    else if (code === 'Enter' || code === 'NumpadEnter' || code === 'Space') menuAct(menu.items[menu.index].act);
    else if (code === 'Escape') menuAct(menu.kind === 'pause' ? 'resume' : 'title'); // 일시정지면 계속, 시작 메뉴면 타이틀로
    else {
      // 숫자 키 1-4: 그 줄을 바로 고른다
      var m = /^(?:Digit|Numpad)([1-9])$/.exec(code);
      if (m && Number(m[1]) <= n) menuAct(menu.items[Number(m[1]) - 1].act);
    }
  }

  function drawMenu() {
    dim(0.72);
    var n = menu.items.length;
    var w = 216;
    var h = 40 + n * 14;
    var x = Math.round((VW - w) / 2);
    var y = Math.round((VH - h) / 2);
    ctx.fillStyle = '#1a1430';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#7cf2ff';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    U.text(ctx, menu.kind === 'pause' ? '일시정지' : '어디서부터 할까요?', VW / 2, y + 13, { size: 10, align: 'center', color: '#ffffff' });
    menu.items.forEach(function (it, i) {
      var iy = y + 30 + i * 14;
      var on = i === menu.index;
      if (on) {
        ctx.fillStyle = 'rgba(124,242,255,0.16)'; // 고른 줄 바탕
        ctx.fillRect(x + 6, iy - 6, w - 12, 12);
        ctx.fillStyle = '#ffe066'; // 고른 줄 앞의 세모
        ctx.beginPath();
        ctx.moveTo(x + 10, iy - 3); ctx.lineTo(x + 14, iy); ctx.lineTo(x + 10, iy + 3);
        ctx.fill();
      }
      U.text(ctx, (i + 1) + '. ' + it.label, x + 18, iy, { size: 7, color: on ? '#ffe066' : '#e8e0ff', bold: on });
    });
    U.text(ctx, '↑↓ 고르기 · Enter 확인 · 숫자 키로 바로 · ESC ' + (menu.kind === 'pause' ? '계속하기' : '타이틀로'), VW / 2, y + h - 8, { size: 5.5, align: 'center', color: '#c8bfe0', bold: false });
  }

  function goTitle() {
    if (attract) attract.stop(); // 시연 중이었다면 끝낸다
    session = null;
    modal = null;
    menu = null;
    powerLine = null;
    PF.fx.reset();
    setState('title');
  }

  // fromStage2가 true면 1단계를 건너뛰고 2단계(새 로드스터)부터 시작한다 (연봉은 인턴 0점에서 시작)
  function startGame(fromStage2) {
    PF.fx.reset();
    powerLine = null;
    menu = null;
    // story: true → 시작 컷신 "신입 사원의 첫 출근" + 인사 발령 엔딩 (게임 시간은 컷신 동안 흐르지 않는다)
    // 모바일 판은 1단계(4개 회사)만: 2단계 새 로드스터를 끈다 (사용자 요청 2026-11-10)
    session = PF.game.createSession({ maps: (window.PF_ASSETS && window.PF_ASSETS.maps) || {}, onEvent: onGameEvent, story: true, roadster: MOBILE ? false : undefined });
    if (fromStage2 && !MOBILE && session.stage2) session.startRoadster(); // 컷신·1단계 없이 바로 2단계
    setState('play');
  }

  // 자동 시연 시작: attract가 만든 세션을 화면에 띄운다 (봇이 조작한다)
  function enterDemo() {
    PF.fx.reset();
    powerLine = null;
    goFlash = 0;
    session = attract.session();
    setState('demo');
  }

  // 진짜 게임의 알림 → 소리·효과·결과
  function onGameEvent(name, data) { handleEvent(name, data, false); }
  // 자동 시연의 알림 → 화면 효과만 (소리 없음, 'finish'는 attract.js가 애초에 넘기지 않는다)
  function onDemoEvent(name, data) { handleEvent(name, data, true); }

  // game.js에서 오는 알림 → 소리·효과. demo가 true면 효과음을 내지 않고 결과(저장)도 하지 않는다.
  /**
   * 알림 → 효과음 이름 (config.SFX_EVENTS 표). 소리가 없으면 null.
   *   'clearsfx'는 완료 연출 표에 적힌 소리, 'cut'은 컷의 소리를 쓴다.
   * @returns { name, arg } 또는 null
   */
  function sfxFor(name, data) {
    if (name === 'clearsfx') return data && data.name ? { name: data.name } : null;
    if (name === 'cut') return data && data.sfx ? { name: data.sfx } : null;
    // 세레머니: 인턴(0번)은 아쉬운 소리, 나머지는 팡파르
    if (name === 'ceremony') return { name: data && data.titleIndex === 0 ? cfg.SFX_EVENTS.end : cfg.SFX_EVENTS.ceremony };
    var snd = cfg.SFX_EVENTS[name];
    if (!snd) return null;
    var arg;
    if (name === 'power') arg = data && data.combo; // 연속이면 음이 높아진다
    else if (name === 'tick') arg = data; // 남은 초 (5·4·3·2·1로 갈수록 높아진다)
    else if (name === 'trapon') arg = data && data.kind; // 함정 종류마다 다른 소리
    else if (name === 'stage' || name === 'pad') arg = session ? session.stageDef().key : null; // 회사마다 다른 팡파르·점프대 소리
    return { name: snd, arg: arg };
  }

  // game.js에서 오는 알림 → 소리·효과. demo가 true면 효과음을 내지 않고 결과(저장)도 하지 않는다.
  function handleEvent(name, data, demo) {
    var snd = demo ? null : sfxFor(name, data);
    if (snd) PF.audio.play(snd.name, snd.arg);
    switch (name) {
      case 'go': case 'rdrive': goFlash = 0.8; break; // "시작!" / 2단계 "출발!"
      case 'power': // 장치 켬: 작은 흔들림 + 빛 입자
        PF.fx.shake(J.deviceShake, J.deviceShakeTime);
        if (data) PF.fx.burst(data.x, data.y, J.sparks);
        break;
      case 'zap': // 감전: 빨간 번쩍
        PF.fx.flash('255,60,60', J.zapFlash, 0.25);
        break;
      case 'burn': // SpaceX 화염에 탐: 주황 번쩍 + 작은 흔들림
        PF.fx.flash('255,140,40', J.zapFlash, 0.3);
        PF.fx.shake(J.deviceShake, J.deviceShakeTime);
        break;
      case 'stage': // 무대 완료: 흰 번쩍 + 큰 흔들림 + 폭죽
        PF.fx.flash('255,255,255', J.stageFlash, 0.4);
        PF.fx.shake(J.stageShake, J.stageShakeTime);
        PF.fx.fireworks(J.fireworks);
        powerLine = null;
        break;
      case 'clearsfx': // 완료 연출 중 큰 순간에는 화면도 흔든다 (발사·단 분리·캐치)
        if (data && (data.name === 'launch' || data.name === 'separate')) PF.fx.shake(J.stageShake, 0.5);
        else if (data && data.name === 'catch') PF.fx.shake(J.deviceShake + 1, 0.2);
        break;
      case 'powerup': // 파워업 발동: 진행자 한마디
        powerLine = { text: data.line, life: cfg.POWERUP.lineTime };
        break;
      case 'stamp': // 인사 발령 도장 "쾅": 작은 흔들림
        PF.fx.shake(J.deviceShake + 1, 0.18);
        break;
      case 'knock': // 로봇청소기에 밀려남: 작은 흔들림
        PF.fx.shake(J.deviceShake, J.deviceShakeTime);
        break;
      case 'decoy': // 미끼 장치: 보라색 번쩍
        PF.fx.flash('190,80,255', J.zapFlash, 0.3);
        break;
      case 'rcrash': // 2단계: 차량·드론에 부딪힘 → 빨간 번쩍 + 흔들림
        PF.fx.flash('255,60,60', J.zapFlash, 0.25);
        PF.fx.shake(J.stageShake - 1, 0.25);
        break;
      case 'rpass': case 'rsat': case 'rtank': case 'rboost': case 'rneardrone': // 2단계: 추월·위성·탱크·부스트·아슬아슬 → 차 둘레 빛 입자
        if (session && session.rs) {
          var rp = roadsterFxPos(session.rs);
          PF.fx.burst(rp.x, rp.y - (name === 'rsat' ? 14 : 0), name === 'rsat' ? 5 : 6);
        }
        break;
      case 'rtrail': // 위성 줄 완주: 폭죽
        PF.fx.fireworks(1);
        break;
      case 'rlineup': // 가로막은 다섯 대를 넘음: 폭죽
        PF.fx.fireworks(J.fireworks);
        break;
      case 'rtrick': // 킥플립 성공: 분홍 빛 입자 + 작은 흔들림
        if (session && session.rs) { var tp = roadsterFxPos(session.rs); PF.fx.burst(tp.x, tp.y, J.sparks + 4); }
        PF.fx.shake(J.deviceShake, J.deviceShakeTime);
        break;
      case 'rperfect': // 퍼펙트 발사: 하늘색 번쩍
        PF.fx.flash('124,242,255', J.stageFlash * 0.6, 0.3);
        break;
      case 'rbadland': case 'rgatemiss': // 삐딱 착지·게이트 놓침: 빨간 번쩍 + 흔들림
        PF.fx.flash('255,60,60', J.zapFlash, 0.25);
        PF.fx.shake(J.stageShake - 1, 0.25);
        break;
      case 'rnear': // 아슬아슬: 작은 빛
        if (session && session.rs) { var np = roadsterFxPos(session.rs); PF.fx.burst(np.x, np.y, 6); }
        break;
      case 'rflip': // J자 경사로에 올라탐: 흔들림
        PF.fx.shake(J.deviceShake + 1, 0.3);
        break;
      case 'rgate': // 결승 게이트 통과: 옅은 초록 번쩍(차가 문을 지나는 모습을 가리지 않게 옅고 짧게) + 차 둘레 빛 입자 + 폭죽
        PF.fx.flash('190,255,210', J.stageFlash * 0.4, 0.22);
        if (session && session.rs) { var gp = roadsterFxPos(session.rs); PF.fx.burst(gp.x, gp.y, J.sparks + 8); }
        PF.fx.shake(J.stageShake, J.stageShakeTime);
        PF.fx.fireworks(J.fireworks);
        break;
      case 'finish': if (!demo) finishGame(data); break; // 시연은 저장·결과 화면 없음
      default: break;
    }
  }

  // 2단계 효과(빛 입자) 위치: 처음부터 끝까지 레이싱 화면이라 내 차는 늘 화면 가운데 아래
  function roadsterFxPos() {
    return { x: VW / 2, y: 124 };
  }

  // 한 판이 끝났을 때: 기록 저장 → 순위 계산 → 결과 화면
  function finishGame(result) {
    if (state !== 'play') return; // 진짜 게임 중일 때만 저장한다 (자동 시연은 절대 저장하지 않음)
    var record = R.createRecord({ name: playerName, score: result.score, max: cfg.NICK_MAX, fallback: cfg.DEFAULT_NICK });
    // store.add: 정상이면 저장, 기존 랭킹을 못 읽은 상태(잠금)면 화면에만 넣고 저장하지 않는다
    var res = store.add(record);
    if (PF.online) PF.online.push(record); // 온라인 판: 서버에도 올린다 (실패해도 이 PC 저장은 그대로)
    var rank = R.rankOf(store.records, record.id, record.day);
    lastResult = {
      record: record,
      rank: rank,
      top: R.topN(store.records, cfg.TOP_N, record.day),
      stats: result.stats,
      companies: result.companies || [], // 회사별 성적 (결과 화면 한 줄씩)
      roadster: result.roadster || null, // 2단계 성적 (결과 화면 한 줄)
      saved: res.saved,
      reason: res.reason, // 'locked' | 'write' | 'trimmed' | undefined
    };
    setState('result');
    PF.audio.play('titlein'); // 결과 화면 칭호 등장 반짝임
  }

  // ── 닉네임 입력창 처리 ──────────────────────────────────
  function setupNickInput() {
    nickWrap = document.getElementById('nick-wrap');
    nickInput = document.getElementById('nick');
    // 입력 칸 자체도 8자까지만 받게 한다 (조합이 끝난 뒤 9번째 글자가 잘려 사라지는 일 방지)
    nickInput.maxLength = cfg.NICK_MAX;

    // 허용하지 않는 글자를 지운다. 조합 중에는 값을 건드리지 않는다(건드리면 입력이 깨진다).
    // 결과가 지금 값과 같으면 다시 넣지 않는다(커서가 끝으로 튀지 않게).
    function tidy() {
      if (enterGuard.isComposing()) return;
      var v = R.filterNickname(nickInput.value, cfg.NICK_MAX);
      if (v !== nickInput.value) nickInput.value = v;
    }

    nickConfirm = function () { if (state === 'nick') confirmNick(); };
    nickGo = MOBILE ? document.getElementById('nick-go') : null;
    if (nickGo) nickGo.addEventListener('click', function (e) { e.preventDefault(); nickConfirm(); });

    function confirmNick() {
      tidy();
      var name = R.sanitizeNickname(nickInput.value, cfg.NICK_MAX, cfg.DEFAULT_NICK);
      playerName = name;
      saveLastNick(name);
      PF.audio.play('select');
      // PC 판: 닉네임 뒤에 시작할 단계를 고른다. 모바일 판은 1단계뿐이라 바로 시작
      if (MOBILE) startGame(false);
      else { setState('select'); openMenu('start'); }
    }

    nickInput.addEventListener('compositionstart', function () { enterGuard.compositionStart(); });
    nickInput.addEventListener('compositionend', function (e) {
      enterGuard.compositionEnd(e.timeStamp);
      tidy();
      // 조합 중에 포커스를 잃었다면 조합이 끝난 지금 되돌린다
      if (state === 'nick' && document.activeElement !== nickInput) nickInput.focus();
    });
    nickInput.addEventListener('input', tidy);
    nickInput.addEventListener('keydown', function (e) {
      // Enter: 조합 확정용 Enter는 무시하고, 깨끗한 Enter는 keyup에서 시작한다 (imeguard.js)
      var g = enterGuard.keyDown(e);
      if (g === 'arm') { e.preventDefault(); return; }
      if (g === 'ignore') return;
      if (e.key === 'Escape') {
        if (e.isComposing || e.keyCode === 229) return; // 조합 취소용 Esc
        e.preventDefault();
        goTitle();
      }
    });
    nickInput.addEventListener('keyup', function (e) {
      if (enterGuard.keyUp(e) === 'confirm' && state === 'nick') {
        e.preventDefault();
        confirmNick();
      }
    });
    // 입력창 밖을 클릭해서 포커스를 잃으면 다시 가져온다.
    // 단, 한글 조합 중(후보 창 등)에는 강제로 가져오지 않는다 — 조합이 취소될 수 있다.
    nickInput.addEventListener('blur', function () {
      if (state !== 'nick' || enterGuard.isComposing()) return;
      setTimeout(function () { if (state === 'nick' && !enterGuard.isComposing()) nickInput.focus(); }, 0);
    });
  }

  // ── 관리자 기능 ─────────────────────────────────────────
  function showToast(text, color) {
    toast = { text: text, color: color || '#ffffff', life: 3 };
  }

  function stamp() {
    var d = new Date();
    function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  // 랭킹을 JSON 파일로 내려받기
  function exportRanking() {
    try {
      // 깨진 랭킹 원문을 보관 중이면 그 원문도 같이 내보낸다 (복구용)
      var broken = store.brokenBackup();
      var records = store.records;
      var json = JSON.stringify(R.exportPayload(records, null, broken ? { brokenBackup: broken } : null), null, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = cfg.EXPORT_PREFIX + stamp() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      showToast('백업 파일을 내려받았어요 (' + records.length + '개 기록' + (broken ? ', 손상 원문 포함' : '') + ')', '#7cf29a');
    } catch (e) {
      showToast('백업 실패: ' + (e && e.message ? e.message : e), '#ff6b6b');
    }
  }

  // 파일 고르기 창 열기 → 고른 파일 읽기 → 합치기/바꾸기 확인 창
  function setupFileInput() {
    fileInput = document.getElementById('import-file');
    fileInput.addEventListener('change', function () {
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = ''; // 같은 파일을 다시 골라도 change가 일어나게
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(String(reader.result));
          // 최대 보관 개수(MAX_RECORDS)까지만 받는다 (낮은 점수부터 버림)
          var list = R.normalizeRecords(data, cfg.NICK_MAX, cfg.MAX_RECORDS);
          if (list.length === 0) {
            showToast('불러올 기록이 없어요. 파일을 확인해 주세요.', '#ff6b6b');
            return;
          }
          openModal({ type: 'import', records: list, fileName: file.name });
        } catch (e) {
          showToast('JSON 파일을 읽지 못했어요.', '#ff6b6b');
        }
      };
      reader.onerror = function () { showToast('파일을 읽지 못했어요.', '#ff6b6b'); };
      reader.readAsText(file, 'utf-8');
    });
  }

  // 확인 창 열기 (일정 시간 뒤 저절로 닫힌다)
  function openModal(m) {
    m.life = cfg.ADMIN_MODAL_TIMEOUT;
    modal = m;
  }

  // 관리자 작업 결과를 알림으로 보여 준다
  function reportAdmin(res, okText) {
    if (res.ok) {
      var extra = res.trimmed ? ' (저장 공간 때문에 낮은 점수 ' + res.trimmed + '개 제외)' : '';
      showToast(okText + ' 지금 ' + res.count + '개' + extra, '#7cf29a');
    } else if (res.reason === 'locked' && res.lock === 'corrupt-backed-up') {
      showToast('손상된 랭킹이라 합칠 수 없어요. 원문은 보관 중이라 R(바꾸기)는 할 수 있어요.', '#ff6b6b');
    } else if (res.reason === 'locked') {
      showToast('저장된 랭킹을 읽을 수 없어 합치지 않았어요. 아무것도 바뀌지 않았어요.', '#ff6b6b');
    } else if (res.reason === 'unreadable') {
      showToast('저장된 랭킹을 읽을 수 없어 덮어쓰지 않았어요.', '#ff6b6b');
    } else if (res.reason === 'backup') {
      showToast('손상된 원문을 백업하지 못해 덮어쓰지 않았어요.', '#ff6b6b');
    } else if (res.reason === 'reloaded') {
      showToast('저장된 랭킹을 다시 읽었어요(' + res.count + '개). 확인 후 다시 실행하세요.', '#ffd27a');
    } else {
      showToast('저장 실패: 기록은 바뀌지 않았어요. 저장 공간을 확인하세요.', '#ff6b6b');
    }
  }

  // 확인 창이 떠 있을 때의 키 처리
  function handleModalKey(e) {
    e.preventDefault();
    if (e.repeat) return;
    if (modal.type === 'reset') {
      if (e.code === 'KeyY') {
        modal = null;
        reportAdmin(store.replaceAll([]), '랭킹을 초기화했어요.');
      } else if (e.code === 'Escape' || e.code === 'KeyN') {
        modal = null;
      }
    } else if (modal.type === 'import') {
      var list = modal.records;
      if (e.code === 'KeyM') {
        modal = null;
        reportAdmin(store.merge(list), '기록을 합쳤어요.');
      } else if (e.code === 'KeyR') {
        modal = null;
        reportAdmin(store.replaceAll(list), '기록을 바꿨어요.');
      } else if (e.code === 'Escape') {
        modal = null;
      }
    }
  }

  // 모든 keydown을 게임 입력보다 먼저 본다. true를 돌려주면 게임 입력으로 넘기지 않는다.
  function onAnyKey(e) {
    PF.audio.unlock(); // 첫 키 입력 때 소리를 켠다
    // 자동 시연 중: 아무 키나 누르면 시연을 끝내고 타이틀로. 그 키는 게임 입력으로 넘기지 않는다
    // (그래서 그 Enter로 바로 게임이 시작되지 않고, 다음 Enter부터 시작한다)
    if (state === 'demo') {
      attract.key();
      goTitle();
      return true;
    }
    if (modal) { handleModalKey(e); return true; }
    // M: 소리 끄기/켜기 (닉네임 입력 중에는 글자로 들어가야 하므로 isMuteKey가 false)
    if (MUSIC.isMuteKey(e, state, !!modal)) {
      toggleMute();
      if (state === 'title') attract.key();
      return true;
    }
    // 타이틀·닉네임 화면 키 입력 "틱" (Enter는 고르기 소리가 따로 난다, 꾹 누른 반복은 빼고)
    // 고르기 메뉴(단계 선택·일시정지)가 떠 있으면 모든 키는 메뉴가 받는다
    if (menu) { handleMenuKey(e); return true; }
    // 게임 중 ESC: 일시정지 (게임 시간이 멈춘다). 결과로 넘어가는 순간('done')에는 열지 않는다
    if (state === 'play' && e.code === 'Escape' && !e.repeat && session && session.phase !== 'done') {
      e.preventDefault();
      openMenu('pause');
      PF.audio.play('key');
      return true;
    }
    if ((state === 'title' || state === 'nick') && !e.repeat && e.code !== 'Enter' && e.code !== 'NumpadEnter') PF.audio.play('key');
    if (state !== 'title') return false;
    attract.key(); // 타이틀에서 키를 누르면 시연 대기 시간을 처음부터

    if (e.ctrlKey && e.shiftKey) {
      if (e.code === 'KeyE') { e.preventDefault(); exportRanking(); return true; }
      // I(개발자 도구)·Delete(인터넷 사용 기록 삭제)는 Edge가 먼저 가져가므로 쓰지 않는다
      if (e.code === 'KeyL') { e.preventDefault(); fileInput.click(); return true; }
      if (e.code === 'KeyX') { e.preventDefault(); openModal({ type: 'reset' }); return true; }
    }
    if (e.code === 'Tab') {
      e.preventDefault();
      titleBoard = titleBoard === 'today' ? 'all' : 'today';
      return true;
    }
    return false;
  }

  // 소리 전체 끄기/켜기 + 상태 저장 (저장에 실패해도 이번 실행 동안은 적용된다)
  function toggleMute() {
    var on = !PF.audio.isMuted();
    PF.audio.setMuted(on);
    MUSIC.writeMute(getStorage(), cfg.STORAGE_KEYS.mute, on);
    if (PF.touch) PF.touch.setMuted(on);
    showToast(on ? T('소리 끔 (M: 다시 켜기)', '소리 끔') : '소리 켬', on ? '#c8bfe0' : '#7cf29a');
  }

  // 지금 화면에 맞는 배경음악을 audio.js에 알린다 (곡·템포·크기가 바뀐 것만 반영된다)
  function updateMusic() {
    var s = session;
    PF.audio.setBgm(MUSIC.pickBgm({
      state: state,
      phase: s ? s.phase : null,
      stageKey: s ? s.stageDef().key : null,
      time: s ? s.time : 0,
    }));
  }

  // ── 매 단계(1/60초) 갱신 ────────────────────────────────
  function update(dt) {
    clock += dt;
    PF.fx.update(dt);
    if (powerLine) { powerLine.life -= dt; if (powerLine.life <= 0) powerLine = null; }
    stateTime += dt;
    if (toast) { toast.life -= dt; if (toast.life <= 0) toast = null; }
    if (goFlash > 0) goFlash -= dt;
    // 관리자 확인 창: 자리를 비워도 다음 방문객이 막히지 않게 시간이 지나면 닫는다
    if (modal) {
      modal.life -= dt;
      if (modal.life <= 0) {
        modal = null;
        showToast('확인 창을 닫았어요 (응답 없음). 아무것도 바뀌지 않았어요.', '#c8bfe0');
      }
    }
    var I = PF.input;

    switch (state) {
      case 'title':
        if (!modal && I.pressed('confirm')) { PF.audio.play('select'); setState('nick'); }
        // 가만히 DEMO.idleTime(20초) 두면 자동 시연 (관리자 확인 창이 떠 있으면 재지 않는다)
        else if (attract.titleUpdate(dt, !!modal)) enterDemo();
        break;
      case 'demo':
        // 봇이 조작한다. 보여 줄 회사를 다 보였거나 너무 길어지면 타이틀로
        if (attract.update(dt) === 'end') goTitle();
        break;
      case 'select':
        // 단계 선택 화면: 오래 그대로 두면 타이틀로 (메뉴 키는 handleMenuKey가 받는다)
        if (!menu || stateTime >= cfg.SELECT_AUTO_RETURN) goTitle();
        break;
      case 'play':
        if (menu) break; // 일시정지: 게임을 한 걸음도 계산하지 않는다 (시간·점수·함정 모두 멈춤)
        session.update(dt, {
          left: I.down('left'),
          right: I.down('right'),
          jumpHeld: I.down('jump'),
          jumpPressed: I.pressed('jump'),
          down: I.down('down'), // 2단계 킥플립 (↓·S)
          skip: I.pressed('confirm') || I.pressed('jump'), // 완료 연출 건너뛰기 (Enter·Space)
        });
        break;
      case 'result':
        if (stateTime >= cfg.RESULT_INPUT_LOCK && I.pressed('confirm')) { PF.audio.play('select'); goTitle(); }
        else if (stateTime >= cfg.RESULT_AUTO_RETURN) goTitle();
        break;
      default:
        break;
    }
    updateMusic();
  }

  // ── 그리기 ──────────────────────────────────────────────
  function render() {
    // 1) 작은 캔버스에 픽셀 그림
    lctx.setTransform(PF.hires.R, 0, 0, PF.hires.R, 0, 0); // 320x180 좌표 → R배 그림판
    lctx.imageSmoothingEnabled = false;
    var intro = (state === 'play' || state === 'demo') && session && session.phase === 'intro';
    if (intro) {
      PF.render.drawIntro(lctx, PF.story.cutAt(session.phaseTime), session.phaseTime); // 시작 컷신 장면
    } else if ((state === 'play' || state === 'demo') && session && session.rs) {
      PF.roadsterDraw.draw(lctx, session); // 2단계 새 로드스터 (엔딩 동안에도 그 장면을 배경으로)
    } else if ((state === 'play' || state === 'demo') && session) {
      PF.render.drawWorld(lctx, session, { host: !!powerLine }); // 파워업 한마디 동안 진행자도 나온다
    } else {
      // 타이틀·닉네임·결과 화면 배경: 5초마다 회사가 바뀌는 "전원 켜기" 장면
      var idx = Math.floor(clock / 5) % cfg.STAGES.length;
      PF.render.drawScene(lctx, cfg.STAGES[idx], clock, state !== 'result');
    }

    // 2) 화면 캔버스 가운데에 키워 붙이기 (정수배면 보간 끔, 축소할 때만 부드럽게)
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#05060e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // 그림판(960x540)을 화면에 붙일 때 딱 나누어떨어지는 배율(2배 등)이면 선명하게, 아니면 부드럽게 (픽셀 크기가 들쭉날쭉하지 않게)
    ctx.imageSmoothingEnabled = !lay.integer || (lay.w % low.width) !== 0;
    ctx.drawImage(low, lay.x, lay.y, lay.w, lay.h);

    // 3) 글자·표 (가상 320x180 좌표). 게임 화면 밖으로 글자가 넘치지 않게 잘라 낸다.
    ctx.setTransform(lay.scale, 0, 0, lay.scale, lay.x, lay.y);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.clip();
    if (state === 'title') drawTitle();
    else if (state === 'nick') drawNick();
    else if (state === 'play') drawPlayLayer(false);
    else if (state === 'demo') { drawPlayLayer(true); drawDemoBand(); }
    else if (state === 'result') drawResult();
    if (menu) drawMenu(); // 단계 선택·일시정지 메뉴 (게임 화면 위에 덮는다)
    if (modal) drawModal();
    if (toast) drawToast();
    ctx.restore();
  }

  var U = PF.ui;

  function dim(alpha) {
    ctx.fillStyle = 'rgba(10,6,24,' + alpha + ')';
    ctx.fillRect(0, 0, VW, VH);

  function drawTitle() {

    // 바닥 윗면이 y 152라 달리는 플레이어 그림은 y 128-152, 키 큰 장치(16x32)는 y 120부터 그려진다.
    // 글자가 그림에 겹치지 않게 안내 묶음 전체를 y 119 위로 올렸다 (마지막 줄 116 ± 글자 반 높이).
    U.text(ctx, cfg.TITLE, 86, 24, { size: 15, align: 'center', color: '#ffd23f', outline: '#1a1430' });
    U.text(ctx, cfg.TITLE_EN, 86, 38, { size: 7, align: 'center', color: '#bfe8ff' });
    U.text(ctx, '꺼진 빅테크에 전원을 켜라!', 86, 51, { size: 7.5, align: 'center', color: '#ffffff' });
    U.text(ctx, '회사마다 ' + FUN.formatSeconds(cfg.STAGE_TIME) + ', 4개 회사를 모두 살려라!', 86, 61, { size: 6.5, align: 'center', color: '#ffffff' });
    U.text(ctx, T('TESLA · NVIDIA · SAMSUNG · SpaceX → 2단계 새 로드스터', 'TESLA · NVIDIA · SAMSUNG · SpaceX'), 86, 71, { size: T(5.5, 6), align: 'center', color: '#c8d4ff' });
    if (Math.floor(clock * 2) % 2 === 0) {

    }

    var S = cfg.SCORE;

    U.text(ctx, '장치를 켜면 연봉 인상 · 3초 안에 이어 켜면 연속 보너스', 86, 100, { size: 5.5, align: 'center', color: '#ffe9a8' });
    U.text(ctx, '3개 켜면 파워업! · 완료 보너스 · 함정은 연봉 삭감', 86, 108, { size: 5.5, align: 'center', color: '#ffe9a8' });

    }

    // 오른쪽: 랭킹 표
    var isToday = titleBoard === 'today';

    U.rankingTable(ctx, list, 178, 8, 136, {

    });

    // 잠금 이유에 따라 실제 상태대로 알린다 (백업이 없으면 "보관 중"이라고 쓰지 않는다)
    var lock = store.lockReason();
    var lockText = lock === 'corrupt-backed-up'

      : lock === 'corrupt-no-backup'
        ? '주의: 저장된 랭킹이 손상됐고 원문 백업도 실패했어요. 새 기록은 저장하지 않아요'
        : lock === 'unreadable'
          ? '주의: 저장된 랭킹을 읽을 수 없어요. 새 기록은 저장하지 않아요'
          : null;
    if (lockText) {
      U.text(ctx, lockText, VW / 2, 166, { size: 5.5, align: 'center', color: '#ff8a8a' });
    } else if (!store.storageOk()) {
      U.text(ctx, '주의: 이 브라우저에서는 기록이 저장되지 않아요 (InPrivate 창인지 확인)', VW / 2, 166, {
        size: 5.5, align: 'center', color: '#ff8a8a',
      });
    }
  }

  // 타이틀 표 목록. 기록이나 날짜, 표 종류가 바뀔 때만 다시 정렬한다.
  function titleList() {
    var day = today();
    var c = boardCache;
    if (c.version !== store.version || c.day !== day || c.board !== titleBoard) {
      c.version = store.version;
      c.day = day;
      c.board = titleBoard;
      c.list = titleBoard === 'today' ? R.topN(store.records, cfg.TOP_N, day) : R.topN(store.records, cfg.TOP_N);
    }
    return c.list;
  }

  function drawNick() {
    dim(0.55);
    U.panel(ctx, 50, 26, 220, 128);
    U.text(ctx, '닉네임을 입력하세요', VW / 2, 42, { size: 11, align: 'center', color: '#ffd23f' });
    U.text(ctx, '한글·영문·숫자 최대 8자 (빈칸이면 "방문객")', VW / 2, 58, { size: 6, align: 'center', color: '#e8e0ff' });
    U.text(ctx, T('← → 또는 A D : 이동    Space ↑ W : 점프    ESC : 일시정지', '왼쪽 아래 버튼: 이동    오른쪽 아래 버튼: 점프'), VW / 2, 112, { size: 6.5, align: 'center', color: '#ffffff' });
    U.text(ctx, '꺼진 장치(빨간 불)에 몸이 닿으면 전원 ON!', VW / 2, 122, { size: 6.5, align: 'center', color: '#7cf29a' });
    U.text(ctx, '초록 버그는 장치를 끄고, 닿으면 감전돼요', VW / 2, 131, { size: 6, align: 'center', color: '#ff9a9a' });
    if (!MOBILE) {

      U.text(ctx, '한글 마지막 글자를 치는 중이면 Enter를 한 번 더', VW / 2, 150, { size: 5, align: 'center', color: '#c8bfe0', bold: false });

  // 완료 연출 자막: captions [[시작 초, 글자], …] 중 지금 시각에 맞는 것 (없으면 완료 문구)
  function clearCaption(st, t) {
    var text = st.clearText;
    (st.captions || []).forEach(function (c) { if (t >= c[0]) text = c[1]; });
    return text;
  }

  /**
   * 말풍선 (위쪽에 작게, 게임을 가리지 않게)
   * @param style 'speech' 흰 말풍선 + 왼쪽 꼬리 / 'phone' Galaxy 폰 알림 모양(검은 카드 + 파란 아이콘)
   * @param align 'left'면 x가 왼쪽 끝, 'center'면 가운데
   */
  function drawBubble(text, x, y, style, align) {
    var size = 7;
    ctx.font = 'bold ' + size + 'px ' + cfg.FONT;
    var tw = ctx.measureText(text).width;
    var phone = style === 'phone';
    var padL = phone ? 13 : 5;
    var w = Math.ceil(tw + padL + 5);
    var h = 13;
    var bx = align === 'center' ? Math.round(x - w / 2) : x;
    // 그림 담당 시트에 말풍선 그림이 있으면 9칸 늘이기로 쓴다 (없으면 아래 코드 그림)
    var sheetName = phone ? 'notify_bubble' : 'speech_bubble';
    var smooth = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    var usedSheet = PF.spritesheet.drawNine(ctx, sheetName, bx, y, w, h, 4);
    if (usedSheet && !phone && align === 'left' && PF.spritesheet.has('speech_tail')) {
      PF.spritesheet.draw(ctx, 'speech_tail', 0, bx - 6, y + 3, { flip: true }); // 진행자 쪽 꼬리
    }
    ctx.imageSmoothingEnabled = smooth;
    if (usedSheet) {
      if (phone) {
        ctx.fillStyle = '#2e58d6'; // 알림 앱 아이콘
        ctx.fillRect(bx + 3, y + 3, 7, 7);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(bx + 5, y + 5, 3, 3);
      }
      U.text(ctx, text, bx + padL, y + h / 2 + 0.5, { size: size, color: phone ? '#ffffff' : '#0e1018', outline: false });
    } else if (phone) {
      ctx.fillStyle = 'rgba(14,16,24,0.92)';
      ctx.fillRect(bx, y, w, h);
      ctx.strokeStyle = 'rgba(114,160,255,0.9)';
      ctx.lineWidth = 0.75;
      ctx.strokeRect(bx + 0.5, y + 0.5, w - 1, h - 1);
      ctx.fillStyle = '#2e58d6'; // 알림 앱 아이콘
      ctx.fillRect(bx + 3, y + 3, 7, 7);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx + 5, y + 5, 3, 3);
      U.text(ctx, text, bx + padL, y + h / 2 + 0.5, { size: size, color: '#ffffff', outline: false });
    } else {
      ctx.fillStyle = '#f3f6fa';
      ctx.fillRect(bx, y, w, h);
      if (align === 'left') { // 왼쪽 진행자 쪽으로 꼬리
        ctx.beginPath();
        ctx.moveTo(bx, y + 4);
        ctx.lineTo(bx - 4, y + 7);
        ctx.lineTo(bx, y + 9);
        ctx.fill();
      }
      ctx.strokeStyle = '#0e1018';
      ctx.lineWidth = 0.75;
      ctx.strokeRect(bx + 0.5, y + 0.5, w - 1, h - 1);
      U.text(ctx, text, bx + padL, y + h / 2 + 0.5, { size: size, color: '#0e1018', outline: false });
    }
  }

  /**
   * 게임 중 글자 층: 컷신이면 컷 글자, 인사 발령이면 발령장, 나머지는 HUD
   * @param demo 자동 시연 화면인지 (닉네임 자리는 "신입", 건너뛰기 안내 없음)
   */
  function drawPlayLayer(demo) {
    var ph = session.phase;
    var name = demo ? '' : playerName;
    if (ph === 'intro') drawIntroText(session, name, demo);
    else if (ph === 'ceremony') drawCeremony(session, name || '신입', demo); // 직급별 세레머니 (발령장 뒤)
    else if (ph === 'ending' || ph === 'done') drawEnding(session, name || '신입', demo);
    else if (ph === 'roadster') drawRoadsterHud(demo);
    else drawHud(demo);
  }

  // 글자가 maxW 안에 maxLines줄 이하로 들어가는 가장 큰 크기와 줄들 (띄어쓰기 자리에서만 줄바꿈)
  function fitLines(text, maxW, maxLines, size, minSize) {
    var lines;
    for (;;) {
      ctx.font = 'bold ' + size + 'px ' + cfg.FONT;
      lines = FUN.wrapWords(text, maxW, function (t) { return ctx.measureText(t).width; });
      var widest = 0;
      lines.forEach(function (ln) { widest = Math.max(widest, ctx.measureText(ln).width); });
      if ((lines.length <= maxLines && widest <= maxW) || size <= minSize) break;
      size -= 0.5;
    }
    return { lines: lines, size: size };
  }

  /**
   * 시작 컷신 글자: 위쪽 띠에 컷 설명(닉네임이 길면 줄바꿈·글자 줄임), 컷 번호 점, SOS 풍선, 건너뛰기 안내
   */
  function drawIntroText(s, name, demo) {
    var cut = PF.story.cutAt(s.phaseTime);
    var text = PF.story.cutText(cut.index, name);
    ctx.globalAlpha = 1 - cut.fade * 0.8; // 컷이 바뀔 때 글자도 살짝 흐려진다
    ctx.fillStyle = 'rgba(6,8,20,0.82)';
    ctx.fillRect(0, 0, VW, 34);
    ctx.fillStyle = '#ffd23f';
    ctx.fillRect(0, 34, VW, 1);
    var fit = fitLines(text, 296, 2, 8.5, 5.5);
    var lh = fit.size + 3;
    fit.lines.forEach(function (ln, i) {
      U.text(ctx, ln, VW / 2, 17 + (i - (fit.lines.length - 1) / 2) * lh, { size: fit.size, align: 'center', color: '#ffffff', outline: '#1a1430' });
    });
    ctx.globalAlpha = 1;
    // 컷 번호 점 4개 (지금 컷은 노랗게)
    var n = cfg.STORY.cuts.length;
    for (var i = 0; i < n; i++) {
      ctx.fillStyle = i === cut.index ? '#ffd23f' : 'rgba(255,255,255,0.3)';
      ctx.fillRect(VW / 2 - n * 4 + i * 8 + 1, 38, 5, 2);
    }
    // 4번째 컷: 세 진행자 머리 위에 알림 풍선 "SOS!"
    if (cut.key === 'sos') {
      PF.render.INTRO_HOSTS_X.forEach(function (x, k) {
        if (cut.local >= 0.2 + k * 0.25) drawBubble('SOS!', x, PF.render.INTRO_HOSTS_FEET - 66, 'phone', 'center');
      });
    }
    if (!demo && s.phaseTime >= cfg.STORY.skipAfter) {
      U.text(ctx, T('Enter: 건너뛰기', '화면을 눌러 건너뛰기'), VW - 6, 172, { size: 6, align: 'right', color: '#e8e0ff' });
    }
  }

  /**
   * 인사 발령 엔딩: 흰 종이 문서(코드 그림) — 성명·발령 직급·연봉·발령 문구, 마지막에 빨간 도장 "쾅"
   * CEO면 세 진행자가 cheer 그림으로 양옆에서 박수
   */
  function drawEnding(s, name, demo) {
    var ap = PF.story.appointment(s.score);
    var t = s.phaseTime;
    dim(0.6);
    var jolt = PF.fx.offset(); // 도장 찍을 때 흔들림
    var pw = 136, ph = 142;
    var drop = (1 - ease01(t / 0.3)) * -14; // 위에서 살짝 내려오며 나타난다
    var px = Math.round((VW - pw) / 2 + jolt.x);
    var py = Math.round(18 + drop + jolt.y);
    if (ap.allHosts) {
      // CEO: 세 진행자 박수 (cheer 2프레임을 빠르게 넘긴다)
      var f = Math.floor(clock * 6) % 2;
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      PF.spritesheet.draw(ctx, 'jensen_cheer', f, 22, 92, { scale: 2 });
      PF.spritesheet.draw(ctx, 'elon_cheer', f + 1, 56, 92, { scale: 2 });
      PF.spritesheet.draw(ctx, 'jaeyong_cheer', f, VW - 56, 92, { scale: 2 });
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px + 3, py + 3, pw, ph); // 그림자
    ctx.fillStyle = '#f7f4ea';
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = '#c9c1a8';
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    U.text(ctx, '인사 발령', px + pw / 2, py + 15, { size: 13, align: 'center', color: '#1d1a2b', outline: false });
    ctx.fillStyle = '#1d1a2b';
    ctx.fillRect(px + 10, py + 25, pw - 20, 1);
    ctx.fillRect(px + 10, py + 27, pw - 20, 0.5);
    var rows = [['성명', name], ['발령 직급', ap.title], ['연봉', ap.salary]];
    rows.forEach(function (r, i) {
      var y = py + 39 + i * 13;
      U.text(ctx, r[0], px + 12, y, { size: 6, color: '#6a6453', outline: false, bold: false });
      var vf = fitLines(r[1], pw - 62, 1, 8, 5.5); // 닉네임이 길어도 칸 안에
      U.text(ctx, r[1], px + 50, y, { size: vf.size, color: i === 1 ? '#c4243a' : '#1d1a2b', outline: false });
    });
    ctx.fillStyle = '#d8d0b8';
    ctx.fillRect(px + 10, py + 80, pw - 20, 1);
    var lf = fitLines(ap.line, pw - 20, 2, 7, 5);
    lf.lines.forEach(function (ln, i) {
      U.text(ctx, ln, px + pw / 2, py + 93 + i * (lf.size + 3), { size: lf.size, align: 'center', color: '#1d3a8a', outline: false });
    });
    var d = new Date();
    U.text(ctx, d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.', px + 12, py + ph - 20, { size: 5.5, color: '#6a6453', outline: false, bold: false });
    U.text(ctx, '빅테크 합동 인사위원회', px + 12, py + ph - 11, { size: 6, color: '#1d1a2b', outline: false });
    // 빨간 도장: stampAt에 크게 나타났다가 0.12초 만에 제자리에 "쾅"
    if (t >= cfg.STORY.stampAt) {
      var k = ease01((t - cfg.STORY.stampAt) / 0.12);
      var sc = 2.2 - 1.2 * k;
      ctx.save();
      ctx.globalAlpha = 0.35 + 0.55 * k;
      ctx.translate(px + pw - 28, py + ph - 26);
      ctx.rotate(-0.26);
      ctx.scale(sc, sc);
      ctx.strokeStyle = '#d8283a';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
      ctx.lineWidth = 0.6;
      ctx.stroke();
      U.text(ctx, '발령', 0, 0.5, { size: 8, align: 'center', color: '#d8283a', outline: false });
      ctx.restore();
    }
    if (!demo && t >= cfg.STORY.endingSkipAfter) {
      U.text(ctx, T('Enter: 건너뛰기', '화면을 눌러 건너뛰기'), VW - 6, 172, { size: 6, align: 'right', color: '#e8e0ff' });
    }
  }

  // ── 직급별 세레머니 화면 (config.CEREMONY) ───────────────
  // 인사 발령(도장) 뒤, 결과 화면 앞. 직급마다 배경·단상 높이·효과·문구가 다르다.
  // 모든 움직임은 흐른 시간(t)만으로 계산한다 (입자 상태를 따로 들고 있지 않아서 건너뛰어도 남는 것이 없다).

  // 늘 같은 값이 나오는 가짜 난수 (0-1): i번째 조각의 k번째 성질
  function cerRand(i, k) {
    var x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  var CER_COLORS = ['#ff4a5a', '#ffd23f', '#7cf29a', '#72a0ff', '#e04fae', '#ffffff'];
  var CER_GOLD = ['#ffe066', '#ffd23f', '#fff6c0', '#e0a81a'];

  function drawCeremony(s, name, demo) {
    var C = cfg.CEREMONY;
    var title = FUN.titleOf(s.score);
    var sc = C.scenes[Math.min(title.index, C.scenes.length - 1)];
    var t = s.phaseTime;
    var has = function (k) { return sc.fx.indexOf(k) >= 0; };
    var floorY = 146; // 바닥 윗면
    var cx = VW / 2;
    var i;

    // 1) 배경: 위·아래 두 색을 잇는다
    var grad = ctx.createLinearGradient(0, 0, 0, floorY);
    grad.addColorStop(0, sc.sky[0]);
    grad.addColorStop(1, sc.sky[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, VW, VH);

    // 2) 별 (부장·부사장): 제자리에서 반짝인다
    if (has('stars')) {
      for (i = 0; i < 46; i++) {
        ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 2 + i));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(cerRand(i, 1) * VW), Math.floor(cerRand(i, 2) * (floorY - 24)), 1, 1);
      }
      ctx.globalAlpha = 1;
    }

    // 3) 로켓 발사 (부사장): 오른쪽에서 불꽃을 뿜으며 올라간다
    if (has('rocket')) {
      var rx = 268;
      var ry = floorY - 34 - Math.pow(Math.max(0, t - 0.6), 2) * 14; // 0.6초 뒤부터 점점 빠르게
      ctx.fillStyle = '#e9edf5';
      ctx.fillRect(rx - 4, ry, 8, 28); // 몸통
      ctx.beginPath(); // 뾰족한 머리
      ctx.moveTo(rx - 4, ry); ctx.lineTo(rx, ry - 8); ctx.lineTo(rx + 4, ry);
      ctx.fill();
      ctx.fillStyle = '#8a93a8';
      ctx.fillRect(rx - 7, ry + 20, 3, 8); // 날개
      ctx.fillRect(rx + 4, ry + 20, 3, 8);
      ctx.fillStyle = '#1d2a4a';
      ctx.fillRect(rx - 2, ry + 6, 4, 4); // 창
      var fl = 8 + Math.floor(clock * 20) % 2 * 4; // 불꽃 길이가 떨린다
      ctx.fillStyle = '#ff9a3a';
      ctx.fillRect(rx - 3, ry + 28, 6, fl);
      ctx.fillStyle = '#fff6a0';
      ctx.fillRect(rx - 1, ry + 28, 2, fl - 3);
      for (i = 0; i < 8; i++) { // 발사대 연기
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = '#c8c8d0';
        ctx.beginPath();
        ctx.arc(rx - 20 + i * 6 + Math.sin(t * 3 + i) * 2, floorY - 3 - cerRand(i, 5) * 5, 4 + cerRand(i, 6) * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 4) 폭죽 (부장 이상): 정해진 자리에서 차례로 터진다
    if (has('fireworks')) {
      var period = 3.0;
      for (var b = 0; b < 6; b++) {
        var age = (t - 0.2 - b * 0.5) % period;
        if (t < 0.2 + b * 0.5 || age < 0 || age > 1.1) continue;
        var bx = 30 + cerRand(b, 7) * (VW - 60);
        var by = 22 + cerRand(b, 8) * 50;
        var rad = 26 * ease01(age / 1.1);
        ctx.globalAlpha = 1 - age / 1.1;
        ctx.fillStyle = CER_COLORS[b % CER_COLORS.length];
        for (var k = 0; k < 14; k++) {
          var a = k / 14 * Math.PI * 2;
          ctx.fillRect(Math.round(bx + Math.cos(a) * rad), Math.round(by + Math.sin(a) * rad + age * age * 6), 2, 2);
          ctx.fillRect(Math.round(bx + Math.cos(a) * rad * 0.55), Math.round(by + Math.sin(a) * rad * 0.55 + age * age * 6), 1, 1);
        }
      }
      ctx.globalAlpha = 1;
    }

    // 5) 조명 (과장 이상): 위 양쪽에서 주인공에게 내려오는 빛줄기가 살짝 흔들린다
    if (has('spot')) {
      var gold = has('gold') || has('carpet');
      for (i = 0; i < 2; i++) {
        var sx = i === 0 ? 40 : VW - 40;
        var sway = Math.sin(t * 1.6 + i * 2) * 10;
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = gold ? '#ffe9a0' : '#ffffff';
        ctx.beginPath();
        ctx.moveTo(sx - 4, 0); ctx.lineTo(sx + 4, 0);
        ctx.lineTo(cx + 34 + sway, floorY); ctx.lineTo(cx - 34 + sway, floorY);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 6) 바닥 + 레드 카펫 (임원 이상)
    ctx.fillStyle = sc.floor;
    ctx.fillRect(0, floorY, VW, VH - floorY);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(0, floorY, VW, 1);
    if (has('carpet')) {
      ctx.fillStyle = '#b01c2c';
      ctx.fillRect(cx - 34, floorY, 68, VH - floorY);
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(cx - 34, floorY, 2, VH - floorY);
      ctx.fillRect(cx + 32, floorY, 2, VH - floorY);
    }

    // 7) 단상: 직급이 오를수록 한 단씩 높아진다
    var stepH = 5; // 한 단 높이 (3단이어도 주인공 머리가 위쪽 글자에 닿지 않게)
    for (i = 0; i < sc.podium; i++) {
      var pw2 = 84 - i * 16;
      var py2 = floorY - (i + 1) * stepH;
      ctx.fillStyle = i === sc.podium - 1 && has('gold') ? '#ffd23f' : '#e8e4f0';
      ctx.fillRect(cx - pw2 / 2, py2, pw2, stepH);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(cx - pw2 / 2, py2 + stepH - 2, pw2, 2);
    }
    var topY = floorY - sc.podium * stepH; // 주인공이 서는 높이

    // 8) 진행자: 그 직급의 진행자가 양옆에 선다 (과장부터는 환호, CEO는 셋 모두)
    var hosts = cfg.TITLES[title.index].hosts || [];
    var cheer = title.index >= cfg.CHEER_FROM;
    var hostX = [cx - 86, cx + 54, cx - 122]; // 왼쪽, 오른쪽, 더 왼쪽
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    hosts.forEach(function (h, n) {
      var fr = Math.floor(clock * (cheer ? 6 : 2)) % 2;
      PF.spritesheet.draw(ctx, h + (cheer ? '_cheer' : '_idle'), fr + n, hostX[n % hostX.length], floorY - 48, { scale: 2 });
    });
    // 9) 주인공: 3배 크기로 가운데. 기쁜 직급은 폴짝폴짝 뛴다
    var hop = sc.jump ? Math.abs(Math.sin(t * 5)) * 6 : 0;
    ctx.translate(cx - 24, Math.round(topY - 72 - hop));
    ctx.scale(3, 3);
    PF.sprites.drawPlayer(ctx, hop > 2 ? 'jump' : 'idle', Math.floor(clock * 2) % 2, 0, 0, false);
    ctx.restore();

    // 10) 왕관 (CEO): 머리 위에서 살짝 떠 있다
    if (has('crown')) {
      var cy2 = Math.round(topY - 72 - hop - 9 + Math.sin(t * 3) * 1.5);
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(cx - 9, cy2 + 5, 18, 5); // 띠
      ctx.beginPath(); // 뾰족한 세 봉우리
      ctx.moveTo(cx - 9, cy2 + 5); ctx.lineTo(cx - 9, cy2 - 2); ctx.lineTo(cx - 4, cy2 + 3);
      ctx.lineTo(cx, cy2 - 4); ctx.lineTo(cx + 4, cy2 + 3); ctx.lineTo(cx + 9, cy2 - 2); ctx.lineTo(cx + 9, cy2 + 5);
      ctx.fill();
      ctx.fillStyle = '#ff4a5a';
      ctx.fillRect(cx - 1, cy2 + 6, 2, 2); // 보석
    }

    // 11) 풍선 (대리·차장): 아래에서 위로 떠오른다
    if (has('balloons')) {
      for (i = 0; i < 8; i++) {
        var bx2 = 18 + cerRand(i, 9) * (VW - 36) + Math.sin(t * 1.5 + i) * 4;
        var by2 = VH + 16 - ((t * (20 + cerRand(i, 10) * 14) + cerRand(i, 11) * 200) % (VH + 50));
        if (Math.abs(bx2 - cx) < 30) bx2 += bx2 < cx ? -34 : 34; // 주인공을 가리지 않게 옆으로
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(bx2, by2 + 6); ctx.lineTo(bx2 + Math.sin(t * 2 + i) * 1.5, by2 + 18);
        ctx.stroke();
        ctx.fillStyle = CER_COLORS[i % (CER_COLORS.length - 1)];
        ctx.beginPath();
        ctx.ellipse(bx2, by2, 5, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(Math.round(bx2 - 3), Math.round(by2 - 3), 1, 2); // 반짝이는 점
      }
    }

    // 12) 떨어지는 조각: 서류(인턴) / 색종이 / 금빛 비(CEO)
    var kind = has('gold') ? 'gold' : has('papers') ? 'papers' : has('confetti') ? 'confetti' : null;
    if (kind) {
      for (i = 0; i < sc.count; i++) {
        var fx2 = cerRand(i, 12) * VW + Math.sin(t * 2 + i) * 6;
        var fy2 = ((cerRand(i, 13) * (VH + 12) + t * (28 + cerRand(i, 14) * 42)) % (VH + 12)) - 6;
        if (kind === 'papers') {
          ctx.fillStyle = '#f2f0e8';
          ctx.fillRect(Math.round(fx2), Math.round(fy2), 6, 7);
          ctx.fillStyle = '#9a9aa8';
          ctx.fillRect(Math.round(fx2) + 1, Math.round(fy2) + 2, 4, 1);
          ctx.fillRect(Math.round(fx2) + 1, Math.round(fy2) + 4, 3, 1);
        } else {
          var pal = kind === 'gold' ? CER_GOLD : CER_COLORS;
          ctx.fillStyle = pal[i % pal.length];
          var wide = Math.floor(t * 6 + i) % 2; // 팔랑거리며 가로·세로가 바뀐다
          ctx.fillRect(Math.round(fx2), Math.round(fy2), wide ? 3 : 2, wide ? 2 : 3);
        }
      }
    }

    // 13) 글자: 큰 제목이 커지며 나타나고, 그 아래에 이름·직급·연봉, 맨 아래에 한 줄
    var pop = ease01(t / 0.25);
    U.text(ctx, sc.head, cx, 19, { size: 10 + 8 * pop, align: 'center', color: has('gold') ? '#fff6c0' : '#ffffff', outline: '#1a1430' });
    var info = fitLines(name + ' ' + title.name + ' · 연봉 ' + FUN.formatSalary(s.score), VW - 20, 1, 7.5, 5.5);
    U.text(ctx, info.lines[0], cx, 35, { size: info.size, align: 'center', color: '#ffe066', outline: '#1a1430' });
    var subFit = fitLines(sc.sub, VW - 16, 1, 7, 5.5);
    U.text(ctx, subFit.lines[0], cx, 162, { size: subFit.size, align: 'center', color: '#ffffff', outline: '#1a1430' });
    if (!demo && t >= C.skipAfter) {
      U.text(ctx, T('Enter: 건너뛰기', '화면을 눌러 건너뛰기'), VW - 6, 174, { size: 6, align: 'right', color: '#e8e0ff' });
    }
  }

  // 0-1로 자른 뒤 끝에서 느려지는 곡선 (나타나기 연출용)
  function ease01(v) { v = v < 0 ? 0 : v > 1 ? 1 : v; return 1 - (1 - v) * (1 - v); }

  /**
   * 게임 화면 글자 (위쪽 띠·미션·말풍선·안내)
   * @param demo true면 자동 시연 화면: 완료 연출 아래 안내(건너뛰기 등)를 빼고, 아래쪽은 DEMO 띠가 덮는다
   */
  function drawHud(demo) {
    var s = session;
    var st = s.stageDef();
    // 위쪽 띠: 시간 / 무대 이름 / 점수
    ctx.fillStyle = 'rgba(8,10,24,0.72)';
    ctx.fillRect(0, 0, VW, 17);
    ctx.fillStyle = st.color;
    ctx.fillRect(0, 17, VW, 1); // 회사 색 밑줄
    // 시간: 지금 회사의 남은 시간. WARN_TIME(5초) 이하면 빨갛게 천천히 깜빡인다 (1초에 2번, 과하지 않게)
    var secs = Math.ceil(s.time);
    var warn = s.phase === 'play' && s.time <= cfg.WARN_TIME;
    var pulse = warn && Math.floor(s.t * 2) % 2 === 0;
    U.text(ctx, '시간', 6, 9, { size: 6, color: '#c8bfe0' });
    U.text(ctx, String(secs), 26, 9, { size: 10, color: warn ? (pulse ? '#ff4a4a' : '#ffb0b0') : '#ffffff' });
    if (!demo) drawSoundHint(44, 9, '#c8bfe0'); // 시간 오른쪽 구석: 스피커 + "M: 소리" (시연 중에는 DEMO 띠에)
    U.text(ctx, st.name, VW / 2, 9, { size: 7.5, align: 'center', color: '#ffffff' });
    // 회사 진행도 "2/4": 무대 이름 바로 오른쪽에 작게 (이름 폭을 재서 붙인다)
    ctx.font = 'bold 7.5px ' + cfg.FONT;
    var nameW = ctx.measureText(st.name).width;
    U.text(ctx, (s.stageIndex + 1) + '/' + cfg.STAGES.length, VW / 2 + nameW / 2 + 4, 9.5, { size: 5.5, color: '#c8bfe0', bold: false });
    // 연봉: 금액 글자 폭을 재서 "연봉" 이름표를 그 바로 왼쪽에 붙인다 (3억 3,900만 원처럼 길어져도 겹치지 않게)
    var payText = FUN.formatSalary(s.score);
    ctx.font = 'bold 9px ' + cfg.FONT;
    var payW = ctx.measureText(payText).width;
    U.text(ctx, payText, VW - 6, 9, { size: 9, align: 'right', color: '#ffe066' });
    U.text(ctx, '연봉', VW - 6 - payW - 4, 9, { size: 6, align: 'right', color: '#c8bfe0' });

    // 발동 중인 파워업: 회사 색 아이콘 + 이름 + 남은 시간 막대 (밝기 막대 아래)
    if (s.power) {
      var px0 = VW - 92;
      ctx.fillStyle = 'rgba(8,10,24,0.75)';
      ctx.fillRect(px0, 30, 86, 13);
      ctx.fillStyle = st.color;
      ctx.fillRect(px0 + 2, 32, 9, 9);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px0 + 5, 32, 3, 9);
      U.text(ctx, s.power.name, px0 + 14, 35.5, { size: 5.5, color: '#ffffff' });
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(px0 + 14, 39, 69, 2);
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(px0 + 14, 39, Math.round(69 * Math.max(0, s.power.time / s.power.max)), 2);
    }

    // 미션 문구 (예: "GPU 랙 전원 켜기 3/8")와 연속 표시
    var on = s.devicesOn();
    var total = s.devices.length;
    if (s.phase === 'clear') {
      // 완료 연출 중에는 미션 자리에 연출 자막 (예: "로드스터 공개!")
      U.text(ctx, clearCaption(st, s.phaseTime), VW / 2, 25, { size: 7, align: 'center', color: '#ffe066' });
    } else {
      U.text(ctx, st.mission + ' ' + on + '/' + total, 6, 25, { size: 6, color: on === total ? '#7cf29a' : '#ffe9a8' });
    }
    // 밝기 막대: 켤수록 차오른다
    var barW = 50;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(VW - barW - 6, 22, barW, 5);
    ctx.fillStyle = st.color;
    ctx.fillRect(VW - barW - 6, 22, Math.round(barW * (total ? on / total : 1)), 5);
    U.text(ctx, '밝기', VW - barW - 10, 25, { size: 5.5, align: 'right', color: '#c8bfe0', bold: false });
    var comboLive = s.phase === 'play' && s.combo > 0 && s.lastOnAt !== null && s.playClock - s.lastOnAt <= cfg.COMBO_WINDOW;
    if (comboLive) {
      U.text(ctx, (s.combo + 1) + '연속!', VW / 2, 25, { size: 6.5, align: 'center', color: '#ffe066' });
    }

    // 떠오르는 글자 (+100, 꺼짐!, 감전! 등)
    var camX = Math.round(s.camera.x);
    var camY = Math.round(s.camera.y);
    s.floaters.forEach(function (f) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life / f.max * 1.5));
      U.text(ctx, f.text, f.x - camX, f.y - camY, { size: 7, align: 'center', color: f.color });
      ctx.globalAlpha = 1;
    });

    // 무대 시작 말풍선·파워업 한마디 (진행자 그림은 render.js가 왼쪽 위에 그린다)
    if (s.phase !== 'clear' && powerLine) {
      drawBubble(powerLine.text, PF.render.HOST_POS.x + 20, PF.render.HOST_POS.y + 2, st.bubble, 'left');
    } else if (st.startLine && s.phase !== 'clear' && s.stageTime < cfg.BUBBLE_TIME) {
      drawBubble(st.startLine, PF.render.HOST_POS.x + 20, PF.render.HOST_POS.y + 2, st.bubble, 'left');
    }

    // 가운데 큰 안내 글자
    if (s.phase === 'ready') {
      // 회사 시작 안내: "TESLA 기가팩토리 · 30초" (이 동안 시간은 줄지 않는다)
      var bugN = s.bugs.length;
      // 빨간 SOS 한 줄 (docs/story-brief.md): 왼쪽에 작은 "SOS" 꼬리표
      if (st.sos) {
        ctx.font = 'bold 8px ' + cfg.FONT;
        var sosW = ctx.measureText(st.sos).width;
        var tagX = Math.round(VW / 2 - (sosW + 22) / 2);
        ctx.fillStyle = '#d8283a';
        ctx.fillRect(tagX, 39, 18, 10);
        U.text(ctx, 'SOS', tagX + 9, 44.5, { size: 6, align: 'center', color: '#ffffff', outline: false });
        U.text(ctx, st.sos, tagX + 22, 44.5, { size: 8, color: '#ff6a6a', outline: '#2a0a10' });
      }
      U.text(ctx, st.name, VW / 2, 60, { size: 14, align: 'center', color: '#ffffff', outline: '#1a1430' });
      U.text(ctx, (s.stageIndex + 1) + '/' + cfg.STAGES.length + '  ·  ' + FUN.formatSeconds(s.stageLimit()) + '  ·  장치 ' + s.devices.length + '개' + (bugN ? '  ·  버그 ' + bugN + '마리' : ''),
        VW / 2, 77, { size: 7, align: 'center', color: '#ffd27a' });
      if (s.stageIndex === 0) {
        U.text(ctx, '어둠 속 빨간 불이 꺼진 장치예요. 닿아서 켜세요!', VW / 2, 90, { size: 7, align: 'center', color: '#ffe9a8' });
      }
    } else if (goFlash > 0) {
      U.text(ctx, '시작!', VW / 2, 70, { size: 20, align: 'center', color: '#ffd23f', outline: '#1428a0' });
    } else if (s.phase === 'clear') {
      // 회사별 연출(차·폴드·로켓)이 가운데를 지나가므로 글자는 위쪽과 맨 아래에 둔다
      U.text(ctx, st.clearText, VW / 2, 40, { size: 14, align: 'center', color: '#7cf29a', outline: '#10301a' });
      if (st.clearLine && st.clearLineAt) {
        // 단계가 정해진 말풍선(SpaceX "Occupy Mars!"): 그 단계에서만, 왼쪽 위 진행자(render.js가 그림) 옆에
        var seg = PF.game.showAt(st, s.phaseTime, s.clearTime());
        if (seg && seg.key === st.clearLineAt) drawBubble(st.clearLine, PF.render.HOST_POS.x + 20, PF.render.HOST_POS.y + 2, st.bubble, 'left');
      } else if (st.clearLine) {
        drawBubble(st.clearLine, VW / 2, 52, st.bubble, 'center');
      }
      if (!demo) {
        var foot = nextText(s) + (s.phaseTime >= cfg.CLEAR_SKIP_AFTER ? T('    Enter·Space: 건너뛰기', '    눌러서 건너뛰기') : '');
        if (s.lastTimeBonus) foot = '남은 시간 보너스 ' + FUN.formatSalary(s.lastTimeBonus, true, false, s.score - s.lastTimeBonus) + '    ' + foot;
        U.text(ctx, foot, VW / 2, 172, { size: 6, align: 'center', color: '#ffffff' });
      }
    } else if (s.phase === 'over') {
      // 이 회사 시간 종료: 켠 개수와 다음 회사 안내 (완료 보너스·연출 없음)
      U.text(ctx, '시간 종료!', VW / 2, 66, { size: 20, align: 'center', color: '#ffd23f', outline: '#1a1430' });
      U.text(ctx, st.short + ' ' + s.devicesOn() + '/' + s.devices.length + '  ·  ' + nextText(s), VW / 2, 86, { size: 7, align: 'center', color: '#ffffff' });
    }
  }

  // ── 2단계 새 로드스터 HUD·안내 카드 (docs/roadster-brief.md) ──────────────
  // 위쪽 띠: 공기 게이지(600L) / 단계 이름 / 연봉. 밑줄은 진행 막대(가운데 흰 눈금 = 경사로).
  // 둘째 줄: 지금 구간에서 할 일과 넘은 차량·통과한 링 수. 가운데 큰 글자: 안내 카드·출발·날아올라·착륙.
  function drawRoadsterHud(demo) {
    var s = session;
    var rs = s.rs;
    var R = cfg.ROADSTER;
    var red = '#e8323c'; // 로드스터 빨강
    ctx.fillStyle = 'rgba(8,10,24,0.72)';
    ctx.fillRect(0, 0, VW, 17);
    // 진행 막대 (드라이브 → 경사로 → 비행 → 착륙)
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(0, 17, VW, 2);
    ctx.fillStyle = red;
    ctx.fillRect(0, 17, Math.round(VW * rs.progress()), 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(VW / 2, 16, 1, 4);
    // 공기 게이지: 100 = 600L. 20% 아래면 빨갛게 깜빡인다
    var airK = Math.max(0, Math.min(1, rs.air / R.air));
    var low = airK < 0.2;
    U.text(ctx, '공기', 6, 9, { size: 6, color: '#c8bfe0' });
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(24, 6, 40, 5);
    ctx.fillStyle = low ? (Math.floor(rs.t * 4) % 2 ? '#ff4a4a' : '#ffb0b0') : '#5fc8ff';
    ctx.fillRect(24, 6, Math.round(40 * airK), 5);
    U.text(ctx, Math.round(rs.air * 6) + 'L', 67, 9, { size: 5.5, color: low ? '#ff8a8a' : '#bfe8ff', bold: false });
    if (!demo) drawSoundHint(90, 9, '#c8bfe0');
    U.text(ctx, R.name, VW / 2 + 10, 9, { size: 7.5, align: 'center', color: '#ffffff' });
    // 연봉 (1단계 HUD와 같은 방식: 금액 폭을 재서 "연봉" 이름표를 왼쪽에 붙인다)
    var payText = FUN.formatSalary(s.score);
    ctx.font = 'bold 9px ' + cfg.FONT;
    var payW = ctx.measureText(payText).width;
    U.text(ctx, payText, VW - 6, 9, { size: 9, align: 'right', color: '#ffe066' });
    U.text(ctx, '연봉', VW - 6 - payW - 4, 9, { size: 6, align: 'right', color: '#c8bfe0' });

    // 둘째 줄: 할 일 + 개수
    var st = rs.stats;
    if (rs.phase === 'drive' || rs.phase === 'ready') {
      U.text(ctx, '←→ 조향 · Space 점프(꾹=떠 있기) · ↓ 킥플립', 6, 25, { size: 6, color: '#ffe9a8' });
      U.text(ctx, '추월 ' + st.vehicles + '/' + st.vehiclesTotal, VW - 6, 25, { size: 6, align: 'right', color: '#ffffff' });
      if (rs.combo >= 2 && rs.phase === 'drive') U.text(ctx, rs.combo + '연속 무사고!', VW / 2, 34, { size: 6.5, align: 'center', color: '#ffe066' });
      if (rs.phase === 'drive') {
        // 속도계 (화면 오른쪽 아래): 부스트 중이면 하늘색, 도로 밖이면 빨강
        var kmh = rs.kmh();
        var kcol = rs.boost > 0 ? '#7cf2ff' : Math.abs(rs.x) > 1 && rs.h <= 0 ? '#ff8a8a' : '#ffffff';
        U.text(ctx, String(kmh), VW - 30, 166, { size: 14, align: 'right', color: kcol, outline: '#1a1430' });
        U.text(ctx, 'km/h', VW - 6, 168, { size: 6, align: 'right', color: '#c8bfe0' });
        if (Math.abs(rs.x) > 1 && rs.h <= 0) U.text(ctx, '도로 밖! 느려져요', VW / 2, 44, { size: 7, align: 'center', color: '#ff8a8a', outline: '#1a1430' });
        // 가로막은 다섯 대가 가까우면 경고
        var lineDz = R.lineupSeg * R.seg - rs.z;
        if (lineDz > 0 && lineDz < R.maxSpeed * 2.2 && !rs.lineupDone) U.text(ctx, '앞에 차량 다섯 대! Space 꾹 눌러 넘어라!', VW / 2, 44, { size: 7.5, align: 'center', color: Math.floor(rs.t * 4) % 2 ? '#ffd23f' : '#ffffff', outline: '#1a1430' });
      }
    } else if (rs.phase === 'flip') {
      U.text(ctx, '꼭대기에서 뒤집히는 순간 Space!', 6, 25, { size: 6, color: '#7cf2ff' });
    } else if (rs.phase === 'fly') {
      U.text(ctx, '←→ 좌우 · Space 꾹: 위로 · 스타링크 위성 줄을 따라 모아라!', 6, 25, { size: 6, color: '#ffe9a8' });
      U.text(ctx, '위성 ' + st.sats + '/' + st.satsTotal, VW - 6, 25, { size: 6, align: 'right', color: '#ffffff' });
      var mult = rs.chainMult();
      if (rs.chain > 0) U.text(ctx, '체인 ×' + mult + '  (' + rs.chain + '연속)', VW / 2, 34, { size: mult > 1 ? 7.5 : 6.5, align: 'center', color: mult >= 4 ? '#ff9af0' : mult >= 3 ? '#7cf29a' : mult === 2 ? '#7cf2ff' : '#ffe066' });
    }
    if (rs.phase === 'fly' && rs.gateZ - rs.z < rs.speed * 2.5) {
      // 결승 게이트가 다가온다: 지금 위치 그대로 지나갈 수 있는지와, 아니라면 어느 쪽으로 움직일지를 알린다 (문틀 색도 같이 바뀐다)
      var aim = rs.gateAim();
      var aimMsg = { ok: '결승 게이트! 이대로 통과!', low: '↑ 더 높이! Space 꾹', high: '↓ 너무 높아요! Space 떼기', left: '오른쪽으로 →', right: '← 왼쪽으로' }[aim];
      var aimCol = aim === 'ok' ? '#7cf29a' : Math.floor(rs.t * 6) % 2 ? '#ffd23f' : '#ffffff';
      U.text(ctx, aimMsg, VW / 2, 44, { size: aim === 'ok' ? 8 : 9.5, align: 'center', color: aimCol, outline: aim === 'ok' ? '#10301a' : '#3a1a00' });
    }

    // 떠오르는 글자 (화면 좌표)
    rs.floaters.forEach(function (f) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life / f.max * 1.5));
      U.text(ctx, f.text, f.x, f.y, { size: 7, align: 'center', color: f.color });
      ctx.globalAlpha = 1;
    });

    var HP = PF.roadsterDraw.HOST_POS;
    if (rs.phase === 'ready') {
      // 안내 카드: 초록 "NEW" 꼬리표 + 초대 문구 / 큰 제목 / 순서·시간 / 조작 / 장소
      drawBubble(R.startLine, HP.x + 20, HP.y + 2, 'speech', 'left');
      ctx.font = 'bold 8px ' + cfg.FONT;
      var sosW = ctx.measureText(R.sos).width;
      var tagX = Math.round(VW / 2 - (sosW + 22) / 2);
      ctx.fillStyle = '#1f9a4a';
      ctx.fillRect(tagX, 47, 18, 10);
      U.text(ctx, 'NEW', tagX + 9, 52.5, { size: 6, align: 'center', color: '#ffffff', outline: false });
      U.text(ctx, R.sos, tagX + 22, 52.5, { size: 8, color: '#7cf29a', outline: '#0a2a14' });
      U.text(ctx, '새 로드스터 시승', VW / 2, 68, { size: 14, align: 'center', color: '#ffffff', outline: '#1a1430' });
      U.text(ctx, '레이싱 → J자 경사로 → 하늘 비행 → 결승 게이트', VW / 2, 84, { size: 7, align: 'center', color: '#ffd27a' });
      U.text(ctx, R.mission, VW / 2, 95, { size: 7, align: 'center', color: '#ffe9a8' });
      U.text(ctx, '←→ 조향 · Space 점프·추진 · ↓ 킥플립', VW / 2, 114, { size: 6.5, align: 'center', color: '#ffffff' });
      U.text(ctx, R.place + ' · 2026년 10월 공개', VW / 2, 105, { size: 5.5, align: 'center', color: '#c8bfe0', bold: false });
    } else if (goFlash > 0 && rs.phase === 'drive') {
      U.text(ctx, '출발!', VW / 2, 70, { size: 20, align: 'center', color: '#ffd23f', outline: '#1428a0' });
    } else if (rs.phase === 'flip') {
      // 발사 타이밍 막대: 가운데 초록 칸 = 퍼펙트, 노란 칸 = 좋음. 흰 표시가 꼭대기 순간에 가운데를 지난다
      var at = rs.launchAt();
      var span = 0.6; // 막대 양쪽 끝 = 꼭대기 앞뒤 0.6초
      var bx = VW / 2 - 60, bw = 120, by = 44;
      var px = function (dt) { return bx + bw / 2 + (dt / span) * (bw / 2); };
      ctx.fillStyle = 'rgba(8,10,24,0.7)';
      ctx.fillRect(bx - 2, by - 2, bw + 4, 10);
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(px(-R.launchGood), by, px(R.launchGood) - px(-R.launchGood), 6);
      ctx.fillStyle = '#7cf29a';
      ctx.fillRect(px(-R.launchPerfect), by, px(R.launchPerfect) - px(-R.launchPerfect), 6);
      var cur = Math.max(-span, Math.min(span, rs.phaseTime - at));
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(px(cur)) - 1, by - 2, 2, 10);
      var big = rs.launch === 'perfect' ? '퍼펙트 발사!' : rs.launch === 'good' ? '좋은 발사!' : rs.launch === 'late' ? '아깝다!' : '날아올라!';
      U.text(ctx, big, VW / 2, 66, { size: 16, align: 'center', color: rs.launch === 'perfect' ? '#7cf2ff' : '#ffd23f', outline: '#1428a0' });
    } else if (rs.phase === 'fly' && rs.phaseTime < 2.2) {
      // 비행 조작 안내: 레이싱의 "톡 = 점프"가 여기서는 "꾹 = 계속 위로, 떼면 아래로"로 바뀐다는 것을 2초 동안 크게 알린다
      ctx.fillStyle = 'rgba(8,10,24,0.72)';
      ctx.fillRect(VW / 2 - 92, 46, 184, 40);
      U.text(ctx, '이제 하늘!', VW / 2, 56, { size: 11, align: 'center', color: '#bfe8ff', outline: '#1428a0' });
      U.text(ctx, 'Space 꾹 = 위로   떼면 = 아래로   ←→ = 좌우', VW / 2, 72, { size: 6.5, align: 'center', color: '#ffffff' });
      U.text(ctx, '위성 줄을 따라 Space를 눌렀다 뗐다', VW / 2, 81, { size: 5.5, align: 'center', color: '#ffe9a8', bold: false });
    } else if (rs.phase === 'finish') {
      // 게이트 결과를 크게: 통과 / 놓침(+ 까닭). 글자는 게이트 그림 위쪽 하늘에 둔다 (문과 차를 가리지 않게)
      var okG = rs.gateOk;
      var pop = Math.min(1, rs.phaseTime / 0.18); // 처음 0.18초 동안 커지며 나타난다
      U.text(ctx, okG ? '게이트 통과!' : '게이트 놓침', VW / 2, 31, { size: 11 + 6 * pop, align: 'center', color: okG ? '#7cf29a' : '#ff8a8a', outline: okG ? '#10301a' : '#3a0a0a' });
      var why = { low: '너무 낮았어요 (문턱 아래)', high: '너무 높았어요 (문 위)', left: '왼쪽으로 벗어났어요', right: '오른쪽으로 벗어났어요' }[rs.gateMiss];
      U.text(ctx, okG ? '결승 보너스 ' + FUN.formatSalary(rs.gateBonus, true, true, s.score - rs.gateBonus) : (why || '') + ' · 보너스 없음', VW / 2, 45, { size: 7.5, align: 'center', color: okG ? '#ffffff' : '#ffd0d0', outline: '#1a1430' });

  /**
   * 작은 스피커 표시 + "M: 소리" (x는 아이콘 왼쪽, y는 글자 가운데 높이)
   * 소리를 껐으면 lucide volume-x, 켰으면 volume-2 모양을 선으로 그린다 (이모지는 쓰지 않는다).
   */
  function drawSoundHint(x, y, color) {
    if (MOBILE) return; // 모바일은 오른쪽 위 소리 버튼이 따로 있다
    var muted = PF.audio.isMuted();

  // lucide "volume-2" / "volume-x" 모양 (24x24 기준)을 size 크기로
  //   스피커: polygon 11 5, 6 9, 2 9, 2 15, 6 15, 11 19
  //   volume-2: 중심 (12,12) 반지름 5·10인 호 두 개 / volume-x: 22 9 → 16 15, 16 9 → 22 15 두 선
  function drawIconVolume(x, y, size, color, muted) {
    var k = size / 24;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2 * k * 1.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 11 * k, y + 5 * k);
    ctx.lineTo(x + 6 * k, y + 9 * k);
    ctx.lineTo(x + 2 * k, y + 9 * k);
    ctx.lineTo(x + 2 * k, y + 15 * k);
    ctx.lineTo(x + 6 * k, y + 15 * k);
    ctx.lineTo(x + 11 * k, y + 19 * k);
    ctx.closePath();
    if (muted) {
      ctx.moveTo(x + 22 * k, y + 9 * k);
      ctx.lineTo(x + 16 * k, y + 15 * k);
      ctx.moveTo(x + 16 * k, y + 9 * k);
      ctx.lineTo(x + 22 * k, y + 15 * k);
    } else {
      ctx.moveTo(x + (12 + 5 * Math.SQRT1_2) * k, y + (12 - 5 * Math.SQRT1_2) * k);
      ctx.arc(x + 12 * k, y + 12 * k, 5 * k, -Math.PI / 4, Math.PI / 4);
      ctx.moveTo(x + (12 + 10 * Math.SQRT1_2) * k, y + (12 - 10 * Math.SQRT1_2) * k);
      ctx.arc(x + 12 * k, y + 12 * k, 10 * k, -Math.PI / 4, Math.PI / 4);
    }
    ctx.stroke();
    ctx.restore();
  }

  // 완료 연출·시간 종료 화면 아래 안내: 다음 회사 이름, 마지막 회사면 결과
  function nextText(s) {
    if (s.isLastStage()) return s.stage2 ? '다음: 2단계 새 로드스터' : '다음: 결과 보기';

  /**
   * 회사별 성적 줄 (결과 화면). 4개 회사를 2칸 x 2줄로: "TESLA 10/10 (체크)" / "SpaceX 7/10 (시계)"
   * (x, y)는 왼쪽 위 줄의 왼쪽 끝·가운데 높이. 한 칸 폭 82, 줄 간격 9 (가상 픽셀)
   * 아이콘은 lucide 모양(check, clock)을 선으로 그린다 (이모지는 쓰지 않는다).
   */
  function drawCompanyLines(list, x, y) {

  /**
   * 2단계 새 로드스터 성적 한 줄 (결과 화면, 회사별 줄 아래): "2단계 로드스터  차량 10/12 · 링 9/12   +1억 2,000만"
   */
  // total = 최종 점수 (2단계에서 오른 연봉을 계산하는 데 쓴다)
  function drawRoadsterLine(rd, x, y, total) {

  // lucide "check" 모양 (24x24 기준 polyline 20 6 9 17 4 12)을 size 크기로
  function drawIconCheck(x, y, size, color) {
    var k = size / 24;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5 * k * 1.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 20 * k, y + 6 * k);
    ctx.lineTo(x + 9 * k, y + 17 * k);
    ctx.lineTo(x + 4 * k, y + 12 * k);
    ctx.stroke();
    ctx.restore();
  }

  // lucide "clock" 모양 (원 r=10 + 바늘 12 6 → 12 12 → 16 14)을 size 크기로: 시간 종료 표시
  function drawIconClock(x, y, size, color) {
    var k = size / 24;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2 * k * 1.6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.arc(x + 12 * k, y + 12 * k, 10 * k, 0, Math.PI * 2);
    ctx.moveTo(x + 12 * k, y + 6 * k);
    ctx.lineTo(x + 12 * k, y + 12 * k);
    ctx.lineTo(x + 16 * k, y + 14 * k);
    ctx.stroke();
    ctx.restore();
  }

  /**
   * 결과 화면 진행자 한마디: 인물 그림(16x24) 1-3명 + 오른쪽 말풍선 (줄바꿈은 띄어쓰기 자리에서만)
   * @param host FUN.hostLine 결과 { line, sprites }
   * (x, y)는 첫 인물의 왼쪽 위. 왼쪽 칸(폭 172) 안에 들어가게 말풍선 폭을 맞춘다.
   */
  function drawHostLine(host, x, y) {
    var frame = Math.floor(clock * 2) % 2; // 2프레임 그림을 0.5초마다 넘긴다
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    host.sprites.forEach(function (name, i) {
      PF.spritesheet.draw(ctx, name, frame, x + i * 17, y);
    });
    ctx.restore();
    var bx = x + host.sprites.length * 17 + 6; // 말풍선 왼쪽 (꼬리는 인물 쪽)
    var size = 6.5;
    var pad = 4;
    var maxText = 168 - bx - pad * 2;
    ctx.font = 'bold ' + size + 'px ' + cfg.FONT;
    var lines = FUN.wrapWords(host.line, maxText, function (t) { return ctx.measureText(t).width; });
    var tw = 0;
    lines.forEach(function (ln) { tw = Math.max(tw, ctx.measureText(ln).width); });
    var w = Math.ceil(tw + pad * 2);
    var lh = 8; // 줄 간격
    var h = lines.length * lh + 5;
    var by = y + Math.max(0, Math.round((24 - h) / 2)); // 인물 높이 가운데쯤
    // 시트에 말풍선 9칸 그림이 있으면 그것을, 없으면 코드로 그린다 (기존 무대 말풍선과 같은 모양)
    var smooth = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    var usedSheet = PF.spritesheet.drawNine(ctx, 'speech_bubble', bx, by, w, h, 4);
    if (usedSheet && PF.spritesheet.has('speech_tail')) PF.spritesheet.draw(ctx, 'speech_tail', 0, bx - 6, by + 3, { flip: true });
    ctx.imageSmoothingEnabled = smooth;
    if (!usedSheet) {
      ctx.fillStyle = '#f3f6fa';
      ctx.fillRect(bx, by, w, h);
      ctx.beginPath(); // 인물 쪽 꼬리
      ctx.moveTo(bx, by + 4);
      ctx.lineTo(bx - 4, by + 7);
      ctx.lineTo(bx, by + 9);
      ctx.fill();
      ctx.strokeStyle = '#0e1018';
      ctx.lineWidth = 0.75;
      ctx.strokeRect(bx + 0.5, by + 0.5, w - 1, h - 1);
    }
    lines.forEach(function (ln, i) {
      U.text(ctx, ln, bx + pad, by + 2.5 + lh / 2 + i * lh, { size: size, color: '#0e1018', outline: false });
    });
  }

  /**
   * 사원증 카드: 줄 + 흰 카드 + 회사 띠 + 얼굴 칸 + 닉네임 + 칭호(크게) + 최종 연봉
   * (x, y)는 카드 왼쪽 위, 카드 크기 120x60 (가상 픽셀). 위쪽에 진행자 한마디가 있어 낮게 만들었다.
   */
  function drawBadge(name, title, score, x, y) {
    var w = 120, h = 60;
    // 목줄 (카드 위쪽에 짧게)
    ctx.fillStyle = '#e04848';
    ctx.fillRect(x + w / 2 - 14, y - 4, 4, 10);
    ctx.fillRect(x + w / 2 + 10, y - 4, 4, 10);
    ctx.fillStyle = '#9aa3b2';
    ctx.fillRect(x + w / 2 - 8, y - 2, 16, 6); // 집게
    // 카드
    ctx.fillStyle = '#0e1018';
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = '#f6f6f6';
    ctx.fillRect(x, y, w, h);
    // 직급이 높을수록 위 띠 색이 화려해진다 (인턴 회색 → CEO 금색, 10단계)
    var bandColors = ['#8d97ae', '#5a8fd0', '#3aa0d8', '#26b49a', '#4fa83a', '#8a4fe0', '#b03ac4', '#c4243a', '#e0702a', '#d4a33a'];
    ctx.fillStyle = bandColors[Math.min(title.index, bandColors.length - 1)];
    ctx.fillRect(x, y, w, 12);
    U.text(ctx, 'BIG TECH TOUR · 사원증', x + w / 2, y + 6.5, { size: 5.5, align: 'center', color: '#ffffff', outline: false });
    // 얼굴 칸 (신입 사원 캐릭터)
    ctx.fillStyle = '#d5dbe6';
    ctx.fillRect(x + 6, y + 15, 22, 26);
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    PF.sprites.drawPlayer(ctx, 'idle', 0, x + 9, y + 16, false);
    ctx.restore();
    U.text(ctx, name, x + 33, y + 20, { size: 7.5, color: '#1d1a2b', outline: false });
    U.text(ctx, title.name, x + 33, y + 33, { size: 11, color: '#c4243a', outline: false });
    ctx.fillStyle = '#d5dbe6';
    ctx.fillRect(x + 6, y + 44, w - 12, 1);
    U.text(ctx, '최종 연봉', x + 8, y + 52, { size: 6, color: '#4a5470', outline: false });
    // 금액이 길면("3억 3,900만 원") 이름표와 겹치지 않게 글자 크기를 줄인다 (최대 12, 최소 8)
    var pay = FUN.formatSalary(score);
    ctx.font = 'bold 6px ' + cfg.FONT;
    var room = w - 16 - ctx.measureText('최종 연봉').width - 5; // 이름표 오른쪽 남은 폭
    var paySize = 12;
    ctx.font = 'bold ' + paySize + 'px ' + cfg.FONT;
    while (paySize > 8 && ctx.measureText(pay).width > room) {
      paySize -= 0.5;
      ctx.font = 'bold ' + paySize + 'px ' + cfg.FONT;
    }
    U.text(ctx, pay, x + w - 8, y + 53, { size: paySize, align: 'right', color: '#1d1a2b', outline: false });
  }

  // ── 반복(루프): 고정 시간 간격 물리 ─────────────────────
  // 화면은 모니터 주사율(60·144Hz 등)대로 그리지만, 계산은 항상 1/60초씩 한다.
  // 그래서 어떤 모니터에서도 캐릭터 속도가 같다.
  var acc = 0;
  var last = 0;
  function frame(now) {
    var dt = last ? (now - last) / 1000 : 0;
    last = now;
    if (dt > 0.25) dt = 0.25; // 창이 멈췄다 돌아오면 너무 많이 계산하지 않게
    acc += dt;
    while (acc >= cfg.STEP) {
      update(cfg.STEP);
      PF.input.endStep();
      acc -= cfg.STEP;
    }
    render();
    requestAnimationFrame(frame);
  }

  // ── 시작 ────────────────────────────────────────────────
  function start() {
    canvas = document.getElementById('screen');
    ctx = canvas.getContext('2d');
    low = document.createElement('canvas');
    // 고해상도면 그림판을 R배(960x540)로 만들고, 그릴 때마다 R배 변환을 걸어 320x180 좌표로 그린다 (hires.js)
    low.width = VW * PF.hires.R;
    low.height = VH * PF.hires.R;
    lctx = low.getContext('2d');

    setupNickInput();
    setupFileInput();
    PF.input.init();
    PF.input.addListener(onAnyKey);
    // 자동 시연 관리자: 시연 세션의 알림은 onDemoEvent(화면 효과만)로 받는다
    attract = PF.attract.createAttract({ maps: (window.PF_ASSETS && window.PF_ASSETS.maps) || {}, onEvent: onDemoEvent });
    watchSize();
    resize();
    loadAll();
    if (MOBILE) setupTouch();
    setState('title');

    // 타일셋 → 큰 그림 시트 순서로 준비한 뒤 시작 (둘 다 없으면 대체 그림)
    PF.tileset.init(function () {
      PF.spritesheet.init(function () {
        requestAnimationFrame(frame);
      });
    });
  }

  /**
   * 모바일 판 터치 연결 (touch.js): 화면을 톡 치면
   *   타이틀 → 닉네임 (오른쪽 랭킹 표를 치면 오늘/전체 바꾸기), 시연 중 → 타이틀, 결과 → 처음으로,
   *   게임 중 → 컷신·완료 연출 건너뛰기 (Enter와 같은 가상 키)
   */
  function setupTouch() {
    PF.touch.init();
    PF.touch.setMuted(PF.audio.isMuted());
    PF.touch.onMute(toggleMute);
    PF.touch.setPointMapper(function (cx, cy) { // 화면(CSS) 좌표 → 게임 가상 좌표
      var rect = canvas.getBoundingClientRect();
      var devPerCss = canvas.width / rect.width;
      return { x: ((cx - rect.left) * devPerCss - lay.x) / lay.scale, y: ((cy - rect.top) * devPerCss - lay.y) / lay.scale };
    });
    PF.touch.onTap(function (x) {
      PF.audio.unlock();
      if (modal) return;
      if (state === 'demo') { attract.key(); goTitle(); return; }
      if (state === 'title') {
        attract.key();
        if (x >= 178) { titleBoard = titleBoard === 'today' ? 'all' : 'today'; return; } // 랭킹 표를 치면 바꾸기
        PF.audio.play('select');
        setState('nick');
        return;
      }
      if (state === 'result') {
        if (stateTime >= cfg.RESULT_INPUT_LOCK) { PF.audio.play('select'); goTitle(); }
        return;
      }
      if (state === 'play') PF.input.tap('VConfirm'); // 건너뛰기
    });
  }

  // 디버그·자동 점검용 창구 (게임 진행에는 쓰지 않는다)
  PF.debug = {
    state: function () { return state; },
    session: function () { return session; },
    records: function () { return store.records; },
    store: function () { return store; },
    layout: function () { return lay; },
    demo: function () { return attract && attract.demo; },
    // 화면 확인용: 20초를 기다리지 않고 타이틀에서 바로 시연을 연다
    startDemo: function () { if (state === 'title' && !modal) { attract.start(); enterDemo(); } },
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(window.PF);

</script>
</body>
